  <article>
    <h1 class="text-3xl font-bold mb-2">Vue3 父组件调用子组件的方法-子组件向父组件传值</h1>
    <div class="text-sm text-base-content/50 mb-8 flex items-center gap-3">
      <span>2022-08-11</span>
      <span class="badge badge-sm badge-outline">前端开发</span>
    </div>
    <div class="post-content"><p>> 父组件是不能直接访问子组件的方法。需要子组件手动的抛出才行。<br><br><h3>setup写法</h3><br><br>``<code>vue<br>// 父组件<br><template><br>    <div><br>        <h1>父组件</h1><br>        <a-button type="primary" @click="create">调用子组件</a-button><br>        <Operate ref="operateRef" @childClick="childClick" msg="hello"></Operate><br>    </div><br></template><br><br><script lang="ts"><br>import { ref } from 'vue';<br>import Operate from './operate.vue';<br><br> export default defineComponent({<br>  components: {<br>      Operate<br>  },<br>  setup() {<br>  // 创建子组件的引用<br>  	const operateRef = ref(null)<br> 	const create = ()=>{<br> 		 // 子组件导出的是一个函数，所以直接调用value<br>    	operateRef.value().showCreate();<br> 	}<br> 	const childClick = (e)=>{<br>		console.log('子组件传递的方法')<br>	}<br>    <br>  // 导出方法<br>    return {<br>      child,<br>      handleClick<br>    }<br>  }<br>});<br></script><br><br><br>// 子组件<br><template><br>	<h1>子组件</h1><br></template><br><br><script lang="ts"><br>import { defineComponent, ref } from 'vue'<br>export default defineComponent({<br>  emits: [<br>    'child-click'<br>  ],<br>  props: {<br>    msg: String<br>  },<br>    <br>  setup(props, context) {<br>  	// 向父组件传事件<br>    const handleClick = () => {<br>      context.emit('child-click', context)<br>    }<br>    <br>	// 父组件调用子组件的事件<br>	const childMethod = () =>{<br>		console.log("子组件的事件被触发了",msg)<br>	}<br>    <br>    return {<br>      props,<br>      handleClick,<br>      childMethod<br>    }<br>  },<br>}}<br></script><br></code>`<code><br><br><h3>＜script setup＞语法糖写法</h3><br><br>父组件<br><br></code>`<code>vue<br><template><br>    <div><br>        <h1>父组件</h1><br>        <a-button type="primary" @click="create">调用子组件</a-button><br>        <Operate ref="operateRef" @childClick="childClick"></Operate><br>    </div><br></template><br><br><script lang="ts" setup><br>import { ref } from 'vue';<br>import Operate from './operate.vue';<br><br>// 创建子组件的引用<br>const operateRef = ref();<br><br>// 调用子组件的方法<br>const create = () => {<br>    // 子组件导出的是一个函数，所以直接调用value<br>    operateRef.value().showCreate();<br>};<br><br>// 监听子组件传递的方法<br>const childClick = (e: any) => {<br>	console.log('子组件传递的方法', e)<br>};<br> <br></script><br></code>`<code><br><br>子组件<br><br></code>`<code>vue<br><template><br>	<h1>子组件</h1><br></template><br><br><script lang="ts" setup><br>import { ref, defineExpose } from 'vue';<br> // 定义上报事件<br>const emit = defineEmits(['childClick']);<br>const showCreate = () => {<br>	console.log("Child components");<br>    // 传递给父组件<br>    emit('childClick', "Child components");<br>};<br>    <br> // 重点！！！一定要导出不然会报错<br> // 注意这里导出的是函数，父组件的value就是函数，<br> // 如果是对象父组件的value就是对象<br>defineExpose(() => ({<br>	showCreate,<br>}))<br><br></script><br><br><script lang="ts"><br>export default {<br>	name: 'Operate',<br>};<br></script><br></code>``</p></div>
