<h1 class="text-3xl font-bold mb-2">史上最轻量的前端框架-VanillaJS？</h1>
<div class="text-sm text-base-content/50 mb-8 flex items-center gap-3">
<span>2022-05-31</span><span class="badge badge-sm badge-outline">前端开发</span></div>
<div class="post-content"><p>答案：是指没有用任何别的框架，如jQuery等的纯JS：</p><p>VanillaJs === JavaScript</p><p>> Vanilla JavaScript不是框架，更不是别的奇奇怪怪的东西，它就是指最朴素的原生JavaScript</p><p> 背景：</p><p>> Vanilla：意思是“香草”。这个词与冰淇淋有关，没有味道的冰淇淋就是香草味冰淇淋，把这个概念移植到JS中，这仅仅只是为了区别使用了如jQuery等框架的JS。</p></div></article></main>
