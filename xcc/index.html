ions":["没有选择参加周日活动","选择了参加周日活动","两项都选择了","无法判断是否选择参加周日活动","两项都没有选择"],"answer":1,"explanation":"相容/不相容选言命题在“至少一项为真”时，否定一项即可肯定另一项。"},{"id":"Q0153","type":"logic","topic":"削弱论证","stem":"新上线自助终端后，大厅排队人数减少，因此自助终端必然提高了办事效率。 哪项如果为真，最能削弱上述结论？","options":["同期很多业务改为无需到大厅办理","同期大厅缩短了开放时间","自助终端界面更加清晰","大厅为终端设置了操作指南","办事群众对服务的满意度较高"],"answer":1,"explanation":"同期线下业务减少是另一种解释，削弱因果归因。"},{"id":"Q0154","type":"logic","topic":"削弱论证","stem":"某培训班学员平均成绩高于其他班，所以该培训方法一定更有效。 哪项如果为真，最能削弱上述结论？","options":["该班入学时的平均基础明显更高","该班教材版本与其他班相同","培训时间为六周","大多数学员按时到课","授课使用了多媒体"],"answer":1,"explanation":"起点差异是混杂变量，不能仅凭期末成绩归因于培训。"},{"id":"Q0155","type":"logic","topic":"削弱论证","stem":"道路增加摄像头后事故数下降，说明安装摄像头导致事故减少。 哪项如果为真，最能削弱上述结论？","options":["同期该道路实施了全面限速改造","事故统计口径前后相同","摄像头安装位置醒目","有些司机对摄像头有意见","新设备运行稳定"],"answer":1,"explanation":"同时发生的限速措施可能解释事故下降。"},{"id":"Q0156","type":"logic","topic":"削弱论证","stem":"试点学校使用电子教材后阅读成绩提升，故电子教材优于纸质教材。 哪项如果为真，最能削弱上述结论？","options":["电子教材可放大字体","试点学校同时增加了每周阅读辅导课","部分家长支持试点","试点持续一学期","学生可以离线阅读"],"answer":1,"explanation":"辅导课是可能的替代原因。"},{"id":"Q0157","type":"logic","topic":"削弱论证","stem":"某社区实施垃圾分类宣传后回收率提升，因此宣传是唯一原因。 哪项如果为真，最能削弱上述结论？","options":["社区同时增设了大量分类回收站","宣传单发放数量很多","居民参与了线上答题","社区面积不大","宣传口号容易记忆"],"answer":1,"explanation":"新增回收站会直接改变回收便利度，是替代解释。"},{"id":"Q0158","type":"logic","topic":"削弱论证","stem":"公司实行弹性上班后员工离职率降低，因此弹性制度必定改善留任。 哪项如果为真，最能削弱上述结论？","options":["弹性制度适用于大多数岗位","同期公司明显提高了员工薪酬","离职率采用同一统计口径","制度通过了内部讨论","员工上下班时间更分散"],"answer":1,"explanation":"涨薪可能是留任的主要原因。"},{"id":"Q0159","type":"logic","topic":"削弱论证","stem":"新增绿地后周边房价上涨，所以新增绿地必然推高房价。 哪项如果为真，最能削弱上述结论？","options":["绿地种植了多种植物","同期地铁新线路在该区域开通","居民会到绿地散步","绿地维护良好","小区道路平整"],"answer":1,"explanation":"交通改善也可能推高房价。"},{"id":"Q0160","type":"logic","topic":"削弱论证","stem":"上线新客服系统后投诉率下降，新系统必然提高了客户满意度。 哪项如果为真，最能削弱上述结论？","options":["同时投诉入口从首页移到三级菜单","客服系统支持自动分流","新系统界面美观","系统升级用时两周","人工客服仍然存在"],"answer":1,"explanation":"投诉入口更难找导致投诉数下降，不等于满意度提高。"},{"id":"Q0161","type":"logic","topic":"加强论证","stem":"某单位引入网上预约后，窗口平均等待时间缩短。该单位认为预约制度有助于缩短等待。 哪项最能支持上述判断？","options":["大厅装修风格改变","预约网页采用蓝色主题","同期窗口数量未增加，办事总量与以往相近","部分工作人员参与了培训","工作日仍然有高峰"],"answer":2,"explanation":"排除窗口扩充和业务量下降等替代原因，支持预约制度的解释。"},{"id":"Q0162","type":"logic","topic":"加强论证","stem":"学校推行每日阅读15分钟后，学生阅读理解表现有所提高，校方认为措施有效。 哪项最能支持上述判断？","options":["学校增加了食堂座位","大部分学生有运动习惯","执行措施的班级与未执行班级起点接近，前者提高更多","学校更换了校牌","老师喜欢阅读"],"answer":2,"explanation":"设置可比对照组，强化因果判断。"},{"id":"Q0163","type":"logic","topic":"加强论证","stem":"某程序优化后服务响应更快，研发组认为优化降低了接口延迟。 哪项最能支持上述判断？","options":["页面按钮颜色变化","用户总量有所增长","在相同硬件和负载下，优化版本的响应时间显著缩短","团队采用了新的周报模板","接口文档变长"],"answer":2,"explanation":"同条件对照实验支持性能优化效果。"},{"id":"Q0164","type":"logic","topic":"加强论证","stem":"实行错峰配送后，某仓库当天积压包裹减少。管理者认为错峰措施奏效。 哪项最能支持上述判断？","options":["仓库使用新的工牌","送货车辆颜色统一","配送量相近的对照仓库未错峰且积压量没有下降","当地天气多云","订单类别很多"],"answer":2,"explanation":"对照组和相同配送量削弱其他解释。"},{"id":"Q0165","type":"logic","topic":"加强论证","stem":"某地区开设线上政务课程后，群众办理业务的退件率降低。 哪项最能支持上述判断？","options":["课程使用插画","报名流程比较简单","对比同类地区，只有参加课程比例较高地区的退件率持续下降","办公楼新装灯具","工作人员换工装"],"answer":2,"explanation":"同类地区的差异强化了课程的作用。"},{"id":"Q0166","type":"logic","topic":"加强论证","stem":"定期复盘故障后，项目组线上事故减少，负责人认为复盘提升了质量。 哪项最能支持上述判断？","options":["周会增加了零食","日志界面更新","故障密度相近的其他组未复盘，事故并未同步下降","项目人数稳定","大家对复盘名称很熟悉"],"answer":2,"explanation":"对照比较支持复盘与事故减少存在关联。"},{"id":"Q0167","type":"logic","topic":"逻辑谬误","stem":"下列论证最主要的问题是什么？\n某位受访者认为公共交通不便，所以这座城市的所有居民都认为公共交通不便。","options":["偷换指标","不当预测","忽略其他原因","以偏概全","评价指标不当"],"answer":3,"explanation":"关键缺陷：以偏概全。题干依据不足以推出其绝对化结论。"},{"id":"Q0168","type":"logic","topic":"逻辑谬误","stem":"下列论证最主要的问题是什么？\n去年报名人数增加，今年报名人数也一定增加。","options":["倒置条件","偷换指标","不当预测","忽略其他原因","不当类比"],"answer":2,"explanation":"关键缺陷：不当预测。题干依据不足以推出其绝对化结论。"},{"id":"Q0169","type":"logic","topic":"逻辑谬误","stem":"下列论证最主要的问题是什么？\n因为使用新软件后工作效率提高，所以效率提高只能由新软件造成。","options":["评价指标不当","偷换指标","忽略其他原因","不当类比","倒置条件"],"answer":2,"explanation":"关键缺陷：忽略其他原因。题干依据不足以推出其绝对化结论。"},{"id":"Q0170","type":"logic","topic":"逻辑谬误","stem":"下列论证最主要的问题是什么？\n一名优秀管理者喜欢运动，因此所有喜欢运动的人都是优秀管理者。","options":["倒置条件","忽略其他原因","不当预测","以偏概全","不当类比"],"answer":0,"explanation":"关键缺陷：倒置条件。题干依据不足以推出其绝对化结论。"},{"id":"Q0171","type":"logic","topic":"逻辑谬误","stem":"下列论证最主要的问题是什么？\n某公司网站访问量高，因此它的产品质量一定好。","options":["以偏概全","倒置条件","忽略其他原因","评价指标不当","偷换指标"],"answer":3,"explanation":"关键缺陷：评价指标不当。题干依据不足以推出其绝对化结论。"},{"id":"Q0172","type":"logic","topic":"逻辑谬误","stem":"下列论证最主要的问题是什么？\n某校一位毕业生年薪很高，所以这所学校所有毕业生收入都很高。","options":["忽略其他原因","不当预测","以偏概全","评价指标不当","倒置条件"],"answer":2,"explanation":"关键缺陷：以偏概全。题干依据不足以推出其绝对化结论。"},{"id":"Q0173","type":"logic","topic":"逻辑谬误","stem":"下列论证最主要的问题是什么？\n两个城市都建有公园，因此两城经济结构必然相同。","options":["倒置条件","评价指标不当","忽略其他原因","不当预测","不当类比"],"answer":4,"explanation":"关键缺陷：不当类比。题干依据不足以推出其绝对化结论。"},{"id":"Q0174","type":"logic","topic":"逻辑谬误","stem":"下列论证最主要的问题是什么？\n某产品广告点击量增加，因此实际销售额一定增长。","options":["评价指标不当","以偏概全","不当预测","忽略其他原因","偷换指标"],"answer":4,"explanation":"关键缺陷：偷换指标。题干依据不足以推出其绝对化结论。"},{"id":"Q0175","type":"logic","topic":"综合推理","stem":"所有部门都完成了培训，并非所有部门都通过考核。哪项一定为真？","options":["所有部门都未通过","至少一个部门未通过","至少一个部门未培训","所有部门都通过","无法得知"],"answer":1,"explanation":"“并非所有都”可等价转化为“至少一个不”。"},{"id":"Q0176","type":"logic","topic":"综合推理","stem":"甲比乙早到，乙比丙早到。以下哪项一定为真？","options":["丙比甲早到","甲比丙早到","甲与丙同时到","乙最早到","无法比较甲丙"],"answer":1,"explanation":"关系传递：甲＜乙＜丙（时间先后）。"},{"id":"Q0177","type":"logic","topic":"综合推理","stem":"只有完成身份核验才能获取准考证。小林已经获取准考证。以下哪项必然成立？","options":["小林一定没核验","小林已完成核验","所有核验者都获取准考证","小林已通过考试","无法判断"],"answer":1,"explanation":"“只有A才B”表示B→A；获取准考证推出完成核验。"},{"id":"Q0178","type":"logic","topic":"综合推理","stem":"某项目规定：甲、乙至少一人值班。已知甲没有值班。可以推出？","options":["甲乙都未值班","乙值班","乙未值班","甲曾经值班","两人同时值班"],"answer":1,"explanation":"至少一个为真，否定甲则肯定乙。"},{"id":"Q0179","type":"logic","topic":"综合推理","stem":"如果通过审核，就会收到通知。小张未收到通知。可以推出？","options":["小张通过审核","小张未通过审核","通知延迟一定是网络故障","审核尚未开始","审核不需要通知"],"answer":1,"explanation":"否定后件推出否定前件。"},{"id":"Q0180","type":"logic","topic":"综合推理","stem":"某机构规定：参加面试必须先通过资格审查。阿明未通过资格审查。能推出？","options":["阿明参加了面试","阿明不能按该规定参加面试","阿明一定考试不合格","阿明申请资料齐全","阿明自动获得录 rivate","technically complex","available only on weekends"],"answer":0,"explanation":"inclusive强调包容不同群体。","passage":"Many cities have moved public services online. Residents can apply for permits, pay fees, and check application results without visiting a government office. Online systems save travel time, especially for people who live far from city centers. Yet the change also creates challenges. Some older residents are unfamiliar with digital forms, and others have limited internet access. A city that relies only on online tools may unintentionally exclude these groups. To make services more inclusive, local governments can keep a small number of in-person counters, provide clear instructions, and offer telephone assistance. Digital transformation should be judged not only by how many services are online, but also by whether people can use them successfully."},{"id":"Q0220","type":"reading","topic":"习惯与学习","stem":"What is the central message?","options":["Long sessions are always best","Consistent practice with feedback supports learning","Mistakes should be ignored","People should never make schedules","Learning requires expensive tools"],"answer":1,"explanation":"关键词是 regular practice、feedback 和 review mistakes。","passage":"Learning a new skill often feels difficult at the beginning. People may spend several hours studying in one day and then stop for a week. Research on learning habits suggests that shorter but more frequent sessions can be easier to maintain. Regular practice helps learners recall information and notice weak areas. However, repetition alone is not enough. Learners need feedback: they should check why an answer is wrong and try similar questions later. A useful study plan therefore combines a realistic schedule, active practice, and review of mistakes. The most effective plan is not necessarily the most demanding one. It is the plan that a learner can follow consistently while making measurable progress."},{"id":"Q0221","type":"reading","topi s."},{"id":"Q0225","type":"reading","topic":"远程办公","stem":"Which benefit of remote work is mentioned?","options":["Longer commuting","Lower office expenses","More unnecessary meetings","Less written communication","No need for goals"],"answer":1,"explanation":"直接指出减少 office expenses。","passage":"Remote work gives employees more control over where they complete tasks. For some organizations, it reduces commuting time and office expenses. However, working from home can also make cooperation harder. Quick questions may require scheduled calls, and new employees may struggle to learn how a team operates. Managers should therefore avoid treating remote work as a simple choice between freedom and control. Clear goals, shared documentation, and regular check-ins can help teams coordinate. Performance should be measured by results rather than by the number of hours employees appear online. A thoughtful policy considers the nature of each job and the needs of the team."},{"id":"Q0226","type":"reading","topic":"远程办公","stem":"What difficulty may new employees face?","options":["Learning team practices","Finding office parking","Buying office chairs","Using paper invoices","Reading job advertisements"],"answer":0,"explanation":"新员工可能难以了解团队运作方式。","passage":"Remote work gives employees more control over where they complete tasks. For some organizations, it reduces commuting time and office expenses. However, working from home can also make cooperation harder. Quick questions may require scheduled calls, and new employees may struggle to learn how a team operates. Managers should therefore avoid treating remote work as a simple choice between freedom and control. Clear goals, shared documentation, and regular check-ins can help teams coordinate. Performance should be measured by results rather than by the number of hours employees appear online. A thoughtful policy considers the nature of each job and the needs of the team."},{"id":"Q0227","type":"reading","topic":"远程办公","stem":"W ","type":"reading","topic":"远程办公","stem":"The author’s attitude toward remote work is ____.","options":["balanced","entirely negative","unquestionably positive","uninterested","angry"],"answer":0,"explanation":"既讲好处也讲限制，提出有条件政策。","passage":"Remote work gives employees more control over where they complete tasks. For some organizations, it reduces commuting time and office expenses. However, working from home can also make cooperation harder. Quick questions may require scheduled calls, and new employees may struggle to learn how a team operates. Managers should therefore avoid treating remote work as a simple choice between freedom and control. Clear goals, shared documentation, and regular check-ins can help teams coordinate. Performance should be measured by results rather than by the number of hours employees appear online. A thoughtful policy considers the nature of each job and the needs of the team."},{"id":"Q0230","type":"reading","topic":"社区调查","stem":"What was the council’s initial plan?","options":["To build another library","To shorten opening hours","To offer evening classes","To remove study rooms","To raise membership fees"],"answer":1,"explanation":"开始准备减少开放时间以节约成本。","passage":"A neighborhood council wanted to know why fewer people used the local library. Its first idea was to reduce opening hours to save money. Before making a decision, however, the council interviewed residents. Many respondents said that the library closed too early for people who worked during the day. Others wanted more quiet study spaces. In response, the library tested evening opening hours twice a week and rearranged some rooms for individual study. Visits rose during the pilot period. The council then decided to continue the trial while collecting more data. The case shows that listening to users can reveal problems that simple attendance numbers cannot explain."},{"id":"Q0231","type":"reading","topic":"社区调查","stem":"What did many residents complain about?","options":["The bu contracts"],"answer":1,"explanation":"先询问员工的出行方式。","passage":"A medium-sized company hoped to reduce the environmental impact of employee travel. Instead of immediately requiring everyone to use public transport, it began by asking staff how they traveled to work. The survey showed that many employees wanted alternatives but were concerned about unreliable bus schedules. The company then worked with a local transport provider to offer updated route information and introduced flexible starting times. Six months later, more employees reported using buses or trains at least twice a week. The company plans to continue monitoring travel patterns before deciding whether to expand the program. The project illustrates how practical barriers must be addressed before people can change established habits."},{"id":"Q0236","type":"reading","topic":"绿色通勤","stem":"What worried many employees?","options":["Unreliable bus schedules","Too many electric cars","Lack of office computers","Limited lunch options","Frequent public meetings"],"answer":0,"explanation":"原文写到 concerned about unreliable bus schedules。","passage":"A medium-sized company hoped to reduce the environmental impact of employee travel. Instead of immediately requiring everyone to use public transport, it began by asking staff how they traveled to work. The survey showed that many employees wanted alternatives but were concerned about unreliable bus schedules. The company then worked with a local transport provider to offer updated route information and introduced flexible starting times. Six months later, more employees reported using buses or trains at least twice a week. The company plans to continue monitoring travel patterns before deciding whether to expand the program. The project illustrates how practical barriers must be addressed before people can change established habits."},{"id":"Q0237","type":"reading","topic":"绿色通勤","stem":"Which measure was introduced?","options":["Flexible starting times","Mandatory ni ssumptions. In this way, data can support public trust when it is used carefully."},{"id":"Q0243","type":"reading","topic":"数据透明","stem":"Why is transparency important?","options":["It prevents every error automatically","It helps people understand and question decisions","It hides the methods used","It reduces participation","It replaces all evidence"],"answer":1,"explanation":"透明使公众理解并质疑假设。","passage":"Organizations increasingly use data to decide where public resources should go. For example, a city may compare the number of service requests across neighborhoods before opening a new office. Data can highlight needs that are not immediately visible. Yet data do not automatically lead to fair decisions. If some groups rarely submit online requests, their needs may be underrepresented. Decision makers should examine how information was collected and combine numbers with community feedback. They should also explain the reasons behind important choices. Transparency allows residents to understand decisions and question assumptions. In this way, data can support public trust when it is used carefully."},{"id":"Q0244","type":"reading","topic":"数据透明","stem":"Which title best fits?","options":["Using Data Responsibly in Public Decisions","How to Delete Public Records","Why Numbers Are Always Wrong","The History of Offices","Avoiding All Public Feedback"],"answer":0,"explanation":"强调谨慎、包容和透明的数据决策。","passage":"Organizations increasingly use data to decide where public resources should go. For example, a city may compare the number of service requests across neighborhoods before opening a new office. Data can highlight needs that are not immediately visible. Yet data do not automatically lead to fair decisions. If some groups rarely submit online requests, their needs may be underrepresented. Decision makers should examine how information was collected and combine numbers with community feedback. They should also explain the reasons behind important choices. Transparency allows residents to understand decisions and question assumptions. In this way, data can support public trust when it is used carefully."},{"id":"Q0245","type":"newformat","topic":"段落匹配","stem":"Read the paragraph and choose the best heading.\nSmall, regular efforts usually outperform occasional long sessions when the goal is to build a durable habit.","options":["The value of pilot projects","Using mistakes to improve","Why consistency matters","Making information understandable","Removing barriers to behavior change"],"answer":2,"explanation":"段落中心：Why consistency matters；关注主题句及重复概念。"},{"id":"Q0246","type":"newformat","topic":"段落匹配","stem":"Read the paragraph and choose the best heading.\nClear public instructions should use everyday language and explain one action at a time.","options":["Making information understandable","Measuring results rather than activity","Why consistency matters","Clarifying team responsibilities","Supporting digital inclusion"],"answer":0,"explanation":"段落中心：Making information understandable；关注主题句及重复概念。"},{"id":"Q0247","type":"newformat","topic":"段落匹配","stem":"Read the paragraph and choose the best heading.\nFeedback from service users can help agencies discover barriers invisible in simple numerical reports.","options":["Responsible use of data","Making information understandable","Learning from users","Using mistakes to improve","Removing barriers to behavior change"],"answer":2,"explanation":"段落中心：Learning from users；关注主题句及重复概念。"},{"id":"Q0248","type":"newformat","topic":"段落匹配","stem":"Read the paragraph and choose the best heading.\nTeams often cooperate better when responsibilities and deadlines are written down and shared.","options":["Supporting digital inclusion","The value of pilot projects","Learning from users","Why consistency matters","Clarifying team responsibilities"],"answer":4,"explanation":"段落中心：Clarifying team responsibilities；关注主题句及重复概念。"},{"id":"Q0249","type":"newformat","topic":"段落匹配","stem":"Read the paragraph and choose the best heading.\nAn organization should test a change on a small scale before applying it everywhere.","options":["Making information understandable","The value of pilot projects","Clarifying team responsibilities","Why consistency matters","Using mistakes to improve"],"answer":1,"explanation":"段落中心：The value of pilot projects；关注主题句及重复概念。"},{"id":"Q0250","type":"newformat","topic":"段落匹配","stem":"Read the paragraph and choose the best heading.\nKeeping alternative channels allows people with limited internet access to obtain essential services.","options":["Using mistakes to improve","Clarifying team responsibilities","Responsible use of data","Why consistency matters","Supporting digital inclusion"],"answer":4,"explanation":"段落中心：Supporting digital inclusion；关注主题句及重复概念。"},{"id":"Q0251","type":"newformat","topic":"段落匹配","stem":"Read the paragraph and choose the best heading.\nTracking errors by category helps learners decide which skills need more practice.","options":["Supporting digital inclusion","Using mistakes to improve","Clarifying team responsibilities","Measuring results rather than activity","Making information understandable"],"answer":1,"explanation":"段落中心：Using mistakes to improve；关注主题句及重复概念。"},{"id":"Q0252","type":"newformat","topic":"段落匹配","stem":"Read the paragraph and choose the best heading.\nPublic reports should state the origin of numbers and any important limitations.","options":["Making information understandable","Responsible use of data","The value of pilot projects","Using mistakes to improve","Removing barriers to behavior change"],"answer":1,"explanation":"段落中心：Responsible use of data；关注主题句及重复概念。"},{"id":"Q0253","type":"newformat","topic":"段落匹配","stem":"Read the paragraph and choose the best heading.\nCommuters change habits more readily when practical obstacles, such as unreliable schedules, are removed.","options":["Using mistakes to improve","Removing barriers to behavior change","Making information understandable","Learning from users","Clarifying team responsibilities"],"answer":1,"explanation":"段落中心：Removing barriers to behavior change；关注主题句及重复概念。"},{"id":"Q0254","type":"newformat","topic":"段落匹配","stem":"Read the paragraph and choose the best heading.\nEffective managers evaluate work through meaningful outcomes instead of watching every minute.","options":["Learning from users","Supporting digital inclusion","Measuring results rather than activity","Responsible use of data","Clarifying team responsibilities"],"answer":2,"explanation":"段落中心：Measuring results rather than activity；关注主题句及重复概念。"}],"notes":[{"id":"M01","group":"math","topic":"算术","title":"整数、整除与余数","level":"基础","time":35,"summary":"整除与余数是快速计算的基础，先掌握奇偶性、最大公约数和最小公倍数。","points":["整除：a÷b 的余数为0；a=bq+r，0≤r<|b|。","奇偶：奇+奇=偶；奇×奇=奇；任一偶数乘积为偶。","最大公约数用辗转相除；最小公倍数×最大公约数=两正整数乘积。","含余数问题可先写成 a=bq+r，再代入限制。"],"example":"例：两数 12 和 18 的最大公约数为6，最小公倍数为36。","pitfall":"不要把“至少是几的倍数”误认为“等于几”。","tag":"算术"},{"id":"M02","group":"math","topic":"百分比","title":"分数、比例与百分比","level":"基础","time":45,"summary":"核心是统一基准量，区分增加百分之几和占比多少。","points":["部分量=总量×比例；比例=部分÷总体。","增加 p% 后：现值=原值×(1+p%)；减少 p% 后：现值=原值×(1−p%)。","连续两次增长需连乘，不能简单相加。","混合比例用“部分相加÷总体相加”，不要直接平均比例。"],"example":"例：200元上涨10%再下降10%，得到200×1.1×0.9=198元，而不是200元。","pitfall":"上涨10%再下降10%不能抵消。","tag":"百分比"},{"id":"M03","group":"math","topic":"比例","title":"比例、工程与行程","level":"基础","time":50,"summary":"比例分配、总工作量与速度是管综高频应用。","points":["a:b=2:3，总数100，则a=100×2/5=40。","速度×时间=路程；相遇用速度和，追及用速度差。","工程题常设总工作量为1；效率=1/时间。","工作效率变化要区分人均效率与总效率。"],"example":"例：甲单独6天完成，乙单独3天完成，合作1天完成1/6+1/3=1/2，合做2天。","pitfall":"工程效率相加、完成时间不能直接相加。","tag":"行程问题"},{"id":"M04","group":"math","topic":"一元方程","title":"方程与代数式","level":"基础","time":50,"summary":"识别未知量，列式并验证解的合法性。","points":["一元一次方程 ax+b=c，x=(c−b)/a (a≠0)。","一元二次方程 ax²+bx+c=0，判别式Δ=b²−4ac。","一元二次方程的韦达定理：x₁+x₂=−b/a，x₁x₂=c/a。","分式方程求解后必须排除使分母为0的根。"],"example":"例：x²−5x+6=0，因式分解(x−2)(x−3)=0，x=2或3。","pitfall":"忽略定义域、隐含正整数约束。","tag":"一元方程"},{"id":"M05","group":"math","topic":"不等式","title":"不等式、绝对值与函数","level":"提升","time":55,"summary":"处理符号方向、区间与函数极值。","points":["乘除负数时不等号方向反转。","|x−a|≤r 相当于 a−r≤x≤a+r（r≥0）。","二次函数 y=ax²+bx+c 的对称轴 x=−b/(2a)。","当a>0，二次函数开口向上，顶点取最小值。"],"example":"例：|x−3|<2，解为1<x<5。","pitfall":"忽略负数乘除反向及端点是否取等。","tag":"一元方程"},{"id":"M06","group":"math","topic":"数列","title":"等差数列与等比数列","level":"基础","time":40,"summary":"掌握通项与前n项和，学会从首末项反推。","points":["等差通项：aₙ=a₁+(n−1)d。","等差和：Sₙ=n(a₁+aₙ)/2。","等比通项：aₙ=a₁qⁿ⁻¹。","等比和（q≠1）：Sₙ=a₁(1−qⁿ)/(1−q)。"],"example":"例：3、7、11、15，公差4，第10项为39。","pitfall":"注意项数是n−1次间隔。","tag":"数列"},{"id":"M07","group":"math","topic":"平面几何","title":"平面几何、解析几何","level":"基础","time":55,"summary":"先画图，掌握常见面积、周长、相似与勾股关系。","points":["三角形面积S=底×高/2；长方形面积ab；圆面积πr²。","直角三角形满足a²+b²=c²，常用3-4-5、5-12-13。","相似三角形对应边比k，面积比k²。","两点距离√[(x₂−x₁)²+(y₂−y₁)²]。"],"example":"例：直角边6和8，斜边=10，面积=24。","pitfall":"图示不一定按真实比例绘制。","tag":"平面几何"},{"id":"M08","group":"math","topic":"数据分析","title":"集合、计数与概率","level":"提升","time":60,"summary":"理解容斥、排列组合、古典概率。","points":["容斥：|A∪B|=|A|+|B|−|A∩B|。","排列 A(n,m)=n!/(n−m)!；组合 C(n,m)=n!/[m!(n−m)!]。","古典概率P=有利等可能结果数/总等可能结果数。","有放回与无放回，结果数不同；至少一项可考虑用反面。"],"example":"例：班级30人，数学18人、英语17人，至少5人两科都喜欢。","pitfall":"默认等可能需有明确依据。","tag":"概率"},{"id":"M09","group":"math","topic":"条件充分性","title":"条件充分性五选项判定","level":"必学","time":65,"summary":"核心是判断“能否唯一确定”，而非求出全部数值。","points":["A：（1）够、（2）不够。B：（2）够、（1）不够。","C：两个都不够，联合足够。D：两个单独都足够。E：联合也不够。","判断每条条件时要考虑反例；存在两个不同结果就不充分。","“是/否”的判断题：条件能锁定结论真或假，均视为可确定答案；本练习题以明确问“是否成立”的形式设计。"],"example":"例：能否确定x？（1）x+y=5；（2）x−y=1。单独不够，联合得x=3，选C。","pitfall":"不要把“可以求出一个可能答案”等同“唯一确定”。","tag":"条件充分性"},{"id":"L01","group":"logic","topic":"形式逻辑","title":"概念、集合与三段论","level":"基础","time":40,"summary":"通过包含关系快速排除倒置命题。","points":["所有A都是B，可以用集合A⊆B表示。","所有A是B，所有B是C，则所有A是C。","“有些A是B”不意味着“有些A不是B”。","结论不能凭空引入前提未支持的对象。"],"example":"例：所有法务人员都参加培训，所有培训人员都有签到记录，可推出所有法务人员都有签到记录。","pitfall":"把A⊆B误推为B⊆A。","tag":"形式逻辑"},{"id":"L02","group":"logic","topic":"假言推理","title":"充分与必要条件","level":"基础","time":50,"summary":"先把自然语言翻成箭头，再判断否后肯前。","points":["“如果P，那么Q”：P→Q，可用“非Q→非P”逆否。","“只有P，才Q”：Q→P。","肯定后件Q不能推出P，否定前件非P不能推出非Q。","“除非P，否则Q”等句式需先逐句标注语义。"],"example":"例：如果审核通过就收到通知；未收到通知→审核未通过。","pitfall":"不要把充分条件和必要条件倒置。","tag":"假言推理"},{"id":"L03","group":"logic","topic":"选言推理","title":"或、且、非与德摩根律","level":"基础","time":45,"summary":"掌握量词否定与联言、选言命题。","points":["P且Q为真必须两个都真；P或Q至少一真。","非(P且Q)=非P或非Q。","非(P或Q)=非P且非Q。","并非所有A都B = 有些A不是B。"],"example":"例：甲或乙至少一人值班，甲不值班→乙值班。","pitfall":"“并非所有”不是“所有都不”。","tag":"选言推理"},{"id":"L04","group":"logic","topic":"削弱论证","title":"削弱：另有他因、因果倒置","level":"必学","time":55,"summary":"削弱题先抓结论与前提的缺口。","points":["识别结论：作者最希望你相信哪句话？","削弱方法：存在其他原因、数据不可靠、样本不代表整体。","“相关”不等于“因果”，排查混杂变量。","不相关选项即使真实，也不能有效削弱。"],"example":"例：更换系统后效率上升，若同时减少了任务复杂度，则“全由新系统造成”被削弱。","pitfall":"不要选择只质疑细枝末节的选项。","tag":"削弱论证"},{"id":"L05","group":"logic","topic":"加强论证","title":"加强：排除他因与对照组","level":"必学","time":55,"summary":"优先找能弥补前提与结论缺口的证据。","points":["加强可提供对照组、排除混杂因素、证明机制。","因果题重点是“别的解释是否可排除”。","与结论高度相关且新增信息强的选项更有价值。","区分对背景的重复描述和真正新增证据。"],"example":"例：同等硬件负载条件下新版本更快，比“新版本界面更漂亮”更能加强性能结论。","pitfall":"别把简单重复论据当作最强加强。","tag":"加强论证"},{"id":"L06","group":"logic","topic":"逻辑谬误","title":"常见论证缺陷","level":"提升","time":45,"summary":"以偏概全、偷换概念、因果谬误是写作与逻辑共同基础。","points":["以偏概全：极小样本推出整体结论。","不当类比：两事物只在少数方面相似就推出其余方面相同。","偷换概念：前提与结论中关键词含义变化。","混淆相关与因果，或忽略第三变量。"],"example":"例：网站访问量高→产品质量一定好，是用访问量替代质量指标。","pitfall":"先对准“论据能否支撑结论”，再分类命名。","tag":"逻辑谬误"},{"id":"L07","group":"logic","topic":"综合推理","title":"排序、分组与信息列表","level":"提升","time":55,"summary":"多条件题可借助表格和排除法。","points":["排序题设定先后位置，逐条转为约束。","“至少一个”用∨，“恰好一个”额外加互斥。","把固定条件优先填入表格，再处理可能性分支。","对复杂选项逐一代入验证，避免口算混乱。"],"example":"例：甲早于乙，乙早于丙，则甲早于丙。","pitfall":"“不能同时参加”和“至少参加一个”是不同条件。","tag":"综合推理"},{"id":"W01","group":"writing","topic":"论证有效性分析","title":"199 写作一：识别与评析缺陷","level":"必学","time":75,"summary":"30分；围绕论证漏洞写分析文章，训练快速定位4处主要缺陷。","points":["审题时标出核心结论、每条论据与隐含假设。","高频缺陷：样本偏差、因果跳跃、概念替换、缺少可比性、结论过度。","建议结构：开头总结论证存在问题 → 4段逐点评析 → 结尾总结不成立。","评析不仅指出“有问题”，要写出“为什么论据不能支持结论”。"],"example":"例：某街道一季度投诉下降，不能仅凭投诉量判断服务满意度全面提高。","pitfall":"只批评观点立场而不分析推理链。","tag":"论证有效性分析"},{"id":"W02","group":"writing","topic":"论说文","title":"199 写作二：观点论证","level":"必学","time":75,"summary":"35分；论点鲜明、结构清晰、证据合理。","points":["开头界定概念，提出可论证的主论点。","主体常用3个并列分论点，每段“论点—解释—例子—回扣”。","设置一段回应可能的反对意见，提升完整性。","结尾回扣题目，不另立全新观点。"],"example":"例：谈“效率与公平”，可从资源效率、机会公平、可持续治理三个维度论证。","pitfall":"机械套模板而与材料脱节。","tag":"论说文"},{"id":"E01","group":"english","topic":"词义理解","title":"核心词与词组记忆法","level":"基础","time":45,"summary":"先熟悉词义与搭配，再学习其在句子中的用法。","points":["记忆卡使用：英文→中文→例句→第二天复习。","高频常见动词：maintain、improve、require、provide、reduce。","搭配优先记：depend on、consistent with、in spite of。","词汇复习按错词优先，不追求一次性记住所有。"],"example":"maintain accurate records：保持准确记录。","pitfall":"只背词形，不会在句子中识别含义。","tag":"词义理解"},{"id":"E02","group":"english","topic":"语法","title":"长难句：主谓宾与从句","level":"基础","time":55,"summary":"阅读不是逐词硬译；先识别主干和修饰成分。","points":["先找谓语，再定位真正主语，排除介词短语干扰。","that/which/who可引出定语从句；because/although引出状语从句。","遇到分词短语，先确认其修饰对象。","否定与比较词 often 改变整句结论。"],"example":"The plan that the team proposed was approved. 主干：The plan was approved.","pitfall":"把从句主语误当作全句主语。","tag":"语法"},{"id":"E03","group":"english","topic":"逻辑衔接","title":"完形：语境与逻辑连接","level":"基础","time":50,"summary":"完形优先找上下文语义关系，而不是只看空格附近。","points":["转折：however、yet、although；因果：because、therefore。","递进：furthermore、moreover；举例：for example。","固定搭配是重要线索，但要与全段含义一致。","做完后把答案带回全文顺读。"],"example":"The idea seems promising. However, it requires further testing.","pitfall":"忽视前后句的转折方向。","tag":"连词"},{"id":"E04","group":"english","topic":"数字公共服务","title":"阅读 A：定位与改写","level":"必学","time":60,"summary":"考试重心：按题干定位，再识别同义替换。","points":["快速看题干，圈人名、数字、态度词、因果词。","回原文定位对应句，比较选项与原文是否同义。","主旨题通读首末段和段落中心，避免以偏概全。","遇到绝对词 all / never / only 时提高警惕。"],"example":"原文“save travel time”可能对应选项“avoid unnecessary trips”。","pitfall":"凭背景常识选，不回原文找证据。","tag":"数字公共服务"},{"id":"E05","group":"english","topic":"段落匹配","title":"阅读 B：段落匹配与概括","level":"提升","time":55,"summary":"寻找段落核心，而非只匹配重复单词。","points":["概括每段主旨，一般由主题句与解释句共同支持。","注意转折后句常为观点重心。","标题要覆盖整段，不能只抓例子。","单词相同不意味着语义相同。"],"example":"谈“短时且经常的练习比突击更易坚持”，适合标题 Why consistency matters。","pitfall":"把最鲜明的例子当成段落主题。","tag":"段落匹配"},{"id":"E06","group":"english","topic":"翻译","title":"英语二翻译：通顺准确","level":"必学","time":50,"summary":"按句群理解，优先确保逻辑、主语和专业术语准确。","points":["先分解主句和从句，再调整为自然中文语序。","抽象词如 access、policy、service 按语境翻译。","连接词与否定不能丢，长定语可前置或拆句。","翻完通读中文，去除欧化和语病。"],"example":"Digital services should be accessible to everyone. → 数字化服务应当让每个人都能方便使用。","pitfall":"逐词翻译使中文不通顺。","tag":"翻译"},{"id":"E07","group":"english","topic":"小作文","title":"英语二小作文：邮件/通知","level":"必学","time":60,"summary":"目标是交际目的明确、格式准确、语法可靠。","points":["先确定身份、收件对象和任务动作：申请、建议、邀请、道歉。","第一段点明写信目的，第二段交代信息与要求。","语气按正式程度选择；末尾提供礼貌结束句。","写完检查时态、单复数、冠词及拼写。"],"example":"I am writing to invite you to our workshop next Friday.","pitfall":"套用与具体任务无关的华丽句。","tag":"小作文"},{"id":"E08","group":"english","topic":"大作文","title":"英语二大作文：图表描述","level":"必学","time":60,"summary":"优先保证图表信息准确，再解释主要变化并总结。","points":["第一段交代图表对象、时间范围与总体趋势。","第二段选择2–3个显著数据进行比较；不必逐点流水账。","原因分析应是合理推测，不应说成已证实事实。","第三段概括趋势或给出审慎展望。"],"example":"The chart shows a steady increase in the share of online applications.","pitfall":"凭空编造图表没有给出的比例。","tag":"大作文"},{"id":"R01","group":"exam","topic":"时间管理","title":"199 / 204 考场时间分配","level":"必学","time":40,"summary":"两科分别限时180分钟，必须预留填涂与检查。","points":["199参考分配：数学55–65分钟，逻辑45–55分钟，写作55–65分钟，留5–10分钟机动。","英语二参考分配：完形15–20分钟，阅读75–90分钟，翻译20–25分钟，写作35–45分钟，余时检查。","较难题超过个人时间阈值先跳过，回头再做。","连续模拟时记录每个板块耗时，按自己的正确率迭代，不存在人人通用的唯一方案。"],"example":"以180分钟为总预算，先为写作留足整块时间。","pitfall":"在一两道难题上消耗过多时间。","tag":"时间管理"}],"writing":[{"id":"WPA1","group":"199","kind":"论证有效性分析","minutes":30,"title":"数字政务与满意度","prompt":"某市上线统一政务App后，线下窗口排队人数下降30%。因此，App已使全体市民的办事体验显著改善，政府应立即取消全部线下窗口，并将节省的经费投入更多线上宣传。","hints":["排队下降可能是线下开放时间缩短或业务转移","窗口人数不能代表所有市民满意度","数字弱势群体的需求未被考虑","取消全部线下窗口与结论之间缺少论证"],"outline":"总述论证缺陷→逐点分析替代原因/指标替换/群体差异/政策跳跃→结论。"},{"id":"WPA2","group":"199","kind":"论证有效性分析","minutes":30,"title":"短期试点与推广","prompt":"一所学校试用新教学软件一个月，随机询问的5位学生都表示喜欢。因此，新软件一定能显著提高全校成绩，应立即在全市中小学推广，并停用纸质教材。","hints":["5人样本太小且抽样可能有偏","喜欢不等于成绩提高","一个月无法体现长期效果","单校经验不能直接外推全市"],"outline":"关注样本代表性、指标偷换、时间不足、外推风险。"},{"id":"WPA3","group":"199","kind":"论证有效性分析","minutes":30,"title":"交通与因果","prompt":"城市新增共享单车站点后，地铁客流增长。可见共享单车是地铁客流增长的唯一原因。既然如此，只需继续增加站点，就能彻底消除交通拥堵。","hints":["同时期可能有线路扩张/人口变化","相关不等于唯一因果","地铁客流增长不代表拥堵消失","共享单车站点增加存在边际效益和现实约束"],"outline":"找出因果独断、结论范围扩大、政策可行性缺口。"},{"id":"WPA4","group":"199","kind":"论证有效性分析","minutes":30,"title":"项目评估","prompt":"甲部门购买新管理系统后，其每人每月处理的业务量提升15%。所以新系统必然比所有同类系统优秀，所有部门应在今年全部更换为这一系统。","hints":["业务复杂度和人员配置未知","甲部门样本不代表所有部门","处理量不等于质量和满意度","忽略采购成本/迁移风险"],"outline":"用“证据是否足以支持普遍结论”展开。"},{"id":"WPA5","group":"199","kind":"论证有效性分析","minutes":30,"title":"成本节约","prompt":"某事业单位取消线下咨询点后，当年办公费用降低。因此取消咨询点肯定提升公共服务质量，全国其他单位也应照做。","hints":["成本降低不能推出服务质量提升","可能转移了群众时间成本","单位之间需求结构有差异","缺少满意度及办事成功率证据"],"outline":"分别论述评价维度、隐含成本、外推边界。"},{"id":"WPA6","group":"199","kind":"论证有效性分析","minutes":30,"title":"培训成效","prompt":"参加线上培训的员工中有80%在年终获得优秀评级，而未参加者仅有40%。所以线上培训一定使优秀率翻倍，公司应取消其他培训方式。","hints":["可能存在自愿参与导致的自选择偏差","评级受岗位、基础能力影响","两组人数和统计方法未说明","取消其他方式缺少成本和效果比较"],"outline":"因果识别与替代方案缺失。"},{"id":"WPO1","group":"199","kind":"论说文","minutes":35,"title":"效率与公平如何兼顾","prompt":"请围绕“公共服务改革应如何兼顾效率与公平”写一篇论说文，明确观点，结合实际说明。","hints":["效率创造资源空间","公平保障机会与服务覆盖","以数字化加线下兜底调和目标"],"outline":"立论→效率价值→公平底线→制度设计→总结。"},{"id":"WPO2","group":"199","kind":"论说文","minutes":35,"title":"长期主义与短期绩效","prompt":"某机构面对季度考核压力，应该优先完成短期指标，还是持续建设长期能力？请就两者关系展开论述。","hints":["短期指标可帮助检验过程","长期建设支撑可持续绩效","建立二者协同的考核机制"],"outline":"提出“兼顾但不牺牲长期能力”的可辩护立场。"},{"id":"WPO3","group":"199","kind":"论说文","minutes":35,"title":"规则与创新","prompt":"创新需要突破惯例，但社会治理又离不开规范。请谈规则与创新之间的关系。","hints":["规则提供公共风险边界","创新解决既有制度不足","试点—评估—推广降低风险"],"outline":"辩证立论，举例要与公共管理相关。"},{"id":"WPO4","group":"199","kind":"论说文","minutes":35,"title":"数据与经验","prompt":"管理决策更应依赖数据还是经验？请结合组织管理情境表达观点。","hints":["数据减少直觉偏差","经验有助于解释复杂情境","建立证据与情境判断相结合的流程"],"outline":"用互补思路避免非黑即白。"},{"id":"WPO5","group":"199","kind":"论说文","minutes":35,"title":"信任与透明","prompt":"请论述组织决策中的透明度为什么重要，以及怎样兼顾透明与效率。","hints":["透明有助于信任","问责与纠错","保护隐私与敏感信息的合理边界"],"outline":"论点—解释—具体治理措施。"},{"id":"WPO6","group":"199","kind":"论说文","minutes":35,"title":"合作与责任","prompt":"请围绕“协作越紧密，越需要清晰的责任边界”展开论述。","hints":["责任明确减少推诿","沟通机制提升协作","避免过度分工带来的割裂"],"outline":"从组织设计、沟通机制和绩效评估阐述。"},{"id":"EWT1","group":"204","kind":"翻译","minutes":20,"title":"数字服务与可及性","prompt":"Digital services can reduce the time people spend traveling to public offices. However, governments must also provide support for residents who are less familiar with technology. A successful system should be convenient and accessible to everyone.","hints":["reduce the time: 减少花费的时间","less familiar with: 不太熟悉","accessible to everyone: 人人可方便使用"],"outline":"数字服务能减少人们前往政务大厅所花费的时间。然而，政府还必须为不太熟悉技术的居民提供帮助。成功的系统应既方便又能让所有人使用。"},{"id":"EWT2","group":"204","kind":"翻译","minutes":20,"title":"证据与公共决策","prompt":"Data can help public organizations understand where resources are needed most. Yet numbers alone may not tell the whole story, especially when some groups are not represented in surveys.","hints":["where resources are needed most: 最需要资源的地方","numbers alone: 仅凭数字","represented in surveys: 在调查中得到代表"],"outline":"数据可以帮助公共机构了解哪些地方最需要资源。但是，仅靠数字未必能够反映全貌，尤其是某些群体在调查中未得到充分代表时。"},{"id":"ES1","group":"204","kind":"小作文","minutes":20,"title":"邀请邮件","prompt":"Write an email of about 100 words to invite a colleague to a volunteer training event next Saturday. Include time, purpose and a polite closing.","hints":["I am writing to invite you to...","The event will take place...","I would appreciate it if..."],"outline":"Dear ... → purpose → time/place and value → polite close → Yours sincerely。"},{"id":"ES2","group":"204","kind":"小作文","minutes":20,"title":"建议邮件","prompt":"Write an email of about 100 words to suggest two improvements to the local library’s online booking system.","hints":["I would like to suggest...","First... Second...","Thank you for considering..."],"outline":"说明现状→提出两项具体建议→礼貌致谢。"},{"id":"ES3","group":"204","kind":"小作文","minutes":20,"title":"道歉邮件","prompt":"Write an email of about 100 words to apologize for missing a scheduled team meeting and propose a way to catch up.","hints":["I sincerely apologize for...","The reason was...","Could we arrange..."],"outline":"道歉→简要原因→补救措施→再次致歉。"},{"id":"EB1","group":"204","kind":"大作文","minutes":30,"title":"图表：在线业务比例","prompt":"Fictional data for writing practice only: A city’s share of online public-service applications was 30% in 2022, 42% in 2023, 55% in 2024, and 65% in 2025. Write a short essay of about 150 words describing the trend and giving possible reasons.","hints":["The chart illustrates...","rose from 30% to 65%","Possible factors may include..."],"outline":"描述总体增长→选首尾和中间数据比较→谨慎分析原因→总结。"},{"id":"EB2","group":"204","kind":"大作文","minutes":30,"title":"图表：通勤方式","prompt":"Fictional data for writing practice only: Survey of 100 commuters: 40 travel by bus, 30 by car, 20 by subway, and 10 by bicycle. Write about 150 words describing the distribution and possible implications.","hints":["account for 40 percent","compared with","This may suggest..."],"outline":"概述分布→对比最高和最低→讨论交通政策启示。"},{"id":"EB3","group":"204","kind":"大作文","minutes":30,"title":"图表：学习时间分配","prompt":"Fictional data for writing practice only: An adult learner spends 40% of weekly study time on English, 30% on math, 20% on logic, and 10% on writing. Write about 150 words describing the allocation and its possible effects.","hints":["takes up the largest share","respectively","A balanced approach..."],"outline":"说明结构→主次对比→合理讨论利弊。"}],"vocab":[{"id":"V001","word":"access","meaning":"使用机会；获取","phrase":"have access to","example":"Everyone should have access to basic services."},{"id":"V002","word":"accurate","meaning":"准确的","phrase":"accurate information","example":"The report contains accurate information."},{"id":"V003","word":"achieve","meaning":"实现","phrase":"achieve a goal","example":"Small steps help us achieve our goals."},{"id":"V004","wo <script>

function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateUTC(k){const a=k.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2])}
function dateAdd(key,n){return new Date(dateUTC(key)+n*864e5).toISOString().slice(0,10)}
function todayKey(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function diffDays(a,b){return Math.round((dateUTC(a)-dateUTC(b))/864e5)}
function remaining(){return Math.max(0,diffDays(EXAM,todayKey()))}
function inRange(d){return d>=START&&d<EXAM}
function stageFor(date){const n=diffDays(date,START);return STAGES.find(x=>n>=x.from&&n<=x.to)||STAGES[n<0?0:3]}
function dateZh(x){const a=x.split('-');return `${Number(a[1])}月${Number(a[2])}日`}

+`<div class="grid cols-2"><div class="card">${cardHead('个性化学习目标')}<div class="grid cols-2"><div class="form-field"><label>每天计划学习（小时）</label><select class="field" id="settingHours">${[1,1.5,2,2.5,3,3.5,4,5,6,7,8].map(v=>`<option value="${v}" ${s.settings.hours===v?'selected':''}>${v}小时/天</option>`).join('')}</select></div><div class="form-field"><label>总分目标（满分300）</label><input class="field" type="number" id="settingGoal" min="0" max="300" value="${s.settings.goal}" /></div></div><p class="side-panel-info">各模块目标用于自我管理，不构成学校录取线预测。当前总分目标 ${s.settings.goal} / 300。</p><button class="btn primary" data-action="save-settings">保存计划设置</button><div class="hr"></div>${cardHead('分值结构')}<div class="mini-topic"><div><strong>管理类综合能力 199</strong><p>数学 75 + 逻辑 60 + 写作 65</p></div><b>200</b></div><div class="mini-topic"><div><strong>英语（二）204</strong><p>完形 10 + 阅读 50 + 翻译 15 + 写作 25</p></div><b>100</b></div></div><div class="card">${cardHead('本地数据备份')}<div class="setting-row"><div><b>导出全部记录</b><p>包括学习任务、题目作答、笔记完成、词卡、作文和模考</p></div><button class="btn outline" data-action="export">下载 JSON</button></div><div class="setting-row"><div><b>导入历史记录</b><p>覆盖当前本地记录，请先备份；仅接受本站导出的 JSON</p></div><button class="btn outline" data-action="import">选择文件</button></div><div class="setting-row"><div><b>清空所有本地进度</b><p>不可撤销；不影响题库、讲义等静态资料</p></div><button class="btn danger" data-action="reset-data">重置数据</button></div><div class="alert cool" style="margin-top:17px">直接双击 index.html 即可离线使用。不同浏览器、无痕模式或清理网站数据可能导致记录消失；请定期导出备份。</div></div></div><div class="card" style="margin-top:17px">${cardHead('官方信息来源')}${D.meta.officialUrls.map(x=>`<div class="mini-topic"><div><strong>${esc(x.title)}</strong><p>${esc(x.url)}</p></div><a class="source-link" href="${x.url}" target="_blank" rel="noopener noreferrer">打开 ↗</a></div>`).join('')}<div class="alert" style="margin-top:15px"><b>资格注意：</b>西昌学院 2027 公共管理硕士招生章程要求：本科毕业后具有3年以上工作经验；或高职（专科）毕业/本科结业、符合同等学力要求并有5年以上工作经验；或取得硕博学历/学位后有2年以上工作经验。应根据本人毕业时间、工作经历及报考规定核验资格。</div></div>`}
function render(shouldScroll=false){clearInterval(timer);const pg=(location.hash.replace(/^#\//,'').split('?')[0]||'dashboard');const page=LABELS[pg]?pg:'dashboard';crumb.textContent=LABELS[page];document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===page));let html;try{html=({dashboard:renderDashboard,plan:renderPlan,notes:renderNotes,quiz:renderQuiz,mock:renderMock,mistakes:renderMistakes,vocab:renderVocab,writing:renderWriting,stats:renderStats,settings:renderSettings})[page]()}catch(e){console.error(e);html=`<div class="card"><h2>页面加载出现问题</h2><p>请刷新页面后重试。若问题持续，请导出备份后恢复。</p><pre>${esc(String(e))}</pre></div>`}app.innerHTML=html;document.getElementById('sidebar').classList.remove('open');if(shouldScroll)scrollTop();if(s.active&&((page==='quiz'&&s.active.kind==='quiz')||(page==='mock'&&s.active.kind==='mock')))startClock()}
function clockFormat(ms){let sec=Math.max(0,Math.ceil(ms/1000));return`${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function startClock(){const a=s.active;if(!a||!a.expiresAt)return;const tick=()=>{if(!s.active||s.active!==a)return;const t=document.getElementById('countTimer');const m=a.expiresAt-Date.now();if(t){t.textContent=clockFormat(m);t.classList.toggle('warning',m<10*60000)}if(m<=0){clearInterval(timer);finishExam(true)}};tick();timer=setInterval(tick,1000)}
function download(name,data,mime){const blob=new Blob([data],{type:mime});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function exportState(){download(`MPA-2027-学习记录-${todayKey()}.json`,JSON.stringify({app:'MPA Study 2027',exportedAt:new Date().toISOString(),state:s},null,2),'application/json;charset=utf-8');toast('记录已导出为 JSON')}
function exportIcs(){let entries=[];for(let i=0;i<60;i++){const k=dateAdd(START,i);const dt=tasksFor(k);const desc=dt.map(x=>`${x.title} (${x.mins}分钟)`).join('\\n');entries.push(['BEGIN:VEVENT',`UID:mpa2027-${k}@study.local`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'')}`,`DTSTART;VALUE=DATE:${k.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${dateAdd(k,1).replace(/-/g,'')}`,`SUMMARY:MPA复习 · ${stageFor(k).title}`,`DESCRIPTION:${desc.replace(/,/g,'\\,').replace(/;/g,'\\;')}`,'END:VEVENT'].join('\r\n'))}download('MPA-2027-60天计划.ics','BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MPA Study//2027//ZH\r\n'+entries.join('\r\n')+'\r\nEND:VCALENDAR','text/calendar;charset=utf-8');toast('日历已导出')}

 case 'practice-note':{ui.bankType=({'math':'ps','logic':'logic','english':'reading'})[d.group]||'all';ui.bankTopic=ui.bankType==='ps'?d.topic:ui.bankType==='logic'?d.topic:'all';if(!D.questions.some(q=>q.type===ui.bankType&&q.topic===ui.bankTopic))ui.bankTopic='all';ui.noteId=null;navTo('quiz');break}

 case 'answer':if(!a)break;{const id=a.ids[a.pos];if(!id)break;if(a.kind==='quiz'&&a.mode==='practice'&&a.revealed[id])break;a.answers[id]=Number(d.index);save();render();break}

 case 'train-wrong':{const ids=wrongIds();if(!ids.length)break;if(s.active){toast('请先完成之前的试卷');break}s.active={kind:'quiz',ids:pick(ids.map(id=>Q[id]),Math.min(ids.length,30)),answers:{},pos:0,revealed:{},startedAt:Date.now(),expiresAt:null,mode:'practice',essays:{}};save();navTo('quiz');break}
 case 'review-wrong':{const r=s.sessions.find(x=>x.uid===s.lastResult);const ids=(r?.ids||[]).filter(id=>r.answers[id]!==undefined&&r.answers[id]!==Q[id].answer);s.lastResult=null;if(!ids.length){save();toast('本次没有答错的题目');render();break}s.active={kind:'quiz',ids,answers:{},pos:0,revealed:{},startedAt:Date.now(),expiresAt:null,mode:'practice',essays:{}};save();navTo('quiz');break}
 case 'single-question':{s.active={kind:'quiz',ids:[d.id],answers:{},pos:0,revealed:{},startedAt:Date.now(),expiresAt:null,mode:'practice',essays:{}};save();navTo('quiz');break}
