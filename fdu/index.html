window.LAW_DATA = (() => {
  const subjects = [
    {id:'criminal',name:'刑法学',code:'397',group:'专业基础',color:'#d66643',target:55,icon:'⚖'},
    {id:'civil',name:'民法学',code:'397',group:'专业基础',color:'#c98940',target:55,icon:'§'},
    {id:'theory',name:'法理学',code:'497',group:'专业综合',color:'#6282d9',target:45,icon:'◇'},
    {id:'constitution',name:'宪法学',code:'497',group:'专业综合',color:'#8167c9',target:37,icon:'▣'},
    {id:'history',name:'中国法制史',code:'497',group:'专业综合',color:'#6c9a74',target:33,icon:'⌛'},
    {id:'politics',name:'思想政治理论',code:'101',group:'公共课',color:'#c26581',target:65,icon:'★'},
    {id:'english',name:'英语（一）',code:'201',group:'公共课',color:'#469c9a',target:65,icon:'Aa'}
  ];
  // 知识点：[学科,章节,标题,核心理解,口语化例子/记忆技巧,易错点,优先级]
  const rawNotes = [
    ['criminal','总论','罪刑法定原则','法无明文规定不为罪，法无明文规定不处罚；禁止不利于被告人的类推解释。','口诀：先找法条，再谈犯罪；不能凭“看着坏”就定罪。','扩大解释与类推解释并不相同。','高'],
    ['criminal','总论','刑法的时间效力','原则上从旧兼从轻：行为后法律变化时，一般适用旧法，但新法不认为犯罪或处罚更轻的可依规则适用新法。','画时间线：行为日→法律变更日→审判日。','司法解释适用和法律变更需分别判断。','高'],
    ['criminal','总论','犯罪构成','犯罪成立判断要分析客观行为、主体条件与主观罪过等要素。','先问做了什么，再问是谁做的、心里怎么想。','别把“发生损害”直接等同于故意犯罪成立。','高'],
    ['criminal','总论','故意与过失','直接故意是希望结果发生；间接故意是放任；过于自信的过失是轻信能够避免；疏忽大意的过失是应预见而未预见。','“放任”和“自信不会发生”是高频分界。','过失犯罪法律有规定才负刑事责任。','高'],
    ['criminal','总论','因果关系','刑法上的因果关系需要结合行为与结果之间的客观联系判断，还要单独判断主观归责。','先看结果由谁造成，再看结果能否归责于他。','有因果关系不意味着当然构成犯罪。','高'],
    ['criminal','总论','不作为犯罪','成立通常需要行为人负有作为义务、有履行可能且不履行导致相应结果。','三个问：该不该救？能不能救？不救有什么后果？','普通路人不必然有刑法上的救助义务。','高'],
    ['criminal','总论','正当防卫','为保护合法权益，对正在进行的不法侵害采取制止行为，在法定限度内不负刑事责任。','关键词：正在进行、不法侵害、制止目的。','防卫对象通常是不法侵害人；防卫过当需另判。','高'],
    ['criminal','总论','紧急避险','为使合法权益免受正在发生的危险，不得已采取的损害另一较小合法权益的行为。','防卫针对侵害人；避险可能牺牲第三人较小权益。','紧急避险有必要性与限度要求。','中'],
    ['criminal','总论','预备、未遂、中止','预备是为犯罪准备工具、制造条件；未遂已着手但意志以外原因未得逞；中止是自动放弃或自动有效防止结果发生。','“自动”还是“被迫”？先辨主观，再辨阶段。','犯罪既遂后的补救不构成犯罪中止。','高'],
    ['criminal','总论','共同犯罪','二人以上共同故意犯罪；需要共同故意与共同行为。','数人一起做事≠一定共同犯罪，须同向故意。','过失共同造成结果一般不认定共同犯罪。','高'],
    ['criminal','总论','主犯、从犯、胁从犯','按共同犯罪中的作用及法定条件确定刑事责任；从犯依法从轻、减轻或免除处罚。','分清组织领导、主要作用、次要辅助作用。','区分身份与实际作用，不能见“参与”就定主犯。','高'],
    ['criminal','总论','自首与立功','一般自首强调自动投案、如实供述自己的罪行；立功关注揭发他人犯罪、提供重要线索等法定情形。','自首说自己的事，立功帮助查别人的事。','特殊自首和一般自首条件不同。','高'],
    ['criminal','总论','数罪并罚','对数个犯罪的刑罚依法决定执行刑期；需区分判决前漏罪与判决后新罪。','遇到数罪，先写刑期，再辨“先并后减/先减后并”。','死刑、无期徒刑与有期徒刑处理规则不同。','高'],
    ['criminal','分则','盗窃罪与诈骗罪','盗窃通常表现为违反他人意思取得财物；诈骗通常包含欺骗、被害人认识错误以及基于错误处分财产。','一句话：骗到“交付”看诈骗；偷偷取走多从盗窃分析。','处分意识等具体争点需要结合案情和理论。','高'],
    ['criminal','分则','抢劫罪','以暴力、胁迫或其他方法当场强行劫取财物，保护财产权并涉及人身权。','抢劫要同时审查取财与人身强制。','与抢夺、盗窃转化型抢劫区分。','高'],
    ['criminal','分则','侵占罪与职务侵占罪','侵占关注将代为保管财物等非法占为己有；职务侵占关注公司、企业等工作人员利用职务便利侵占本单位财物。','先问财物原来谁合法占有，再问有无职务便利。','犯罪主体及财物范围不可混淆。','中'],
    ['criminal','分则','故意伤害与故意杀人','结合主观故意内容、行为手段、打击部位、力度及案后表现等综合判断。','不能只看结果是死还是伤，更要看主观意图。','故意伤害致死不等同于故意杀人既遂。','高'],
    ['criminal','分则','交通肇事与危险驾驶','交通肇事强调违反交通运输管理法规并造成法定重大后果；危险驾驶着眼于刑法列明的危险驾驶行为。','先看行为种类，再看结果门槛和主观方面。','醉驾案件具体入罪及出罪需结合最新规范。','中'],
    ['criminal','分则','贪污罪与受贿罪','贪污偏向利用职务便利非法占有公共财物；受贿偏向利用职务便利索取或非法收受财物为他人谋利。','一个是“拿公家财物”，一个是“收别人好处”。','国家工作人员主体、职务关联等是关键。','高'],
    ['criminal','方法','刑法案例四步法','识别行为→定构成要件→找违法阻却与责任阻却→确定罪数及处罚。','答案先写结论，再分层讲事实与法理。','只报罪名不论证容易丢主观题分。','高'],
    ['civil','总则','民法基本原则','平等、自愿、公平、诚信、守法与公序良俗、绿色原则共同构成民事活动基本要求。','诚信像交易底线；公序良俗是社会底线。','原则不能随意替代具体请求权基础。','高'],
    ['civil','总则','民事法律行为','以意思表示设立、变更、终止民事法律关系的行为；有效需满足相应法定条件。','合同、遗嘱通常是民事法律行为。','成立、生效、可撤销、无效分别判断。','高'],
    ['civil','总则','无效与可撤销行为','无效行为自始不发生预期效力；可撤销行为在被依法撤销前有相应效力。','无效不用“撤销”才无效，可撤销要依法主张。','撤销权行使期限不能当普通诉讼时效。','高'],
    ['civil','总则','重大误解、欺诈、胁迫','重大误解、欺诈、胁迫等法定事由可能产生撤销权，须按构成要件识别。','记住：意思不真实，先考虑可撤销。','欺诈不当然等于行为无效。','高'],
    ['civil','总则','表见代理','行为人虽无代理权，但相对人有理由相信其有代理权且符合条件时，代理行为有效。','“没权限却看起来有权限”，重点在合理信赖。','表见代理与无权代理追认要分开。','高'],
    ['civil','总则','诉讼时效','普通诉讼时效期间通常为三年；适用中止、中断等制度并有特别规定。','时效通常影响胜诉权保障，不使债权自然消灭。','具体起算点、最长保护期与例外不能混淆。','高'],
    ['civil','物权','物权变动','不动产物权变动通常以依法登记为生效要件；动产物权设立转让通常以交付为生效要件，法律另有规定除外。','房子看登记，动产看交付；先识别例外。','合同有效不等于物权已变动。','高'],
    ['civil','物权','善意取得','无权处分情形下，受让人符合法定善意、合理价格以及登记/交付等条件，可能取得物权。','先检查无权处分，再查善意、价格、公示。','拾得遗失物等存在特别规则。','高'],
    ['civil','物权','抵押权与质权','抵押通常不转移占有；动产质权一般以交付设立。','“押不交、质要交”是入门记法，但不覆盖全部规则。','权利质押和特殊抵押需单独学习。','高'],
    ['civil','合同','要约与承诺','要约内容具体确定并表明受约束意图；承诺通常须与要约内容一致。','要约像下订单，承诺像同意成交。','要约邀请与要约区分，承诺实质变更可能是新要约。','高'],
    ['civil','合同','违约责任','不履行或履行不符合约定，可能承担继续履行、补救、损害赔偿等违约责任。','先写合同有效，再写违反了哪项义务。','违约责任与侵权责任竞合要考虑请求权选择。','高'],
    ['civil','合同','定金与违约金','二者适用有不同规则；当事人同时约定时，在法定条件下可选择适用相关条款。','“定金罚则”要记双倍返还与不得返还的触发条件。','“订金”与法定意义的“定金”不等同。','高'],
    ['civil','合同','合同解除','依法定或约定事由解除合同；解除后未履行的终止履行，已履行的按性质和履行情况处理。','解除不是随时后悔，必须找解除权依据。','解除、撤销、无效后果不同。','高'],
    ['civil','人格权','个人信息保护','民法典保护自然人的个人信息；处理个人信息应依法遵守合法、正当、必要等原则。','收集个人信息不是“用户点了同意”就可以无限用。','隐私权与个人信息权益保护有交叉但不重合。','中'],
    ['civil','婚姻继承','法定继承顺序','第一顺序为配偶、子女、父母；第二顺序为兄弟姐妹、祖父母、外祖父母；特殊情形依法处理。','口诀：配子父一顺；兄祖二顺。','代位继承、转继承与遗嘱继承另行判断。','高'],
    ['civil','婚姻继承','夫妻共同财产','婚姻关系存续期间取得的法定共同财产一般归夫妻共同所有；依法属于个人财产的除外。','先定婚内时间，再看财产性质与约定。','婚前个人财产不当然因结婚变共同财产。','高'],
    ['civil','侵权','一般侵权责任','通常结合侵权行为、损害、因果关系、过错判断，但存在无过错责任和过错推定等特别规则。','四格分析：行为、损害、因果、归责。','不要给所有侵权类型硬套过错责任。','高'],
    ['civil','侵权','高空抛物与坠物','民法典对高空抛物、建筑物等设施脱落坠落分别规定责任和调查义务。','抛物先找行为人，坠物还要看管理维护责任。','不能把所有住户都直接视作侵权人。','中'],
    ['civil','方法','民法案例请求权基础法','先找谁向谁要什么→找合同/物权/侵权依据→查要件→查抗辩→下结论。','用“谁向谁，凭什么，要什么”开头。','只描述案情而不指明请求权基础是高频失分点。','高'],
    ['theory','法的基础','法的规范性与国家强制性','法是具有规范性、普遍性并由国家强制力保障实施的社会规范。','道德也规范行为，法另有国家强制保障。','不能认为每个法律规定都直接附刑罚。','高'],
    ['theory','法的基础','法的价值','秩序、自由、平等、正义、人权等价值可能发生冲突，需要依法协调。','先列价值，再说冲突，最后讲如何平衡。','价值排序不是任何场景都绝对固定。','高'],
    ['theory','法的基础','法律规则的逻辑结构','通常从假定条件、行为模式、法律后果认识法律规则。','出现“如果……应当……否则……”就拆三段。','一条法律条文不一定等于一条完整法律规则。','高'],
    ['theory','法的渊源','法的正式渊源','关注宪法、法律、行政法规、地方性法规等规范性法律文件的制定主体和效力。','回答“谁制定、适用哪里、位阶多高”。','司法判例一般不是我国正式法的渊源。','高'],
    ['theory','法的渊源','法律效力冲突','通常遵循上位法优于下位法、特别法优于一般法、新法优于旧法等规则，但冲突裁决有特别程序。','上、特、新：只是初判顺序，复杂冲突还要找机关。','同一机关制定的特别旧法与一般新法冲突不是简单套口诀。','高'],
    ['theory','法律运行','立法与执法与司法','立法是规范创制，执法是行政机关等依法执行法律，司法是法定机关适用法律处理案件。','先分清制定、执行、裁判。','广义执法概念与狭义执法语境不同。','高'],
    ['theory','法律运行','法律解释方法','文义解释、体系解释、历史解释、目的解释等用于阐明法律规范的意义。','先读字面，再看上下文、制度目的。','解释不得任意越过法律文本界限。','高'],
    ['theory','法律运行','法律推理','演绎推理从一般规范到个案结论；类比推理从相似案件寻找适用参考。','大前提法条、小前提事实、结论裁判。','刑法不利类推禁止；民法等领域场景不同。','中'],
    ['theory','法律关系','法律关系要素','法律关系一般包含主体、内容（权利义务）、客体。','谁、有什么权利义务、指向什么。','法律事实是关系产生变更消灭的原因，非基本三要素。','高'],
    ['theory','法律责任','法律责任与法律制裁','责任是违法或其他法定事由引起的不利法律后果；制裁是国家机关对责任的强制实现方式之一。','有责任不一定马上产生制裁。','民事责任、刑事责任、行政责任不可混同。','中'],
    ['theory','法治','法治与法制','法制偏重法律制度体系；法治强调依法治理、权力受法律约束。','有法可依不等于真正法治。','区分“以法治国”与“依法治国”的规范语义。','高'],
    ['theory','方法','法理主观题四段式','概念界定→制度/特征→原因与价值→结合案例/现实。','每段一个得分点，不把四点挤成一句话。','不要把价值判断当作法律规则。','高'],
    ['constitution','基本理论','宪法根本法地位','宪法规定国家根本制度和根本任务，具有最高法律效力，修改程序更加严格。','宪法是根本法，不是所有具体生活纠纷的直接细则。','“最高效力”与“其他法律无效”不是一回事。','高'],
    ['constitution','国家制度','人民代表大会制度','人民代表大会制度是我国根本政治制度；国家一切权力属于人民。','人民行使国家权力的机关是全国人大和地方各级人大。','人民、人大、人大常委会各自地位不同。','高'],
    ['constitution','国家制度','民族区域自治','民族自治地方的自治机关是自治区、自治州、自治县的人民代表大会和人民政府。','记住自治机关“两家”：人大、政府。','自治地方的法院、检察院不是自治机关。','高'],
    ['constitution','公民权利','基本权利体系','平等权、政治权利自由、人身自由、宗教信仰自由、社会经济文化权利等受宪法保护。','先分人身、政治、社会经济文化三篮子。','公民行使权利仍须依法履行义务。','高'],
    ['constitution','公民权利','通信自由和通信秘密','受法律保护；因国家安全或追查刑事犯罪需要，由法定机关依照法定程序检查。','牢记条件、机关、程序三重门槛。','不是任何单位都可以随意检查通信。','高'],
    ['constitution','国家机构','全国人大主要职权','修改宪法、监督宪法实施、制定修改基本法律、选举决定国家机构人员等属于其重要职权。','遇到国家机构题：把决定者和执行者分开。','全国人大与全国人大常委会职权有区分。','高'],
    ['constitution','国家机构','全国人大常委会职权','解释宪法、监督宪法实施，制定修改除应由全国人大制定的法律以外的其他法律等。','宪法修改是全国人大，不是常委会。','制定基本法律与其他法律的主体区别是考点。','高'],
    ['constitution','国家机构','国家主席与国务院','国家主席根据全国人大及常委会的决定行使公布法律等职权；国务院是最高国家行政机关。','“谁决定”和“谁公布”不一样。','国家主席不能脱离法定决定程序任意公布法律。','高'],
    ['constitution','国家机构','监察委员会','国家监察委员会是最高监察机关；监察机关依法独立行使监察权。','监察、审判、检察职能分开记。','监察委员会不是行政机关或司法审判机关。','高'],
    ['constitution','方法','宪法机关对比法','建立表格对比：产生方式、性质、组成、任期、核心职权、监督关系。','一题查两个相近机关，比孤立背职权快。','不要脱离现行宪法条文记忆任期和权限。','高'],
    ['history','先秦','西周礼与刑','西周法律制度强调礼刑结合、礼治秩序，对后世中华法系影响深远。','先秦核心记“礼”与“刑”的关系。','不是说西周只有礼没有刑。','中'],
    ['history','先秦','郑国子产铸刑书','春秋时期郑国子产铸刑书，被普遍视为早期公布成文法的重要事件。','口诀：郑国子产—铸刑书。','和晋国铸刑鼎区分。','高'],
    ['history','战国','法经与李悝','《法经》一般认为由魏国李悝编纂，是战国时期的重要成文法典。','魏国—李悝—《法经》，三点成组背。','法经不是秦朝制定。','高'],
    ['history','秦汉','秦朝法律制度','秦法律重视法令、吏治及国家治理，具有较强的法家色彩。','秦：法令统一与行政管理。','不能简单把秦法所有特征等同于暴政标签。','中'],
    ['history','秦汉','汉代春秋决狱','以儒家经义解释和判断案件，体现司法儒家化倾向。','汉：儒法结合、春秋决狱。','春秋决狱不是现代意义的依法直接适用成文法。','高'],
    ['history','魏晋','八议与官当','魏晋南北朝时期法律儒家化发展，八议制度入律；官当制度与官爵抵罪有关。','把制度和朝代放到时间轴一起记。','具体正式入律时间需要依大纲教材精确核对。','中'],
    ['history','唐代','唐律疏议','《唐律疏议》集唐律与官方注疏于一体，是中华法系代表性法典。','唐—唐律疏议—礼法结合。','并非清朝法典。','高'],
    ['history','宋代','宋刑统','《宋刑统》是宋初重要法典，沿袭唐律传统并吸收敕令等内容。','唐律疏议→宋刑统，连起来记。','与唐代永徽律疏的形成时间区分。','高'],
    ['history','明清','大明律与大清律例','明《大明律》和清《大清律例》反映后期传统中国律例制度。','明律、清律例：把朝代与法典一一对应。','不要把清末修律和《大清律例》混为一谈。','高'],
    ['history','清末','清末修律','《大清新刑律》等反映法律近代化改革；法律部门和制度开始系统调整。','清末新刑律与传统律例作时间对照。','颁布与实际施行的区分需注意。','高'],
    ['history','民国','临时约法','《中华民国临时约法》是南京临时政府时期的重要宪法性文件。','1912—临时约法—民国初期。','与《中华民国约法》区分。','高'],
    ['history','方法','法制史三联记忆','朝代→法典/事件→制度特点；再写时间线。','如：唐→唐律疏议→礼法结合。','记住年份不等于理解制度演变。','高'],
    ['politics','马原','物质与意识','物质决定意识，意识对物质具有能动反作用；正确意识能指导实践。','客观条件是地基，思想是行动方案。','不是意识想什么就能创造现实。','高'],
    ['politics','马原','实践与认识','实践是认识的来源、动力、目的和检验认识真理性的唯一标准。','来源、动力、目的、检验——四词顺序背。','经验本身并不自动等于科学认识。','高'],
    ['politics','马原','矛盾普遍性与特殊性','普遍性寓于特殊性之中，并通过特殊性表现；具体问题具体分析。','共性存在于一个个具体问题里。','不能把二者理解为互不相干。','高'],

:"辨析卡"},{"id":"kb-002-3","subject":"criminal","chapter":"总论","type":"single","stem":"【知识配对】下列关于“刑法的时间效力”的通俗记忆提示，哪项配对正确？","options":["口诀：先找法条，再谈犯罪；不能凭“看着坏”就定罪。","数人一起做事≠一定共同犯罪，须同向故意。","先看行为种类，再看结果门槛和主观方面。","画时间线：行为日→法律变更日→审判日。"],"answer":3,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：画时间线：行为日→法律变更日→审判日。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-003-1","subject":"criminal","chapter":"总论","type":"single","stem":"【基础识记】关于“犯罪构成”，哪一项是对应的核心知识？","options":["盗窃通常表现为违反他人意思取得财物；诈骗通常包含欺骗、被害人认识错误以及基于错误处分财产。","犯罪成立判断要分析客观行为、主体条件与主观罪过等要素。","直接故意是希望结果发生；间接故意是放任；过于自信的过失是轻信能够避免；疏忽大意的过失是应预见而未预见。","侵占关注将代为保管财物等非法占为己有；职务侵占关注公司、企业等工作人员利用职务便利侵占本单位财物。"],"answer":1,"explain":"犯罪成立判断要分析客观行为、主体条件与主观罪过等要素。（知识卡：犯罪构成；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-003-2","subject":"criminal","chapter":"总论","type":"single","stem":"【易错点】复习“犯罪构成”时，哪一个提醒最直接对应这一考点？","options":["处分意识等具体争点需要结合案情和理论。","犯罪主体及财物范围不可混淆。","别把“发生损害”直接等同于故意犯罪成立。","过失犯罪法律有规定才负刑事责任。"],"answer":2,"explain":"本考点的常见误区：别把“发生损害”直接等同于故意犯罪成立。 结合核心理解：犯罪成立判断要分析客观行为、主体条件与主观罪过等要素。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-003-3","subject":"criminal","chapter":"总论","type":"single","stem":"【知识配对】下列关于“犯罪构成”的通俗记忆提示，哪项配对正确？","options":["先问财物原来谁合法占有，再问有无职务便利。","一句话：骗到“交付”看诈骗；偷偷取走多从盗窃分析。","“放任”和“自信不会发生”是高频分界。","先问做了什么，再问是谁做的、心里怎么想。"],"answer":3,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：先问做了什么，再问是谁做的、心里怎么想。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-004-1","subject":"criminal","chapter":"总论","type":"single","stem":"【基础识记】关于“故意与过失”，哪一项是对应的核心知识？","options":["为保护合法权益，对正在进行的不法侵害采取制止行为，在法定限度内不负刑事责任。","直接故意是希望结果发生；间接故意是放任；过于自信的过失是轻信能够避免；疏忽大意的过失是应预见而未预见。","盗窃通常表现为违反他人意思取得财物；诈骗通常包含欺骗、被害人认识错误以及基于错误处分财产。","交通肇事强调违反交通运输管理法规并造成法定重大后果；危险驾驶着眼于刑法列明的危险驾驶行为。"],"answer":1,"explain":"直接故意是希望结果发生；间接故意是放任；过于自信的过失是轻信能够避免；疏忽大意的过失是应预见而未预见。（知识卡：故意与过失；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-004-2","subject":"criminal","chapter":"总论","type":"single","stem":"【易错点】复习“故意与过失”时，哪一个提醒最直接对应这一考点？","options":["醉驾案件具体入罪及出罪需结合最新规范。","过失犯罪法律有规定才负刑事责任。","防卫对象通常是不法侵害人；防卫过当需另判。","处分意识等具体争点需要结合案情和理论。"],"answer":1,"explain":"本考点的常见误区：过失犯罪法律有规定才负刑事责任。 结合核心理解：直接故意是希望结果发生；间接故意是放任；过于自信的过失是轻信能够避免；疏忽大意的过失是应预见而未预见。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-004-3","subject":"criminal","chapter":"总论","type":"single","stem":"【知识配对】下列关于“故意与过失”的通俗记忆提示，哪项配对正确？","options":["一句话：骗到“交付”看诈骗；偷偷取走多从盗窃分析。","先看行为种类，再看结果门槛和主观方面。","关键词：正在进行、不法侵害、制止目的。","“放任”和“自信不会发生”是高频分界。"],"answer":3,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：“放任”和“自信不会发生”是高频分界。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-005-1","subject":"criminal","chapter":"总论","type":"single","stem":"【基础识记】关于“因果关系”，哪一项是对应的核心知识？","options":["犯罪成立判断要分析客观行为、主体条件与主观罪过等要素。","刑法上的因果关系需要结合行为与结果之间的客观联系判断，还要单独判断主观归责。","对数个犯罪的刑罚依法决定执行刑期；需区分判决前漏罪与判决后新罪。","法无明文规定不为罪，法无明文规定不处罚；禁止不利于被告人的类推解释。"],"answer":1,"explain":"刑法上的因果关系需要结合行为与结果之间的客观联系判断，还要单独判断主观归责。（知识卡：因果关系；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-005-2","subject":"criminal","chapter":"总论","type":"single","stem":"【易错点】复习“因果关系”时，哪一个提醒最直接对应这一考点？","options":["别把“发生损害”直接等同于故意犯罪成立。","死刑、无期徒刑与有期徒刑处理规则不同。","有因果关系不意味着当然构成犯罪。","扩大解释与类推解释并不相同。"],"answer":2,"explain":"本考点的常见误区：有因果关系不意味着当然构成犯罪。 结合核心理解：刑法上的因果关系需要结合行为与结果之间的客观联系判断，还要单独判断主观归责。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-005-3","subject":"criminal","chapter":"总论","type":"single","stem":"【知识配对】下列关于“因果关系”的通俗记忆提示，哪项配对正确？","options":["先问做了什么，再问是谁做的、心里怎么想。","先看结果由谁造成，再看结果能否归责于他。","遇到数罪，先写刑期，再辨“先并后减/先减后并”。","口诀：先找法条，再谈犯罪；不能凭“看着坏”就定罪。"],"answer":1,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：先看结果由谁造成，再看结果能否归责于他。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-006-1","subject":"criminal","chapter":"总论","type":"single","stem":"【基础识记】关于“不作为犯罪”，哪一项是对应的核心知识？","options":["预备是为犯罪准备工具、制造条件；未遂已着手但意志以外原因未得逞；中止是自动放弃或自动有效防止结果发生。","成立通常需要行为人负有作为义务、有履行可能且不履行导致相应结果。","侵占关注将代为保管财物等非法占为己有；职务侵占关注公司、企业等工作人员利用职务便利侵占本单位财物。","以暴力、胁迫或其他方法当场强行劫取财物，保护财产权并涉及人身权。"],"answer":1,"explain":"成立通常需要行为人负有作为义务、有履行可能且不履行导致相应结果。（知识卡：不作为犯罪；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-006-2","subject":"criminal","chapter":"总论","type":"single","stem":"【易错点】复习“不作为犯罪”时，哪一个提醒最直接对应这一考点？","options":["犯罪主体及财物范围不可混淆。","普通路人不必然有刑法上的救助义务。","与抢夺、盗窃转化型抢劫区分。","犯罪既遂后的补救不构成犯罪中止。"],"answer":1,"explain":"本考点的常见误区：普通路人不必然有刑法上的救助义务。 结合核心理解：成立通常需要行为人负有作为义务、有履行可能且不履行导致相应结果。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-006-3","subject":"criminal","chapter":"总论","type":"single","stem":"【知识配对】下列关于“不作为犯罪”的通俗记忆提示，哪项配对正确？","options":["抢劫要同时审查取财与人身强制。","先问财物原来谁合法占有，再问有无职务便利。","三个问：该不该救？能不能救？不救有什么后果？","“自动”还是“被迫”？先辨主观，再辨阶段。"],"answer":2,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：三个问：该不该救？能不能救？不救有什么后果？；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-007-1","subject":"criminal","chapter":"总论","type":"single","stem":"【基础识记】关于“正当防卫”，哪一项是对应的核心知识？","options":["预备是为犯罪准备工具、制造条件；未遂已着手但意志以外原因未得逞；中止是自动放弃或自动有效防止结果发生。","为保护合法权益，对正在进行的不法侵害采取制止行为，在法定限度内不负刑事责任。","贪污偏向利用职务便利非法占有公共财物；受贿偏向利用职务便利索取或非法收受财物为他人谋利。","刑法上的因果关系需要结合行为与结果之间的客观联系判断，还要单独判断主观归责。"],"answer":1,"explain":"为保护合法权益，对正在进行的不法侵害采取制止行为，在法定限度内不负刑事责任。（知识卡：正当防卫；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-007-2","subject":"criminal","chapter":"总论","type":"single","stem":"【易错点】复习“正当防卫”时，哪一个提醒最直接对应这一考点？","options":["有因果关系不意味着当然构成犯罪。","防卫对象通常是不法侵害人；防卫过当需另判。","国家工作人员主体、职务关联等是关键。","犯罪既遂后的补救不构成犯罪中止。"],"answer":1,"explain":"本考点的常见误区：防卫对象通常是不法侵害人；防卫过当需另判。 结合核心理解：为保护合法权益，对正在进行的不法侵害采取制止行为，在法定限度内不负刑事责任。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-007-3","subject":"criminal","chapter":"总论","type":"single","stem":"【知识配对】下列关于“正当防卫”的通俗记忆提示，哪项配对正确？","options":["关键词：正在进行、不法侵害、制止目的。","一个是“拿公家财物”，一个是“收别人好处”。","先看结果由谁造成，再看结果能否归责于他。","“自动”还是“被迫”？先辨主观，再辨阶段。"],"answer":0,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：关键词：正在进行、不法侵害、制止目的。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-008-1","subject":"criminal","chapter":"总论","type":"single","stem":"【基础识记】关于“紧急避险”，哪一项是对应的核心知识？","options":["为保护合法权益，对正在进行的不法侵害采取制止行为，在法定限度内不负刑事责任。","为使合法权益免受正在发生的危险，不得已采取的损害另一较小合法权益的行为。","贪污偏向利用职务便利非法占有公共财物；受贿偏向利用职务便利索取或非法收受财物为他人谋利。","预备是为犯罪准备工具、制造条件；未遂已着手但意志以外原因未得逞；中止是自动放弃或自动有效防止结果发生。"],"answer":1,"explain":"为使合法权益免受正在发生的危险，不得已采取的损害另一较小合法权益的行为。（知识卡：紧急避险；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-008-2","subject":"criminal","chapter":"总论","type":"single","stem":"【易错点】复习“紧急避险”时，哪一个提醒最直接对应这一考点？","options":["紧急避险有必要性与限度要求。","国家工作人员主体、职务关联等是关键。","防卫对象通常是不法侵害人；防卫过当需另判。","犯罪既遂后的补救不构成犯罪中止。"],"answer":0,"explain":"本考点的常见误区：紧急避险有必要性与限度要求。 结合核心理解：为使合法权益免受正在发生的危险，不得已采取的损害另一较小合法权益的行为。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-008-3","subject":"criminal","chapter":"总论","type":"single","stem":"【知识配对】下列关于“紧急避险”的通俗记忆提示，哪项配对正确？","options":["关键词：正在进行、不法侵害、制止目的。","一个是“拿公家财物”，一个是“收别人好处”。","防卫针对侵害人；避险可能牺牲第三人较小权益。","“自动”还是“被迫”？先辨主观，再辨阶段。"],"answer":2,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：防卫针对侵害人；避险可能牺牲第三人较小权益。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-009-1","subject":"criminal","chapter":"总论","type":"single","stem":"【基础识记】关于“预备、未遂、中止”，哪一项是对应的核心知识？","options":["预备是为犯罪准备工具、制造条件；未遂已着手但意志以外原因未得逞；中止是自动放弃或自动有效防止结果发生。","一般自首强调自动投案、如实供述自己的罪行；立功关注揭发他人犯罪、提供重要线索等法定情形。","按共同犯罪中的作用及法定条件确定刑事责任；从犯依法从轻、减轻或免除处罚。","法无明文规定不为罪，法无明文规定不处罚；禁止不利于被告人的类推解释。"],"answer":0,"explain":"预备是为犯罪准备工具、制造条件；未遂已着手但意志以外原因未得逞；中止是自动放弃或自动有效防止结果发生。（知识卡：预备、未遂、中止；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-009-2","subject":"criminal","chapter":"总论","type":"single","stem":"【易错点】复习“预备、未遂、中止”时，哪一个提醒最直接对应这一考点？","options":["扩大解释与类推解释并不相同。","区分身份与实际作用，不能见“参与”就定主犯。","特殊自首和一般自首条件不同。","犯罪既遂后的补救不构成犯罪中止。"],"answer":3,"explain":"本考点的常见误区：犯罪既遂后的补救不构成犯罪中止。 结合核心理解：预备是为犯罪准备工具、制造条件；未遂已着手但意志以外原因未得逞；中止是自动放弃或自动有效防止结果发生。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-009-3","subject":"criminal","chapter":"总论","type":"single","stem":"【知识配对】下列关于“预备、未遂、中止”的通俗记忆提示，哪项配对正确？","options":["口诀：先找法条，再谈犯罪；不能凭“看着坏”就定罪。","分清组织领导、主要作用、次要辅助作用。","“自动”还是“被迫”？先辨主观，再辨阶段。","自首说自己的事，立功帮助查别人的事。"],"answer":2,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：“自动”还是“被迫”？先辨主观，再辨阶段。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-010-1","subject":"criminal","chapter":"总论","type":"single","stem":"【基础识记】关于“共同犯罪”，哪一项是对应的核心知识？","options":["按共同犯罪中的作用及法定条件确定刑事责任；从犯依法从轻、减轻或免除处罚。","二人以上共同故意犯罪；需要共同故意与共同行为。","结合主观故意内容、行为手段、打击部位、力度及案后表现等综合判断。","刑法上的因果关系需要结合行为与结果之间的客观联系判断，还要单独判断主观归责。"],"answer":1,"explain":"二人以上共同故意犯罪；需要共同故意与共同行为。（知识卡：共同犯罪；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-010-2","subject":"criminal","chapter":"总论","type":"single","stem":"【易错点】复习“共同犯罪”时，哪一个提醒最直接对应这一考点？","options":["过失共同造成结果一般不认定共同犯罪。","故意伤害致死不等同于故意杀人既遂。","有因果关系不意味着当然构成犯罪。","区分身份与实际作用，不能见“参与”就定主犯。"],"answer":0,"explain":"本考点的常见误区：过失共同造成结果一般不认定共同犯罪。 结合核心理解：二人以上共同故意犯罪；需要共同故意与共同行为。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-010-3","subject":"criminal","chapter":"总论","type":"single","stem":"【知识配对】下列关于“共同犯罪”的通俗记忆提示，哪项配对正确？","options":["不能只看结果是死还是伤，更要看主观意图。","数人一起做事≠一定共同犯罪，须同向故意。","分清组织领导、主要作用、次要辅助作用。","先看结果由谁造成，再看结果能否归责于他。"],"answer":1,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：数人一起做事≠一定共同犯罪，须同向故意。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-011-1","subject":"criminal","chapter":"总论","type":"single","stem":"【基础识记】关于“主犯、从犯、胁从犯”，哪一项是对应的核心知识？","options":["为保护合法权益，对正在进行的不法侵害采取制止行为，在法定限度内不负刑事责任。","直接故意是希望结果发生；间接故意是放任；过于自信的过失是轻信能够避免；疏忽大意的过失是应预见而未预见。","以暴力、胁迫或其他方法当场强行劫取财物，保护财产权并涉及人身权。","按共同犯罪中的作用及法定条件确定刑事责任；从犯依法从轻、减轻或免除处罚。"],"answer":3,"explain":"按共同犯罪中的作用及法定条件确定刑事责任；从犯依法从轻、减轻或免除处罚。（知识卡：主犯、从犯、胁从犯；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-011-2","subject":"criminal","chapter":"总论","type":"single","stem":"【易错点】复习“主犯、从犯、胁从犯”时，哪一个提醒最直接对应这一考点？","options":["防卫对象通常是不法侵害人；防卫过当需另判。","区分身份与实际作用，不能见“参与”就定主犯。","与抢夺、盗窃转化型抢劫区分。","过失犯罪法律有规定才负刑事责任。"],"answer":1,"explain":"本考点的常见误区：区分身份与实际作用，不能见“参与”就定主犯。 结合核心理解：按共同犯罪中的作用及法定条件确定刑事责任；从犯依法从轻、减轻或免除处罚。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-011-3","subject":"criminal","chapter":"总论","type":"single","stem":"【知识配对】下列关于“主犯、从犯、胁从犯”的通俗记忆提示，哪项配对正确？","options":["关键词：正在进行、不法侵害、制止目的。","抢劫要同时审查取财与人身强制。","“放任”和“自信不会发生”是高频分界。","分清组织领导、主要作用、次要辅助作用。"],"answer":3,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：分清组织领导、主要作用、次要辅助作用。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-012-1","subject":"criminal","chapter":"总论","type":"single","stem":"【基础识记】关于“自首与立功”，哪一项是对应的核心知识？","options":["原则上从旧兼从轻：行为后法律变化时，一般适用旧法，但新法不认为犯罪或处罚更轻的可依规则适用新法。","结合主观故意内容、行为手段、打击部位、力度及案后表现等综合判断。","直接故意是希望结果发生；间接故意是放任；过于自信的过失是轻信能够避免；疏忽大意的过失是应预见而未预见。","一般自首强调自动投案、如实供述自己的罪行；立功关注揭发他人犯罪、提供重要线索等法定情形。"],"answer":3,"explain":"一般自首强调自动投案、如实供述自己的罪行；立功关注揭发他人犯罪、提供重要线索等法定情形。（知识卡：自首与立功；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-012-2","subject":"criminal","chapter":"总论","type":"single","stem":"【易错点】复习“自首与立功”时，哪一个提醒最直接对应这一考点？","options":["特殊自首和一般自首条件不同。","过失犯罪法律有规定才负刑事责任。","故意伤害致死不等同于故意杀人既遂。","司法解释适用和法律变更需分别判断。"],"answer":0,"explain":"本考点的常见误区：特殊自首和一般自首条件不同。 结合核心理解：一般自首强调自动投案、如实供述自己的罪行；立功关注揭发他人犯罪、提供重要线索等法定情形。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-012-3","subject":"criminal","chapter":"总论","type":"single","stem":"【知识配对】下列关于“自首与立功”的通俗记忆提示，哪项配对正确？","options":["“放任”和“自信不会发生”是高频分界。","不能只看结果是死还是伤，更要看主观意图。","自首说自己的事，立功帮助查别人的事。","画时间线：行为日→法律变更日→审判日。"],"answer":2,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：自首说自己的事，立功帮助查别人的事。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-013-1","subject":"criminal","chapter":"总论","type":"single","stem":"【基础识记】关于“数罪并罚”，哪一项是对应的核心知识？","options":["一般自首强调自动投案、如实供述自己的罪行；立功关注揭发他人犯罪、提供重要线索等法定情形。","贪污偏向利用职务便利非法占有公共财物；受贿偏向利用职务便利索取或非法收受财物为他人谋利。","二人以上共同故意犯罪；需要共同故意与共同行为。","对数个犯罪的刑罚依法决定执行刑期；需区分判决前漏罪与判决后新罪。"],"answer":3,"explain":"对数个犯罪的刑罚依法决定执行刑期；需区分判决前漏罪与判决后新罪。（知识卡：数罪并罚；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-013-2","subject":"criminal","chapter":"总论","type":"single","stem":"【易错点】复习“数罪并罚”时，哪一个提醒最直接对应这一考点？","options":["特殊自首和一般自首条件不同。","死刑、无期徒刑与有期徒刑处理规则不同。","国家工作人员主体、职务关联等是关键。","过失共同造成结果一般不认定共同犯罪。"],"answer":1,"explain":"本考点的常见误区：死刑、无期徒刑与有期徒刑处理规则不同。 结合核心理解：对数个犯罪的刑罚依法决定执行刑期；需区分判决前漏罪与判决后新罪。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-013-3","subject":"criminal","chapter":"总论","type":"single","stem":"【知识配对】下列关于“数罪并罚”的通俗记忆提示，哪项配对正确？","options":["一个是“拿公家财物”，一个是“收别人好处”。","遇到数罪，先写刑期，再辨“先并后减/先减后并”。","数人一起做事≠一定共同犯罪，须同向故意。","自首说自己的事，立功帮助查别人的事。"],"answer":1,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：遇到数罪，先写刑期，再辨“先并后减/先减后并”。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-014-1","subject":"criminal","chapter":"分则","type":"single","stem":"【基础识记】关于“盗窃罪与诈骗罪”，哪一项是对应的核心知识？","options":["二人以上共同故意犯罪；需要共同故意与共同行为。","对数个犯罪的刑罚依法决定执行刑期；需区分判决前漏罪与判决后新罪。","刑法上的因果关系需要结合行为与结果之间的客观联系判断，还要单独判断主观归责。","盗窃通常表现为违反他人意思取得财物；诈骗通常包含欺骗、被害人认识错误以及基于错误处分财产。"],"answer":3,"explain":"盗窃通常表现为违反他人意思取得财物；诈骗通常包含欺骗、被害人认识错误以及基于错误处分财产。（知识卡：盗窃罪与诈骗罪；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-014-2","subject":"criminal","chapter":"分则","type":"single","stem":"【易错点】复习“盗窃罪与诈骗罪”时，哪一个提醒最直接对应这一考点？","options":["过失共同造成结果一般不认定共同犯罪。","处分意识等具体争点需要结合案情和理论。","有因果关系不意味着当然构成犯罪。","死刑、无期徒刑与有期徒刑处理规则不同。"],"answer":1,"explain":"本考点的常见误区：处分意识等具体争点需要结合案情和理论。 结合核心理解：盗窃通常表现为违反他人意思取得财物；诈骗通常包含欺骗、被害人认识错误以及基于错误处分财产。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-014-3","subject":"criminal","chapter":"分则","type":"single","stem":"【知识配对】下列关于“盗窃罪与诈骗罪”的通俗记忆提示，哪项配对正确？","options":["先看结果由谁造成，再看结果能否归责于他。","一句话：骗到“交付”看诈骗；偷偷取走多从盗窃分析。","数人一起做事≠一定共同犯罪，须同向故意。","遇到数罪，先写刑期，再辨“先并后减/先减后并”。"],"answer":1,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：一句话：骗到“交付”看诈骗；偷偷取走多从盗窃分析。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-015-1","subject":"criminal","chapter":"分则","type":"single","stem":"【基础识记】关于“抢劫罪”，哪一项是对应的核心知识？","options":["按共同犯罪中的作用及法定条件确定刑事责任；从犯依法从轻、减轻或免除处罚。","预备是为犯罪准备工具、制造条件；未遂已着手但意志以外原因未得逞；中止是自动放弃或自动有效防止结果发生。","以暴力、胁迫或其他方法当场强行劫取财物，保护财产权并涉及人身权。","原则上从旧兼从轻：行为后法律变化时，一般适用旧法，但新法不认为犯罪或处罚更轻的可依规则适用新法。"],"answer":2,"explain":"以暴力、胁迫或其他方法当场强行劫取财物，保护财产权并涉及人身权。（知识卡：抢劫罪；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-015-2","subject":"criminal","chapter":"分则","type":"single","stem":"【易错点】复习“抢劫罪”时，哪一个提醒最直接对应这一考点？","options":["区分身份与实际作用，不能见“参与”就定主犯。","与抢夺、盗窃转化型抢劫区分。","司法解释适用和法律变更需分别判断。","犯罪既遂后的补救不构成犯罪中止。"],"answer":1,"explain":"本考点的常见误区：与抢夺、盗窃转化型抢劫区分。 结合核心理解：以暴力、胁迫或其他方法当场强行劫取财物，保护财产权并涉及人身权。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-015-3","subject":"criminal","chapter":"分则","type":"single","stem":"【知识配对】下列关于“抢劫罪”的通俗记忆提示，哪项配对正确？","options":["抢劫要同时审查取财与人身强制。","“自动”还是“被迫”？先辨主观，再辨阶段。","画时间线：行为日→法律变更日→审判日。","分清组织领导、主要作用、次要辅助作用。"],"answer":0,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：抢劫要同时审查取财与人身强制。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-016-1","subject":"criminal","chapter":"分则","type":"single","stem":"【基础识记】关于“侵占罪与职务侵占罪”，哪一项是对应的核心知识？","options":["二人以上共同故意犯罪；需要共同故意与共同行为。","侵占关注将代为保管财物等非法占为己有；职务侵占关注公司、企业等工作人员利用职务便利侵占本单位财物。","贪污偏向利用职务便利非法占有公共财物；受贿偏向利用职务便利索取或非法收受财物为他人谋利。","一般自首强调自动投案、如实供述自己的罪行；立功关注揭发他人犯罪、提供重要线索等法定情形。"],"answer":1,"explain":"侵占关注将代为保管财物等非法占为己有；职务侵占关注公司、企业等工作人员利用职务便利侵占本单位财物。（知识卡：侵占罪与职务侵占罪；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-016-2","subject":"criminal","chapter":"分则","type":"single","stem":"【易错点】复习“侵占罪与职务侵占罪”时，哪一个提醒最直接对应这一考点？","options":["过失共同造成结果一般不认定共同犯罪。","犯罪主体及财物范围不可混淆。","国家工作人员主体、职务关联等是关键。","特殊自首和一般自首条件不同。"],"answer":1,"explain":"本考点的常见误区：犯罪主体及财物范围不可混淆。 结合核心理解：侵占关注将代为保管财物等非法占为己有；职务侵占关注公司、企业等工作人员利用职务便利侵占本单位财物。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-016-3","subject":"criminal","chapter":"分则","type":"single","stem":"【知识配对】下列关于“侵占罪与职务侵占罪”的通俗记忆提示，哪项配对正确？","options":["数人一起做事≠一定共同犯罪，须同向故意。","自首说自己的事，立功帮助查别人的事。","一个是“拿公家财物”，一个是“收别人好处”。","先问财物原来谁合法占有，再问有无职务便利。"],"answer":3,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：先问财物原来谁合法占有，再问有无职务便利。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-017-1","subject":"criminal","chapter":"分则","type":"single","stem":"【基础识记】关于“故意伤害与故意杀人”，哪一项是对应的核心知识？","options":["结合主观故意内容、行为手段、打击部位、力度及案后表现等综合判断。","成立通常需要行为人负有作为义务、有履行可能且不履行导致相应结果。","二人以上共同故意犯罪；需要共同故意与共同行为。","交通肇事强调违反交通运输管理法规并造成法定重大后果；危险驾驶着眼于刑法列明的危险驾驶行为。"],"answer":0,"explain":"结合主观故意内容、行为手段、打击部位、力度及案后表现等综合判断。（知识卡：故意伤害与故意杀人；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-017-2","subject":"criminal","chapter":"分则","type":"single","stem":"【易错点】复习“故意伤害与故意杀人”时，哪一个提醒最直接对应这一考点？","options":["故意伤害致死不等同于故意杀人既遂。","过失共同造成结果一般不认定共同犯罪。","普通路人不必然有刑法上的救助义务。","醉驾案件具体入罪及出罪需结合最新规范。"],"answer":0,"explain":"本考点的常见误区：故意伤害致死不等同于故意杀人既遂。 结合核心理解：结合主观故意内容、行为手段、打击部位、力度及案后表现等综合判断。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-017-3","subject":"criminal","chapter":"分则","type":"single","stem":"【知识配对】下列关于“故意伤害与故意杀人”的通俗记忆提示，哪项配对正确？","options":["先看行为种类，再看结果门槛和主观方面。","不能只看结果是死还是伤，更要看主观意图。","三个问：该不该救？能不能救？不救有什么后果？","数人一起做事≠一定共同犯罪，须同向故意。"],"answer":1,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：不能只看结果是死还是伤，更要看主观意图。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-018-1","subject":"criminal","chapter":"分则","type":"single","stem":"【基础识记】关于“交通肇事与危险驾驶”，哪一项是对应的核心知识？","options":["识别行为→定构成要件→找违法阻却与责任阻却→确定罪数及处罚。","盗窃通常表现为违反他人意思取得财物；诈骗通常包含欺骗、被害人认识错误以及基于错误处分财产。","贪污偏向利用职务便利非法占有公共财物；受贿偏向利用职务便利索取或非法收受财物为他人谋利。","交通肇事强调违反交通运输管理法规并造成法定重大后果；危险驾驶着眼于刑法列明的危险驾驶行为。"],"answer":3,"explain":"交通肇事强调违反交通运输管理法规并造成法定重大后果；危险驾驶着眼于刑法列明的危险驾驶行为。（知识卡：交通肇事与危险驾驶；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-018-2","subject":"criminal","chapter":"分则","type":"single","stem":"【易错点】复习“交通肇事与危险驾驶”时，哪一个提醒最直接对应这一考点？","options":["醉驾案件具体入罪及出罪需结合最新规范。","国家工作人员主体、职务关联等是关键。","只报罪名不论证容易丢主观题分。","处分意识等具体争点需要结合案情和理论。"],"answer":0,"explain":"本考点的常见误区：醉驾案件具体入罪及出罪需结合最新规范。 结合核心理解：交通肇事强调违反交通运输管理法规并造成法定重大后果；危险驾驶着眼于刑法列明的危险驾驶行为。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-018-3","subject":"criminal","chapter":"分则","type":"single","stem":"【知识配对】下列关于“交通肇事与危险驾驶”的通俗记忆提示，哪项配对正确？","options":["一个是“拿公家财物”，一个是“收别人好处”。","答案先写结论，再分层讲事实与法理。","一句话：骗到“交付”看诈骗；偷偷取走多从盗窃分析。","先看行为种类，再看结果门槛和主观方面。"],"answer":3,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：先看行为种类，再看结果门槛和主观方面。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-019-1","subject":"criminal","chapter":"分则","type":"single","stem":"【基础识记】关于“贪污罪与受贿罪”，哪一项是对应的核心知识？","options":["预备是为犯罪准备工具、制造条件；未遂已着手但意志以外原因未得逞；中止是自动放弃或自动有效防止结果发生。","贪污偏向利用职务便利非法占有公共财物；受贿偏向利用职务便利索取或非法收受财物为他人谋利。","刑法上的因果关系需要结合行为与结果之间的客观联系判断，还要单独判断主观归责。","盗窃通常表现为违反他人意思取得财物；诈骗通常包含欺骗、被害人认识错误以及基于错误处分财产。"],"answer":1,"explain":"贪污偏向利用职务便利非法占有公共财物；受贿偏向利用职务便利索取或非法收受财物为他人谋利。（知识卡：贪污罪与受贿罪；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-019-2","subject":"criminal","chapter":"分则","type":"single","stem":"【易错点】复习“贪污罪与受贿罪”时，哪一个提醒最直接对应这一考点？","options":["犯罪既遂后的补救不构成犯罪中止。","处分意识等具体争点需要结合案情和理论。","国家工作人员主体、职务关联等是关键。","有因果关系不意味着当然构成犯罪。"],"answer":2,"explain":"本考点的常见误区：国家工作人员主体、职务关联等是关键。 结合核心理解：贪污偏向利用职务便利非法占有公共财物；受贿偏向利用职务便利索取或非法收受财物为他人谋利。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-019-3","subject":"criminal","chapter":"分则","type":"single","stem":"【知识配对】下列关于“贪污罪与受贿罪”的通俗记忆提示，哪项配对正确？","options":["“自动”还是“被迫”？先辨主观，再辨阶段。","一句话：骗到“交付”看诈骗；偷偷取走多从盗窃分析。","一个是“拿公家财物”，一个是“收别人好处”。","先看结果由谁造成，再看结果能否归责于他。"],"answer":2,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：一个是“拿公家财物”，一个是“收别人好处”。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-020-1","subject":"criminal","chapter":"方法","type":"single","stem":"【基础识记】关于“刑法案例四步法”，哪一项是对应的核心知识？","options":["识别行为→定构成要件→找违法阻却与责任阻却→确定罪数及处罚。","法无明文规定不为罪，法无明文规定不处罚；禁止不利于被告人的类推解释。","直接故意是希望结果发生；间接故意是放任；过于自信的过失是轻信能够避免；疏忽大意的过失是应预见而未预见。","二人以上共同故意犯罪；需要共同故意与共同行为。"],"answer":0,"explain":"识别行为→定构成要件→找违法阻却与责任阻却→确定罪数及处罚。（知识卡：刑法案例四步法；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-020-2","subject":"criminal","chapter":"方法","type":"single","stem":"【易错点】复习“刑法案例四步法”时，哪一个提醒最直接对应这一考点？","options":["过失共同造成结果一般不认定共同犯罪。","只报罪名不论证容易丢主观题分。","过失犯罪法律有规定才负刑事责任。","扩大解释与类推解释并不相同。"],"answer":1,"explain":"本考点的常见误区：只报罪名不论证容易丢主观题分。 结合核心理解：识别行为→定构成要件→找违法阻却与责任阻却→确定罪数及处罚。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-020-3","subject":"criminal","chapter":"方法","type":"single","stem":"【知识配对】下列关于“刑法案例四步法”的通俗记忆提示，哪项配对正确？","options":["答案先写结论，再分层讲事实与法理。","口诀：先找法条，再谈犯罪；不能凭“看着坏”就定罪。","“放任”和“自信不会发生”是高频分界。","数人一起做事≠一定共同犯罪，须同向故意。"],"answer":0,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：答案先写结论，再分层讲事实与法理。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-021-1","subject":"civil","chapter":"总则","type":"single","stem":"【基础识记】关于“民法基本原则”，哪一项是对应的核心知识？","options":["平等、自愿、公平、诚信、守法与公序良俗、绿色原则共同构成民事活动基本要求。","行为人虽无代理权，但相对人有理由相信其有代理权且符合条件时，代理行为有效。","先找谁向谁要什么→找合同/物权/侵权依据→查要件→查抗辩→下结论。","依法定或约定事由解除合同；解除后未履行的终止履行，已履行的按性质和履行情况处理。"],"answer":0,"explain":"平等、自愿、公平、诚信、守法与公序良俗、绿色原则共同构成民事活动基本要求。（知识卡：民法基本原则；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-021-2","subject":"civil","chapter":"总则","type":"single","stem":"【易错点】复习“民法基本原则”时，哪一个提醒最直接对应这一考点？","options":["只描述案情而不指明请求权基础是高频失分点。","原则不能随意替代具体请求权基础。","表见代理与无权代理追认要分开。","解除、撤销、无效后果不同。"],"answer":1,"explain":"本考点的常见误区：原则不能随意替代具体请求权基础。 结合核心理解：平等、自愿、公平、诚信、守法与公序良俗、绿色原则共同构成民事活动基本要求。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-021-3","subject":"civil","chapter":"总则","type":"single","stem":"【知识配对】下列关于“民法基本原则”的通俗记忆提示，哪项配对正确？","options":["诚信像交易底线；公序良俗是社会底线。","用“谁向谁，凭什么，要什么”开头。","“没权限却看起来有权限”，重点在合理信赖。","解除不是随时后悔，必须找解除权依据。"],"answer":0,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：诚信像交易底线；公序良俗是社会底线。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-022-1","subject":"civil","chapter":"总则","type":"single","stem":"【基础识记】关于“民事法律行为”，哪一项是对应的核心知识？","options":["重大误解、欺诈、胁迫等法定事由可能产生撤销权，须按构成要件识别。","无效行为自始不发生预期效力；可撤销行为在被依法撤销前有相应效力。","以意思表示设立、变更、终止民事法律关系的行为；有效需满足相应法定条件。","不履行或履行不符合约定，可能承担继续履行、补救、损害赔偿等违约责任。"],"answer":2,"explain":"以意思表示设立、变更、终止民事法律关系的行为；有效需满足相应法定条件。（知识卡：民事法律行为；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-022-2","subject":"civil","chapter":"总则","type":"single","stem":"【易错点】复习“民事法律行为”时，哪一个提醒最直接对应这一考点？","options":["成立、生效、可撤销、无效分别判断。","违约责任与侵权责任竞合要考虑请求权选择。","撤销权行使期限不能当普通诉讼时效。","欺诈不当然等于行为无效。"],"answer":0,"explain":"本考点的常见误区：成立、生效、可撤销、无效分别判断。 结合核心理解：以意思表示设立、变更、终止民事法律关系的行为；有效需满足相应法定条件。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-022-3","subject":"civil","chapter":"总则","type":"single","stem":"【知识配对】下列关于“民事法律行为”的通俗记忆提示，哪项配对正确？","options":["无效不用“撤销”才无效，可撤销要依法主张。","先写合同有效，再写违反了哪项义务。","合同、遗嘱通常是民事法律行为。","记住：意思不真实，先考虑可撤销。"],"answer":2,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：合同、遗嘱通常是民事法律行为。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-023-1","subject":"civil","chapter":"总则","type":"single","stem":"【基础识记】关于“无效与可撤销行为”，哪一项是对应的核心知识？","options":["婚姻关系存续期间取得的法定共同财产一般归夫妻共同所有；依法属于个人财产的除外。","民法典保护自然人的个人信息；处理个人信息应依法遵守合法、正当、必要等原则。","依法定或约定事由解除合同；解除后未履行的终止履行，已履行的按性质和履行情况处理。","无效行为自始不发生预期效力；可撤销行为在被依法撤销前有相应效力。"],"answer":3,"explain":"无效行为自始不发生预期效力；可撤销行为在被依法撤销前有相应效力。（知识卡：无效与可撤销行为；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-023-2","subject":"civil","chapter":"总则","type":"single","stem":"【易错点】复习“无效与可撤销行为”时，哪一个提醒最直接对应这一考点？","options":["婚前个人财产不当然因结婚变共同财产。","解除、撤销、无效后果不同。","撤销权行使期限不能当普通诉讼时效。","隐私权与个人信息权益保护有交叉但不重合。"],"answer":2,"explain":"本考点的常见误区：撤销权行使期限不能当普通诉讼时效。 结合核心理解：无效行为自始不发生预期效力；可撤销行为在被依法撤销前有相应效力。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-023-3","subject":"civil","chapter":"总则","type":"single","stem":"【知识配对】下列关于“无效与可撤销行为”的通俗记忆提示，哪项配对正确？","options":["无效不用“撤销”才无效，可撤销要依法主张。","解除不是随时后悔，必须找解除权依据。","收集个人信息不是“用户点了同意”就可以无限用。","先定婚内时间，再看财产性质与约定。"],"answer":0,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：无效不用“撤销”才无效，可撤销要依法主张。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-024-1","subject":"civil","chapter":"总则","type":"single","stem":"【基础识记】关于“重大误解、欺诈、胁迫”，哪一项是对应的核心知识？","options":["普通诉讼时效期间通常为三年；适用中止、中断等制度并有特别规定。","民法典保护自然人的个人信息；处理个人信息应依法遵守合法、正当、必要等原则。","重大误解、欺诈、胁迫等法定事由可能产生撤销权，须按构成要件识别。","二者适用有不同规则；当事人同时约定时，在法定条件下可选择适用相关条款。"],"answer":2,"explain":"重大误解、欺诈、胁迫等法定事由可能产生撤销权，须按构成要件识别。（知识卡：重大误解、欺诈、胁迫；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-024-2","subject":"civil","chapter":"总则","type":"single","stem":"【易错点】复习“重大误解、欺诈、胁迫”时，哪一个提醒最直接对应这一考点？","options":["欺诈不当然等于行为无效。","具体起算点、最长保护期与例外不能混淆。","“订金”与法定意义的“定金”不等同。","隐私权与个人信息权益保护有交叉但不重合。"],"answer":0,"explain":"本考点的常见误区：欺诈不当然等于行为无效。 结合核心理解：重大误解、欺诈、胁迫等法定事由可能产生撤销权，须按构成要件识别。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-024-3","subject":"civil","chapter":"总则","type":"single","stem":"【知识配对】下列关于“重大误解、欺诈、胁迫”的通俗记忆提示，哪项配对正确？","options":["收集个人信息不是“用户点了同意”就可以无限用。","“定金罚则”要记双倍返还与不得返还的触发条件。","时效通常影响胜诉权保障，不使债权自然消灭。","记住：意思不真实，先考虑可撤销。"],"answer":3,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：记住：意思不真实，先考虑可撤销。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-025-1","subject":"civil","chapter":"总则","type":"single","stem":"【基础识记】关于“表见代理”，哪一项是对应的核心知识？","options":["婚姻关系存续期间取得的法定共同财产一般归夫妻共同所有；依法属于个人财产的除外。","先找谁向谁要什么→找合同/物权/侵权依据→查要件→查抗辩→下结论。","无权处分情形下，受让人符合法定善意、合理价格以及登记/交付等条件，可能取得物权。","行为人虽无代理权，但相对人有理由相信其有代理权且符合条件时，代理行为有效。"],"answer":3,"explain":"行为人虽无代理权，但相对人有理由相信其有代理权且符合条件时，代理行为有效。（知识卡：表见代理；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-025-2","subject":"civil","chapter":"总则","type":"single","stem":"【易错点】复习“表见代理”时，哪一个提醒最直接对应这一考点？","options":["表见代理与无权代理追认要分开。","婚前个人财产不当然因结婚变共同财产。","只描述案情而不指明请求权基础是高频失分点。","拾得遗失物等存在特别规则。"],"answer":0,"explain":"本考点的常见误区：表见代理与无权代理追认要分开。 结合核心理解：行为人虽无代理权，但相对人有理由相信其有代理权且符合条件时，代理行为有效。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-025-3","subject":"civil","chapter":"总则","type":"single","stem":"【知识配对】下列关于“表见代理”的通俗记忆提示，哪项配对正确？","options":["“没权限却看起来有权限”，重点在合理信赖。","先定婚内时间，再看财产性质与约定。","用“谁向谁，凭什么，要什么”开头。","先检查无权处分，再查善意、价格、公示。"],"answer":0,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：“没权限却看起来有权限”，重点在合理信赖。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-026-1","subject":"civil","chapter":"总则","type":"single","stem":"【基础识记】关于“诉讼时效”，哪一项是对应的核心知识？","options":["抵押通常不转移占有；动产质权一般以交付设立。","普通诉讼时效期间通常为三年；适用中止、中断等制度并有特别规定。","二者适用有不同规则；当事人同时约定时，在法定条件下可选择适用相关条款。","通常结合侵权行为、损害、因果关系、过错判断，但存在无过错责任和过错推定等特别规则。"],"answer":1,"explain":"普通诉讼时效期间通常为三年；适用中止、中断等制度并有特别规定。（知识卡：诉讼时效；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-026-2","subject":"civil","chapter":"总则","type":"single","stem":"【易错点】复习“诉讼时效”时，哪一个提醒最直接对应这一考点？","options":["不要给所有侵权类型硬套过错责任。","“订金”与法定意义的“定金”不等同。","具体起算点、最长保护期与例外不能混淆。","权利质押和特殊抵押需单独学习。"],"answer":2,"explain":"本考点的常见误区：具体起算点、最长保护期与例外不能混淆。 结合核心理解：普通诉讼时效期间通常为三年；适用中止、中断等制度并有特别规定。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-026-3","subject":"civil","chapter":"总则","type":"single","stem":"【知识配对】下列关于“诉讼时效”的通俗记忆提示，哪项配对正确？","options":["“押不交、质要交”是入门记法，但不覆盖全部规则。","时效通常影响胜诉权保障，不使债权自然消灭。","四格分析：行为、损害、因果、归责。","“定金罚则”要记双倍返还与不得返还的触发条件。"],"answer":1,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：时效通常影响胜诉权保障，不使债权自然消灭。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-027-1","subject":"civil","chapter":"物权","type":"single","stem":"【基础识记】关于“物权变动”，哪一项是对应的核心知识？","options":["先找谁向谁要什么→找合同/物权/侵权依据→查要件→查抗辩→下结论。","普通诉讼时效期间通常为三年；适用中止、中断等制度并有特别规定。","不动产物权变动通常以依法登记为生效要件；动产物权设立转让通常以交付为生效要件，法律另有规定除外。","以意思表示设立、变更、终止民事法律关系的行为；有效需满足相应法定条件。"],"answer":2,"explain":"不动产物权变动通常以依法登记为生效要件；动产物权设立转让通常以交付为生效要件，法律另有规定除外。（知识卡：物权变动；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-027-2","subject":"civil","chapter":"物权","type":"single","stem":"【易错点】复习“物权变动”时，哪一个提醒最直接对应这一考点？","options":["合同有效不等于物权已变动。","具体起算点、最长保护期与例外不能混淆。","只描述案情而不指明请求权基础是高频失分点。","成立、生效、可撤销、无效分别判断。"],"answer":0,"explain":"本考点的常见误区：合同有效不等于物权已变动。 结合核心理解：不动产物权变动通常以依法登记为生效要件；动产物权设立转让通常以交付为生效要件，法律另有规定除外。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-027-3","subject":"civil","chapter":"物权","type":"single","stem":"【知识配对】下列关于“物权变动”的通俗记忆提示，哪项配对正确？","options":["合同、遗嘱通常是民事法律行为。","时效通常影响胜诉权保障，不使债权自然消灭。","用“谁向谁，凭什么，要什么”开头。","房子看登记，动产看交付；先识别例外。"],"answer":3,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：房子看登记，动产看交付；先识别例外。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-028-1","subject":"civil","chapter":"物权","type":"single","stem":"【基础识记】关于“善意取得”，哪一项是对应的核心知识？","options":["无权处分情形下，受让人符合法定善意、合理价格以及登记/交付等条件，可能取得物权。","普通诉讼时效期间通常为三年；适用中止、中断等制度并有特别规定。","通常结合侵权行为、损害、因果关系、过错判断，但存在无过错责任和过错推定等特别规则。","要约内容具体确定并表明受约束意图；承诺通常须与要约内容一致。"],"answer":0,"explain":"无权处分情形下，受让人符合法定善意、合理价格以及登记/交付等条件，可能取得物权。（知识卡：善意取得；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-028-2","subject":"civil","chapter":"物权","type":"single","stem":"【易错点】复习“善意取得”时，哪一个提醒最直接对应这一考点？","options":["要约邀请与要约区分，承诺实质变更可能是新要约。","拾得遗失物等存在特别规则。","具体起算点、最长保护期与例外不能混淆。","不要给所有侵权类型硬套过错责任。"],"answer":1,"explain":"本考点的常见误区：拾得遗失物等存在特别规则。 结合核心理解：无权处分情形下，受让人符合法定善意、合理价格以及登记/交付等条件，可能取得物权。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-028-3","subject":"civil","chapter":"物权","type":"single","stem":"【知识配对】下列关于“善意取得”的通俗记忆提示，哪项配对正确？","options":["先检查无权处分，再查善意、价格、公示。","四格分析：行为、损害、因果、归责。","时效通常影响胜诉权保障，不使债权自然消灭。","要约像下订单，承诺像同意成交。"],"answer":0,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：先检查无权处分，再查善意、价格、公示。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-029-1","subject":"civil","chapter":"物权","type":"single","stem":"【基础识记】关于“抵押权与质权”，哪一项是对应的核心知识？","options":["无效行为自始不发生预期效力；可撤销行为在被依法撤销前有相应效力。","重大误解、欺诈、胁迫等法定事由可能产生撤销权，须按构成要件识别。","抵押通常不转移占有；动产质权一般以交付设立。","以意思表示设立、变更、终止民事法律关系的行为；有效需满足相应法定条件。"],"answer":2,"explain":"抵押通常不转移占有；动产质权一般以交付设立。（知识卡：抵押权与质权；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-029-2","subject":"civil","chapter":"物权","type":"single","stem":"【易错点】复习“抵押权与质权”时，哪一个提醒最直接对应这一考点？","options":["成立、生效、可撤销、无效分别判断。","撤销权行使期限不能当普通诉讼时效。","欺诈不当然等于行为无效。","权利质押和特殊抵押需单独学习。"],"answer":3,"explain":"本考点的常见误区：权利质押和特殊抵押需单独学习。 结合核心理解：抵押通常不转移占有；动产质权一般以交付设立。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-029-3","subject":"civil","chapter":"物权","type":"single","stem":"【知识配对】下列关于“抵押权与质权”的通俗记忆提示，哪项配对正确？","options":["无效不用“撤销”才无效，可撤销要依法主张。","记住：意思不真实，先考虑可撤销。","合同、遗嘱通常是民事法律行为。","“押不交、质要交”是入门记法，但不覆盖全部规则。"],"answer":3,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：“押不交、质要交”是入门记法，但不覆盖全部规则。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-030-1","subject":"civil","chapter":"合同","type":"single","stem":"【基础识记】关于“要约与承诺”，哪一项是对应的核心知识？","options":["抵押通常不转移占有；动产质权一般以交付设立。","不动产物权变动通常以依法登记为生效要件；动产物权设立转让通常以交付为生效要件，法律另有规定除外。","要约内容具体确定并表明受约束意图；承诺通常须与要约内容一致。","第一顺序为配偶、子女、父母；第二顺序为兄弟姐妹、祖父母、外祖父母；特殊情形依法处理。"],"answer":2,"explain":"要约内容具体确定并表明受约束意图；承诺通常须与要约内容一致。（知识卡：要约与承诺；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-030-2","subject":"civil","chapter":"合同","type":"single","stem":"【易错点】复习“要约与承诺”时，哪一个提醒最直接对应这一考点？","options":["代位继承、转继承与遗嘱继承另行判断。","合同有效不等于物权已变动。","要约邀请与要约区分，承诺实质变更可能是新要约。","权利质押和特殊抵押需单独学习。"],"answer":2,"explain":"本考点的常见误区：要约邀请与要约区分，承诺实质变更可能是新要约。 结合核心理解：要约内容具体确定并表明受约束意图；承诺通常须与要约内容一致。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-030-3","subject":"civil","chapter":"合同","type":"single","stem":"【知识配对】下列关于“要约与承诺”的通俗记忆提示，哪项配对正确？","options":["口诀：配子父一顺；兄祖二顺。","“押不交、质要交”是入门记法，但不覆盖全部规则。","房子看登记，动产看交付；先识别例外。","要约像下订单，承诺像同意成交。"],"answer":3,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：要约像下订单，承诺像同意成交。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-031-1","subject":"civil","chapter":"合同","type":"single","stem":"【基础识记】关于“违约责任”，哪一项是对应的核心知识？","options":["普通诉讼时效期间通常为三年；适用中止、中断等制度并有特别规定。","无权处分情形下，受让人符合法定善意、合理价格以及登记/交付等条件，可能取得物权。","二者适用有不同规则；当事人同时约定时，在法定条件下可选择适用相关条款。","不履行或履行不符合约定，可能承担继续履行、补救、损害赔偿等违约责任。"],"answer":3,"explain":"不履行或履行不符合约定，可能承担继续履行、补救、损害赔偿等违约责任。（知识卡：违约责任；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-031-2","subject":"civil","chapter":"合同","type":"single","stem":"【易错点】复习“违约责任”时，哪一个提醒最直接对应这一考点？","options":["违约责任与侵权责任竞合要考虑请求权选择。","具体起算点、最长保护期与例外不能混淆。","“订金”与法定意义的“定金”不等同。","拾得遗失物等存在特别规则。"],"answer":0,"explain":"本考点的常见误区：违约责任与侵权责任竞合要考虑请求权选择。 结合核心理解：不履行或履行不符合约定，可能承担继续履行、补救、损害赔偿等违约责任。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-031-3","subject":"civil","chapter":"合同","type":"single","stem":"【知识配对】下列关于“违约责任”的通俗记忆提示，哪项配对正确？","options":["时效通常影响胜诉权保障，不使债权自然消灭。","“定金罚则”要记双倍返还与不得返还的触发条件。","先检查无权处分，再查善意、价格、公示。","先写合同有效，再写违反了哪项义务。"],"answer":3,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：先写合同有效，再写违反了哪项义务。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-032-1","subject":"civil","chapter":"合同","type":"single","stem":"【基础识记】关于“定金与违约金”，哪一项是对应的核心知识？","options":["抵押通常不转移占有；动产质权一般以交付设立。","二者适用有不同规则；当事人同时约定时，在法定条件下可选择适用相关条款。","第一顺序为配偶、子女、父母；第二顺序为兄弟姐妹、祖父母、外祖父母；特殊情形依法处理。","无权处分情形下，受让人符合法定善意、合理价格以及登记/交付等条件，可能取得物权。"],"answer":1,"explain":"二者适用有不同规则；当事人同时约定时，在法定条件下可选择适用相关条款。（知识卡：定金与违约金；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-032-2","subject":"civil","chapter":"合同","type":"single","stem":"【易错点】复习“定金与违约金”时，哪一个提醒最直接对应这一考点？","options":["“订金”与法定意义的“定金”不等同。","代位继承、转继承与遗嘱继承另行判断。","权利质押和特殊抵押需单独学习。","拾得遗失物等存在特别规则。"],"answer":0,"explain":"本考点的常见误区：“订金”与法定意义的“定金”不等同。 结合核心理解：二者适用有不同规则；当事人同时约定时，在法定条件下可选择适用相关条款。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-032-3","subject":"civil","chapter":"合同","type":"single","stem":"【知识配对】下列关于“定金与违约金”的通俗记忆提示，哪项配对正确？","options":["“押不交、质要交”是入门记法，但不覆盖全部规则。","先检查无权处分，再查善意、价格、公示。","“定金罚则”要记双倍返还与不得返还的触发条件。","口诀：配子父一顺；兄祖二顺。"],"answer":2,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：“定金罚则”要记双倍返还与不得返还的触发条件。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-033-1","subject":"civil","chapter":"合同","type":"single","stem":"【基础识记】关于“合同解除”，哪一项是对应的核心知识？","options":["民法典对高空抛物、建筑物等设施脱落坠落分别规定责任和调查义务。","依法定或约定事由解除合同；解除后未履行的终止履行，已履行的按性质和履行情况处理。","二者适用有不同规则；当事人同时约定时，在法定条件下可选择适用相关条款。","普通诉讼时效期间通常为三年；适用中止、中断等制度并有特别规定。"],"answer":1,"explain":"依法定或约定事由解除合同；解除后未履行的终止履行，已履行的按性质和履行情况处理。（知识卡：合同解除；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-033-2","subject":"civil","chapter":"合同","type":"single","stem":"【易错点】复习“合同解除”时，哪一个提醒最直接对应这一考点？","options":["不能把所有住户都直接视作侵权人。","具体起算点、最长保护期与例外不能混淆。","解除、撤销、无效后果不同。","“订金”与法定意义的“定金”不等同。"],"answer":2,"explain":"本考点的常见误区：解除、撤销、无效后果不同。 结合核心理解：依法定或约定事由解除合同；解除后未履行的终止履行，已履行的按性质和履行情况处理。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-033-3","subject":"civil","chapter":"合同","type":"single","stem":"【知识配对】下列关于“合同解除”的通俗记忆提示，哪项配对正确？","options":["时效通常影响胜诉权保障，不使债权自然消灭。","抛物先找行为人，坠物还要看管理维护责任。","解除不是随时后悔，必须找解除权依据。","“定金罚则”要记双倍返还与不得返还的触发条件。"],"answer":2,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：解除不是随时后悔，必须找解除权依据。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-034-1","subject":"civil","chapter":"人格权","type":"single","stem":"【基础识记】关于“个人信息保护”，哪一项是对应的核心知识？","options":["不动产物权变动通常以依法登记为生效要件；动产物权设立转让通常以交付为生效要件，法律另有规定除外。","行为人虽无代理权，但相对人有理由相信其有代理权且符合条件时，代理行为有效。","普通诉讼时效期间通常为三年；适用中止、中断等制度并有特别规定。","民法典保护自然人的个人信息；处理个人信息应依法遵守合法、正当、必要等原则。"],"answer":3,"explain":"民法典保护自然人的个人信息；处理个人信息应依法遵守合法、正当、必要等原则。（知识卡：个人信息保护；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-034-2","subject":"civil","chapter":"人格权","type":"single","stem":"【易错点】复习“个人信息保护”时，哪一个提醒最直接对应这一考点？","options":["具体起算点、最长保护期与例外不能混淆。","隐私权与个人信息权益保护有交叉但不重合。","合同有效不等于物权已变动。","表见代理与无权代理追认要分开。"],"answer":1,"explain":"本考点的常见误区：隐私权与个人信息权益保护有交叉但不重合。 结合核心理解：民法典保护自然人的个人信息；处理个人信息应依法遵守合法、正当、必要等原则。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-034-3","subject":"civil","chapter":"人格权","type":"single","stem":"【知识配对】下列关于“个人信息保护”的通俗记忆提示，哪项配对正确？","options":["房子看登记，动产看交付；先识别例外。","收集个人信息不是“用户点了同意”就可以无限用。","时效通常影响胜诉权保障，不使债权自然消灭。","“没权限却看起来有权限”，重点在合理信赖。"],"answer":1,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：收集个人信息不是“用户点了同意”就可以无限用。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-035-1","subject":"civil","chapter":"婚姻继承","type":"single","stem":"【基础识记】关于“法定继承顺序”，哪一项是对应的核心知识？","options":["平等、自愿、公平、诚信、守法与公序良俗、绿色原则共同构成民事活动基本要求。","第一顺序为配偶、子女、父母；第二顺序为兄弟姐妹、祖父母、外祖父母；特殊情形依法处理。","依法定或约定事由解除合同；解除后未履行的终止履行，已履行的按性质和履行情况处理。","普通诉讼时效期间通常为三年；适用中止、中断等制度并有特别规定。"],"answer":1,"explain":"第一顺序为配偶、子女、父母；第二顺序为兄弟姐妹、祖父母、外祖父母；特殊情形依法处理。（知识卡：法定继承顺序；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-035-2","subject":"civil","chapter":"婚姻继承","type":"single","stem":"【易错点】复习“法定继承顺序”时，哪一个提醒最直接对应这一考点？","options":["具体起算点、最长保护期与例外不能混淆。","原则不能随意替代具体请求权基础。","解除、撤销、无效后果不同。","代位继承、转继承与遗嘱继承另行判断。"],"answer":3,"explain":"本考点的常见误区：代位继承、转继承与遗嘱继承另行判断。 结合核心理解：第一顺序为配偶、子女、父母；第二顺序为兄弟姐妹、祖父母、外祖父母；特殊情形依法处理。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-035-3","subject":"civil","chapter":"婚姻继承","type":"single","stem":"【知识配对】下列关于“法定继承顺序”的通俗记忆提示，哪项配对正确？","options":["解除不是随时后悔，必须找解除权依据。","诚信像交易底线；公序良俗是社会底线。","时效通常影响胜诉权保障，不使债权自然消灭。","口诀：配子父一顺；兄祖二顺。"],"answer":3,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：口诀：配子父一顺；兄祖二顺。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-036-1","subject":"civil","chapter":"婚姻继承","type":"single","stem":"【基础识记】关于“夫妻共同财产”，哪一项是对应的核心知识？","options":["婚姻关系存续期间取得的法定共同财产一般归夫妻共同所有；依法属于个人财产的除外。","不动产物权变动通常以依法登记为生效要件；动产物权设立转让通常以交付为生效要件，法律另有规定除外。","重大误解、欺诈、胁迫等法定事由可能产生撤销权，须按构成要件识别。","行为人虽无代理权，但相对人有理由相信其有代理权且符合条件时，代理行为有效。"],"answer":0,"explain":"婚姻关系存续期间取得的法定共同财产一般归夫妻共同所有；依法属于个人财产的除外。（知识卡：夫妻共同财产；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-036-2","subject":"civil","chapter":"婚姻继承","type":"single","stem":"【易错点】复习“夫妻共同财产”时，哪一个提醒最直接对应这一考点？","options":["表见代理与无权代理追认要分开。","欺诈不当然等于行为无效。","合同有效不等于物权已变动。","婚前个人财产不当然因结婚变共同财产。"],"answer":3,"explain":"本考点的常见误区：婚前个人财产不当然因结婚变共同财产。 结合核心理解：婚姻关系存续期间取得的法定共同财产一般归夫妻共同所有；依法属于个人财产的除外。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-036-3","subject":"civil","chapter":"婚姻继承","type":"single","stem":"【知识配对】下列关于“夫妻共同财产”的通俗记忆提示，哪项配对正确？","options":["“没权限却看起来有权限”，重点在合理信赖。","记住：意思不真实，先考虑可撤销。","先定婚内时间，再看财产性质与约定。","房子看登记，动产看交付；先识别例外。"],"answer":2,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：先定婚内时间，再看财产性质与约定。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-037-1","subject":"civil","chapter":"侵权","type":"single","stem":"【基础识记】关于“一般侵权责任”，哪一项是对应的核心知识？","options":["要约内容具体确定并表明受约束意图；承诺通常须与要约内容一致。","不动产物权变动通常以依法登记为生效要件；动产物权设立转让通常以交付为生效要件，法律另有规定除外。","通常结合侵权行为、损害、因果关系、过错判断，但存在无过错责任和过错推定等特别规则。","重大误解、欺诈、胁迫等法定事由可能产生撤销权，须按构成要件识别。"],"answer":2,"explain":"通常结合侵权行为、损害、因果关系、过错判断，但存在无过错责任和过错推定等特别规则。（知识卡：一般侵权责任；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-037-2","subject":"civil","chapter":"侵权","type":"single","stem":"【易错点】复习“一般侵权责任”时，哪一个提醒最直接对应这一考点？","options":["不要给所有侵权类型硬套过错责任。","合同有效不等于物权已变动。","欺诈不当然等于行为无效。","要约邀请与要约区分，承诺实质变更可能是新要约。"],"answer":0,"explain":"本考点的常见误区：不要给所有侵权类型硬套过错责任。 结合核心理解：通常结合侵权行为、损害、因果关系、过错判断，但存在无过错责任和过错推定等特别规则。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-037-3","subject":"civil","chapter":"侵权","type":"single","stem":"【知识配对】下列关于“一般侵权责任”的通俗记忆提示，哪项配对正确？","options":["四格分析：行为、损害、因果、归责。","要约像下订单，承诺像同意成交。","记住：意思不真实，先考虑可撤销。","房子看登记，动产看交付；先识别例外。"],"answer":0,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：四格分析：行为、损害、因果、归责。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-038-1","subject":"civil","chapter":"侵权","type":"single","stem":"【基础识记】关于“高空抛物与坠物”，哪一项是对应的核心知识？","options":["婚姻关系存续期间取得的法定共同财产一般归夫妻共同所有；依法属于个人财产的除外。","通常结合侵权行为、损害、因果关系、过错判断，但存在无过错责任和过错推定等特别规则。","重大误解、欺诈、胁迫等法定事由可能产生撤销权，须按构成要件识别。","民法典对高空抛物、建筑物等设施脱落坠落分别规定责任和调查义务。"],"answer":3,"explain":"民法典对高空抛物、建筑物等设施脱落坠落分别规定责任和调查义务。（知识卡：高空抛物与坠物；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-038-2","subject":"civil","chapter":"侵权","type":"single","stem":"【易错点】复习“高空抛物与坠物”时，哪一个提醒最直接对应这一考点？","options":["欺诈不当然等于行为无效。","不能把所有住户都直接视作侵权人。","不要给所有侵权类型硬套过错责任。","婚前个人财产不当然因结婚变共同财产。"],"answer":1,"explain":"本考点的常见误区：不能把所有住户都直接视作侵权人。 结合核心理解：民法典对高空抛物、建筑物等设施脱落坠落分别规定责任和调查义务。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-038-3","subject":"civil","chapter":"侵权","type":"single","stem":"【知识配对】下列关于“高空抛物与坠物”的通俗记忆提示，哪项配对正确？","options":["记住：意思不真实，先考虑可撤销。","抛物先找行为人，坠物还要看管理维护责任。","四格分析：行为、损害、因果、归责。","先定婚内时间，再看财产性质与约定。"],"answer":1,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：抛物先找行为人，坠物还要看管理维护责任。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-039-1","subject":"civil","chapter":"方法","type":"single","stem":"【基础识记】关于“民法案例请求权基础法”，哪一项是对应的核心知识？","options":["先找谁向谁要什么→找合同/物权/侵权依据→查要件→查抗辩→下结论。","不动产物权变动通常以依法登记为生效要件；动产物权设立转让通常以交付为生效要件，法律另有规定除外。","抵押通常不转移占有；动产质权一般以交付设立。","无效行为自始不发生预期效力；可撤销行为在被依法撤销前有相应效力。"],"answer":0,"explain":"先找谁向谁要什么→找合同/物权/侵权依据→查要件→查抗辩→下结论。（知识卡：民法案例请求权基础法；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-039-2","subject":"civil","chapter":"方法","type":"single","stem":"【易错点】复习“民法案例请求权基础法”时，哪一个提醒最直接对应这一考点？","options":["权利质押和特殊抵押需单独学习。","合同有效不等于物权已变动。","撤销权行使期限不能当普通诉讼时效。","只描述案情而不指明请求权基础是高频失分点。"],"answer":3,"explain":"本考点的常见误区：只描述案情而不指明请求权基础是高频失分点。 结合核心理解：先找谁向谁要什么→找合同/物权/侵权依据→查要件→查抗辩→下结论。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-039-3","subject":"civil","chapter":"方法","type":"single","stem":"【知识配对】下列关于“民法案例请求权基础法”的通俗记忆提示，哪项配对正确？","options":["无效不用“撤销”才无效，可撤销要依法主张。","“押不交、质要交”是入门记法，但不覆盖全部规则。","房子看登记，动产看交付；先识别例外。","用“谁向谁，凭什么，要什么”开头。"],"answer":3,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：用“谁向谁，凭什么，要什么”开头。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-040-1","subject":"theory","chapter":"法的基础","type":"single","stem":"【基础识记】关于“法的规范性与国家强制性”，哪一项是对应的核心知识？","options":["法是具有规范性、普遍性并由国家强制力保障实施的社会规范。","秩序、自由、平等、正义、人权等价值可能发生冲突，需要依法协调。","关注宪法、法律、行政法规、地方性法规等规范性法律文件的制定主体和效力。","通常从假定条件、行为模式、法律后果认识法律规则。"],"answer":0,"explain":"法是具有规范性、普遍性并由国家强制力保障实施的社会规范。（知识卡：法的规范性与国家强制性；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-040-2","subject":"theory","chapter":"法的基础","type":"single","stem":"【易错点】复习“法的规范性与国家强制性”时，哪一个提醒最直接对应这一考点？","options":["司法判例一般不是我国正式法的渊源。","价值排序不是任何场景都绝对固定。","不能认为每个法律规定都直接附刑罚。","一条法律条文不一定等于一条完整法律规则。"],"answer":2,"explain":"本考点的常见误区：不能认为每个法律规定都直接附刑罚。 结合核心理解：法是具有规范性、普遍性并由国家强制力保障实施的社会规范。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-040-3","subject":"theory","chapter":"法的基础","type":"single","stem":"【知识配对】下列关于“法的规范性与国家强制性”的通俗记忆提示，哪项配对正确？","options":["先列价值，再说冲突，最后讲如何平衡。","出现“如果……应当……否则……”就拆三段。","道德也规范 宪法根本法地位”，哪一项是对应的核心知识？","options":["宪法规定国家根本制度和根本任务，具有最高法律效力，修改程序更加严格。","民族自治地方的自治机关是自治区、自治州、自治县的人民代表大会和人民政府。","受法律保护；因国家安全或追查刑事犯罪需要，由法定机关依照法定程序检查。","国家监察委员会是最高监察机关；监察机关依法独立行使监察权。"],"answer":0,"explain":"宪法规定国家根本制度和根本任务，具有最高法律效力，修改程序更加严格。（知识卡：宪法根本法地位；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-052-2","subject":"constitution","chapter":"基本理论","type":"single","stem":"【易错点】复习“宪法根本法地位”时，哪一个提醒最直接对应这一考点？","options":["不是任何单位都可以随意检查通信。","自治地方的法院、检察院不是自治机关。","“最高效力”与“其他法律无效”不是一回事。","监察委员会不是行政机关或司法审判机关。"],"answer":2,"explain":"本考点的常见误区：“最高效力”与“其他法律无效”不是一回事。 结合核心理解：宪法规定国家根本制度和根本任务，具有最高法律效力，修改程序更加严格。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-052-3","subject":"constitution","chapter":"基本理论","type":"single","stem":"【知识配对】下列关于“宪法根本法地位”的通俗记忆提示，哪项配对正确？","options":["记住自治机关“两家”：人大、政府。","牢记条件、机关、程序三重门槛。","宪法是根本法，不是所有具体生活纠纷的直接细则。","监察、审判、检察职能分开记。"],"answer":2,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：宪法是根本法，不是所有具体生活纠纷的直接细则。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-053-1","subject":"constitution","chapter":"国家制度","type":"single","stem":"【基础识记】关于“人民代表大会制度”，哪一项是对应的核心知识？","options":["国家主席根据全国人大及常委会的决定行使公布法律等职权；国务院是最高国家行政机关。","宪法规定国家根本制度和根本任务，具有最高法律效力，修改程序更加严格。","修改宪法、监督宪法实施、制定修改基本法律、选举决定国家机构人员等属于其重要职权。","人民代表大会制度是我国根本政治制度；国家一切权力属于人民。"],"answer":3,"explain":"人民代表大会制度是我国根本政治制度；国家一切权力属于人民。（知识卡：人民代表大会制度；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-053-2","subject":"constitution","chapter":"国家制度","type":"single","stem":"【易错点】复习“人民代表大会制度”时，哪一个提醒最直接对应这一考点？","options":["人民、人大、人大常委会各自地位不同。","国家主席不能脱离法定决定程序任意公布法律。","全国人大与全国人大常委会职权有区分。","“最高效力”与“其他法律无效”不是一回事。"],"answer":0,"explain":"本考点的常见误区：人民、人大、人大常委会各自地位不同。 结合核心理解：人民代表大会制度是我国根本政治制度；国家一切权力属于人民。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-053-3","subject":"constitution","chapter":"国家制度","type":"single","stem":"【知识配对】下列关于“人民代表大会制度”的通俗记忆提示，哪项配对正确？","options":["遇到国家机构题：把决定者和执行者分开。","宪法是根本法，不是所有具体生活纠纷的直接细则。","“谁决定”和“谁公布”不一样。","人民行使国家权力的机关是全国人大和地方各级人大。"],"answer":3,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：人民行使国家权力的机关是全国人大和地方各级人大。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-054-1","subject":"constitution","chapter":"国家制度","type":"single","stem":"【基础识记】关于“民族区域自治”，哪一项是对应的核心知识？","options":["建立表格对比：产生方式、性质、组成、任期、核心职权、监督关系。","民族自治地方的自治机关是自治区、自治州、自治县的人民代表大会和人民政府。","国家主席根据全国人大及常委会的决定行使公布法律等职权；国务院是最高国家行政机关。","宪法规定国家根本制度和根本任务，具有最高法律效力，修改程序更加严格。"],"answer":1,"explain":"民族自治地方的自治机关是自治区、自治州、自治县的人民代表大会和人民政府。（知识卡：民族区域自治；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-054-2","subject":"constitution","chapter":"国家制度","type":"single","stem":"【易错点】复习“民族区域自治”时，哪一个提醒最直接对应这一考点？","options":["国家主席不能脱离法定决定程序任意公布法律。","不要脱离现行宪法条文记忆任期和权限。","“最高效力”与“其他法律无效”不是一回事。","自治地方的法院、检察院不是自治机关。"],"answer":3,"explain":"本考点的常见误区：自治地方的法院、检察院不是自治机关。 结合核心理解：民族自治地方的自治机关是自治区、自治州、自治县的人民代表大会和人民政府。","difficulty":1,"source":"原创基础识记","tier":"辨析卡"},{"id":"kb-054-3","subject":"constitution","chapter":"国家制度","type":"single","stem":"【知识配对】下列关于“民族区域自治”的通俗记忆提示，哪项配对正确？","options":["宪法是根本法，不是所有具体生活纠纷的直接细则。","一题查两个相近机关，比孤立背职权快。","记住自治机关“两家”：人大、政府。","“谁决定”和“谁公布”不一样。"],"answer":2,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：记住自治机关“两家”：人大、政府。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"kb-055-1","subject":"constitution","chapter":"公民权利","type":"single","stem":"【基础识记】关于“基本权利体系”，哪一项是对应的核心知识？","options":["平等权、政治权利自由、人身自由、宗教信仰自由、社会经济文化权利等受宪法保护。","修改宪法、监督宪法实施、制定修改基本法律、选举决定国家机构人员等属于其重要职权。","宪法规定国家根本制度和根本任务，具有最高法律效力，修改程序更加严格。","国家主席根据全国人大及常委会的决定行使公布法律等职权；国务院是最高国家行政机关。"],"answer":0,"explain":"平等权、政治权利自由、人身自由、宗教信仰自由、社会经济文化权利等受宪法保护。（知识卡：基本权利体系；用于术语识别，不能代替案例论证。）","difficulty":1,"source":"原创基础识记","tier":"识记卡"},{"id":"kb-055-2","subject":"constitution","chapter":"公民权利","type":"single","stem":"【易错点】复习“基本权利体系”时，哪一个提醒最直接对应这一考点？","options":["“最高效力”与“其他法律无效”不是一回事。","国家主席不能脱离法定决定程序任意公布法律。","公民行使权利仍须依法履行义务。","全国人大与全国人大常委会职权有区分。"],"answer":2,"explain":"本考点的常见误区：公民行使权利仍须依法履行义务。 结合核心理解：平等权、政治权利自由、人身自由、宗教信仰自由、社会经济文化权利等受宪法保护。 ource":"原创基础识记","tier":"辨析卡"},{"id":"kb-097-3","subject":"english","chapter":"方法","type":"single","stem":"【知识配对】下列关于“英语错题复盘”的通俗记忆提示，哪项配对正确？","options":["先找到先行词，再找从句缺什么成分。","做一篇精读透，比刷十篇不复盘更值。","先找主句谓语，再看动词形式充当什么成分。","目的句→细节→期待/感谢。"],"answer":1,"explain":"本题检查“知识点—记忆提示”是否匹配。正确提示：做一篇精读透，比刷十篇不复盘更值。；正式答题需还原为准确术语。","difficulty":1,"source":"原创基础识记","tier":"配对卡"},{"id":"case-001","subject":"criminal","chapter":"总论","type":"single","stem":"【情境/考点】甲已经预见到可能撞伤行人，却自信凭驾驶技术可以避开，最终撞伤行人。就心理态度优先判断什么？","options":["过于自信的过失","直接故意","间接故意","疏忽大意的过失"],"answer":0,"explain":"预见危害结果而轻信能够避免，符合过于自信过失的识别方向。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-002","subject":"criminal","chapter":"总论","type":"single","stem":"【情境/考点】甲没有意识到施工现场可能砸伤路人，但依岗位职责本应预见且有能力预见。应优先讨论？","options":["法律认识错误","间接故意","直接故意","疏忽大意的过失"],"answer":3,"explain":"应预见而未预见是疏忽大意过失的核心。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-003","subject":"criminal","chapter":"总论","type":"single","stem":"【情境/考点】甲持刀逼迫乙交出手机，乙因恐惧当场交付。就取财手段优先考虑？","options":["侵占罪","诈骗罪","抢劫罪","普通盗窃罪"],"answer":2,"explain":"当场以暴力、胁迫强行取得财物，优先审查抢劫罪构成。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-004","subject":"criminal","chapter":"总论","type":"single","stem":"【情境/考点】甲准备工具尚未动手实施，因被警方发现而停止。按阶段优先识别？","options":["犯罪预备","犯罪中止","犯罪既遂","犯罪未遂"],"answer":0,"explain":"尚未着手，准备工具制造条件，一般在预备阶段分析。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-005","subject":"criminal","chapter":"总论","type":"single","stem":"【情境/考点】甲已着手实施犯罪，因门锁太牢无法进入而未得逞。一般属于？","options":["犯罪预备","犯罪未遂","犯罪既遂","犯罪中止"],"answer":1,"explain":"已着手且意志以外原因未得逞是未遂基本判断。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-006","subject":"criminal","chapter":"总论","type":"single","stem":"【情境/考点】甲已着手伤害乙，主动放下武器且停止实施，未造成预定结果。优先考虑？","options":["犯罪未遂","犯罪中止","犯罪既遂","共同犯罪"],"answer":1,"explain":"自动放弃犯罪可能构成中止，仍需结合犯罪阶段及法定条件。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-007","subject":"criminal","chapter":"总论","type":"single","stem":"【情境/考点】甲为了阻止乙正在实施的持刀抢劫而反击乙。首先考虑哪类违法阻却事由？","options":["紧急避险","自首","正当防卫","立功"],"answer":2,"explain":"针对正在进行的不法侵害实施制止行为，先从正当防卫判断。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-008","subject":"criminal","chapter":"总论","type":"single","stem":"【情境/考点】为躲避正在逼近的洪水，甲不得已损坏无人居住房屋逃生。首先考虑？","options":["数罪并罚","紧急避险","正当防卫","自首"],"answer":1,"explain":"危险不是不法侵害人实施，损及第三方财产，应优先分析避险构成及限度。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-009","subject":"criminal","chapter":"总论","type":"single","stem":"【情境/考点】甲与乙事先商量共同盗窃并分工实施。关于共同犯罪最关键的主观条件是？","options":["共同疏忽","相同年龄","相同户籍","共同故意"],"answer":3,"explain":"成立共同犯罪一般需二人以上共同故意犯罪。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-010","subject":"criminal","chapter":"总论","type":"single","stem":"【情境/考点】甲的行为造成损失，但不能确定甲是否存在相应故意或过失。认定犯罪时应当？","options":["继续分别审查主观要件和其他构成要件","仅分析被害人情绪","只凭损失结果定罪","只凭舆论定罪"],"answer":0,"explain":"客观结果存在不等于犯罪全部构成要件满足。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-011","subject":"criminal","chapter":"总论","type":"single","stem":"【情境/考点】甲犯罪后自动向公安机关投案并如实供述自己的罪行，应优先审查？","options":["累犯","一般自首","犯罪未遂","重大立功"],"answer":1,"explain":"一般自首的典型条件是自动投案、如实供述自己的罪行。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-012","subject":"criminal","chapter":"总论","type":"single","stem":"【情境/考点】甲被抓获后提供他人重大犯罪线索，经查证属实，优先审查？","options":["一般自首","立功","正当防卫","犯罪中止"],"answer":1,"explain":"提供他人犯罪线索属于立功相关方向，不等于自动投案。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-013","subject":"criminal","chapter":"分则","type":"single","stem":"【情境/考点】甲冒充客服骗乙将款项转账，乙因错误认识主动转账。优先分析？","options":["诈骗罪","侵占罪","抢夺罪","盗窃罪"],"answer":0,"explain":"存在欺骗、错误认识和财产处分链条，先考虑诈骗。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-014","subject":"criminal","chapter":"分则","type":"single","stem":"【情境/考点】甲在乙不知情时从其口袋抽走手机。优先分析？","options":["受贿罪","盗窃罪","贪污罪","诈骗罪"],"answer":1,"explain":"没有经被害人基于错误认识处分财产的环节，先考虑盗窃。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-015","subject":"criminal","chapter":"分则","type":"single","stem":"【情境/考点】甲利用自己负责保管本单位库存货物的职务便利据为己有，优先检查什么？","options":["危险驾驶罪的醉酒程度","受贿罪的请托关系","职务侵占罪的主体、对象和职务便利","交通肇事罪的道路条件"],"answer":2,"explain":"需分析公司企业等单位工作人员、单位财物和职务便利等构成条件。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-016","subject":"criminal","chapter":"分则","type":"single","stem":"【情境/考点】判断杀人故意还是伤害故意，最不能采取的方法是？","options":["分析行为人言语","仅以死亡结果反推一定存在杀人故意","分析行为前后表现","分析打击部位"],"answer":1,"explain":"主观故意须结合多项客观情节判断，不能单凭结果归罪。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-017","subject":"criminal","chapter":"分则","type":"single","stem":"【情境/考点】醉酒驾驶机动车却未造成人员伤亡，刑法评价时应首先想到？","options":["必然构成抢劫罪","危险驾驶罪及相关入罪规范","必然构成交通肇事罪","必然不构成犯罪"],"answer":1,"explain":"危险驾驶与交通肇事的行为和结果要求不同，具体须依现行规范判断。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-018","subject":"criminal","chapter":"分则","type":"single","stem":"【情境/考点】国家工作人员利用职务便利向请托人索取钱款，优先讨论？","options":["盗窃罪","侵占罪","受贿罪","诈骗罪"],"answer":2,"explain":"国家工作人员利用职务便利索取财物，优先审查受贿罪法定构成。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-019","subject":"criminal","chapter":"方法","type":"single","stem":"【情境/考点】刑法案例答案只写“甲构成诈骗罪”，最大缺陷是什么？","options":["未写法条页码","缺少案件天气","未写甲的生日","缺乏构成要件与事实对应论证"],"answer":3,"explain":"结论必须由事实、法定要件和理由支持。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-020","subject":"criminal","chapter":"总论","type":"single","stem":"【情境/考点】甲原先有义务看护幼儿且有救助能力，却故意不履行而造成严重后果。分析不作为犯罪首先检验？","options":["双方是否同乡","甲是否喜欢运动","行为人是否住高楼","作为义务来源与履行可能性"],"answer":3,"explain":"不作为犯不能忽略具体作为义务与现实履行可能性。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-021","subject":"civil","chapter":"总则","type":"single","stem":"【情境/考点】甲误以为乙是房东，向乙签约，实际情况足以使其产生重大误解。救济路径先考虑？","options":["重大误解的撤销规则","一律认定合同自始无效","直接认定房屋所有权已转移","刑法立功制度"],"answer":0,"explain":"重大误解可能形成撤销事由，需依法考察撤销条件。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-022","subject":"civil","chapter":"总则","type":"single","stem":"【情境/考点】甲受乙欺诈订立合同，其法律效果应当优先判断？","options":["合同当然无效且无需分析","是否符合可撤销民事法律行为要件","已经自动完成所有权转移","必然成立犯罪"],"answer":1,"explain":"欺诈可能使意思表示可撤销，但不应机械宣告当然无效。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-023","subject":"civil","chapter":"总则","type":"single","stem":"【情境/考点】甲没有真实代理权，但乙因甲持有公司授权外观而合理相信。优先讨论？","options":["无因管理","地役权","法定继承","表见代理"],"answer":3,"explain":"权利外观和相对人合理信赖是表见代理的判断重点。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-024","subject":"civil","chapter":"总则","type":"single","stem":"【情境/考点】乙已过通常诉讼时效起诉，债权债务关系本身是否当然消灭？","options":["自动转为所有权","不当然消灭","自动变成刑事案件","自动消灭"],"answer":1,"explain":"诉讼时效与实体债权消灭不同，仍应注意时效抗辩等细则。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-025","subject":"civil","chapter":"物权","type":"single","stem":"【情境/考点】甲乙已签订房屋买卖合同但未办理登记。关于房屋所有权应当？","options":["签字后无需任何登记规则","分别分析合同效力与不动产物权变动","合同签订所有权一定转移","支付部分定金即完成过户"],"answer":1,"explain":"合同债权与物权变动规则具有区分。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-026","subject":"civil","chapter":"物权","type":"single","stem":"【情境/考点】甲把自己的手表出售并交付给乙，通常哪一行为对动产所有权转移关键？","options":["居民身份证","电话通知物业","公证书","交付"],"answer":3,"explain":"普通动产所有权转让通常交付发生效力，特殊法定情形除外。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-027","subject":"civil","chapter":"物权","type":"single","stem":"【情境/考点】甲将财物交付质权人用于担保债务，通常涉及？","options":["债权免除","不动产抵押必需交付","动产质权","法定继承"],"answer":2,"explain":"动产质权设立通常与交付相联系。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-028","subject":"civil","chapter":"物权","type":"single","stem":"【情境/考点】甲未经所有权人授权出售他人物品，乙善意并支付合理价格且完成交付。审查乙是否得权，应优先考虑？","options":["侵权行为一律无效","自动取得国家赔偿","善意取得制度及其例外","合同必须认定刑事犯罪"],"answer":2,"explain":"须综合善意、价格、交付以及财产性质等法律条件。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-029","subject":"civil","chapter":"合同","type":"single","stem":"【情境/考点】甲向乙发出含明确内容且表示受约束意图的交易建议。法律上首先考虑？","options":["违约金","要约","代位继承","要约邀请必然"],"answer":1,"explain":"要约需有具体确定内容和受约束意图。","difficulty":2,"source":"原创情境题","tier":"应用与辨析"},{"id":"case-030","subject":"civil","chapter":"合同","type":"single","stem":"【情境/考点】乙对甲发来的要约作出实质性变更并回复。通常可以视为？","opt iple","stem":"【多项选择】关于英语阅读细节题，下列哪两项有助于提高准确率？","options":["不看文章依赖常识","回原文定位信息","只选最长选项","核对限定词与态度词"],"answer":[1,3],"explain":"细节题以证据和词义范围为核心。","difficulty":2,"source":"原创多项选择","tier":"多选"},{"id":"multi-046","subject":"english","chapter":"阅读","type":"multiple","stem":"【多项选择】下列哪两项属于典型阅读干扰方式？","options":["将some偷换为all","将may改为must","保留原文条件不变","对同义表达进行准确转换"],"answer":[0,1],"explain":"绝对化与强度变化是常见干扰项。","difficulty":2,"source":"原创多项选择","tier":"多选"},{"id":"multi-047","subject":"english","chapter":"阅读","type":"multiple","stem":"【多项选择】面对阅读推断题，下列哪两项合理？","options":["注意作者语气和论证范围","推断必须能被文本支持","越超出原文越好","遇到不懂词就全部放弃"],"answer":[0,1],"explain":"推断不等于自由联想，须有文本依据。","difficulty":2,"source":"原创多项选择","tier":"多选"},{"id":"multi-048","subject":"english","chapter":"语法","type":"multiple","stem":"【多项选择】关于句子结构，下列哪两项正确？","options":["that能引导所有非限制性定语从句","although可引导让步从句","非谓语动词必然是句子主谓核心","which可引导定语从句"],"answer":[1,3],"explain":"从句引导词和主干谓语需要分清。","difficulty":2,"source":"原创多项选择","tier":"多选"},{"id":"multi-049","subject":"english","chapter":"翻译","type":"multiple","stem":"【多项选择】翻译复杂长句，下列哪两项合理？","options":["优先找主干","忽略句中否定词","分析从句与修饰成分","机械逐词按顺序硬译"],"answer":[0,2],"explain":"翻译应在准确理解结构后调整汉语语序。","difficulty":2,"source":"原创多项选择","tier":"多选"},{"id":"multi-050","subject":"english","chapter":"写作","type":"multiple","stem":"【多项选择】英语应用文写作，下列哪两项合理？","options":["长难词越多越好","不必回应题目要求","建议使用具体、自然的表达","明确写作对象与沟通任务"],"answer":[2,3],"explain":"任务完成和语言准确比生硬炫技更重要。","difficulty":2,"source":"原创多项选择","tier":"多选"},{"id":"multi-051","subject":"english","chapter":"词汇","type":"multiple","stem":"【多项选择】以下哪两项为合理的词义对应？","options":["legislation—施工","evidence—证据","interpret—解释","valid—无效的"],"answer":[1,2],"explain":"词义需在具体语境中理解，法律和学术词汇可构词联想。","difficulty":2,"source":"原创多项选择","tier":"多选"}]);d.writing.push(...[{"id":"wb1","subject":"criminal","chapter":"主观训练","type":"written","stem":"简答：故意与过失四种心理态度","prompt":"分别定义直接故意、间接故意、疏忽大意过失和过于自信过失。","guide":"定义四类型→比较意志因素→各举一例。","answer":"希望=直接故意；放任=间接故意；应预见而未预见=疏忽大意过失；已预见但轻信避免=过于自信过失。","source":"原创主观题"},{"id":"wb2","subject":"criminal","chapter":"主观训练","type":"written","stem":"案例：误以为有人入室抢劫而反击","prompt":"甲在深夜误认为乙正在持刀抢劫而反击，事后发现乙并无不法侵害。讨论判断路径。","guide":"先核实是否存在现实不法侵害，再讨论主观认识错误与可能承担的责任。","answer":"真实正当防卫与假想防卫区分，不能只因主观以为受侵害就认定正当防卫。","source":"原创主观题"},{"id":"wb3","subject":"criminal","chapter":"主观训练","type":"written","stem":"案例：欺骗转账与直接盗取","prompt":"比较被害人基于谎言主动转账与行为人秘密盗取密码转账的不同。","guide":"分列欺骗、错误认识、处分、转移财物的环节，逐项对应。","answer":"诈骗需要围绕错误处分链条；秘密取得而无处分的情形优先与盗窃比较。","source":"原创主观题"},{"id":"wb4","subject":"criminal","chapter":"主观训练","type":"written","stem":"论述：共同犯罪人的作用分工","prompt":"共同犯罪中组织者、主要实行者与辅助参与者如何分析？","guide":"先判断共同故意和共同行为，再考察共同犯罪中所起的作用及法定类型。","answer":"共同犯罪人的身份不等于作用，分别分析主犯、从犯等分类及责任。","source":"原创主观题"},{"id":"wb5","subject":"criminal","chapter":"主观训练","type":"written","stem":"案例：防卫与避险的对象","prompt":"分别处理抢劫者侵害与突发山火危及生命的情况。","guide":"分别写危险来源→行为对象→必要性→限度→结论。","answer":"防卫通常针对正在实施不法侵害的人；避险是对正在发生的危险作不得已的利益协调。","source":"原创主观题"},{"id":"wb6","subject":"criminal","chapter":"主观训练","type":"written","stem":"简答：刑法的从旧兼从轻","prompt":"说出时间效力的原则及思考顺序。","guide":"行为时点→新旧法律→是否有利于行为人→结论并提示例外。","answer":"新法是否不认为犯罪或量刑更轻，是从旧兼从轻原则比较的关键。","source":"原创主观题"},{"id":"wb7","subject":"civil","chapter":"主观训练","type":"written","stem":"案例：房屋买卖已付钱未登记","prompt":"甲付款并拿到钥匙但尚未办理所有权转移登记，能否直接主张取得不动产所有权？","guide":"分离合同效力、合同履行和物权变动；必要时分析例外。","answer":"有效买卖合同不必然已经转移所有权；不动产物权变动通常依法登记生效。","source":"原创主观题"},{"id":"wb8","subject":"civil","chapter":"主观训练","type":"written","stem":"案例：定金与订金条款","prompt":"甲乙发生违约争议，合同中约定有预付款及违约金。","guide":"判断款项性质→是否构成定金→违约责任→选择规则。","answer":"订金不能直接当作定金；同时约定定金和违约金时，适用应考虑法定选择规则。","source":"原创主观题"},{"id":"wb9","subject":"civil","chapter":"主观训练","type":"written","stem":"案例：第三人无权处分","prompt":"卖家未经所有人同意出售他人手表，买家不知情且已合理付款、受领。","guide":"依次检查无权处分、善意、合理价格、交付和特殊限制。","answer":"符合要件可能善意取得；还应讨论原权利人向无权处分人的救济。","source":"原创主观题"},{"id":"wb10","subject":"civil","chapter":"主观训练","type":"written","stem":"简答：民事法律行为无效与可撤销","prompt":"比较主要适用条件、法律效果及救济路径。","guide":"无效→可撤销→效力状态→撤销权行使→法律后果。","answer":"无效与可撤销不能只凭“当事人反悔”区分。","source":"原创主观题"},{"id":"wb11","subject":"civil","chapter":"主观训练","type":"written","stem":"案例：个人信息过度收集","prompt":"某App为提供基础服务要求授权全部相册、通讯录和定位。","guide":"界定数据处理目的→审查必要性→同意与法定义务→可能救济。","answer":"个人信息处理须合法正当必要，不能把一次点击同意当作无限授权。","source":"原创主观题"},{"id":"wb12","subject":"civil","chapter":"主观训练","type":"written","stem":"案例：高空坠物责任","prompt":"外墙构件掉落致人受伤，业主与物业互相推责。","guide":"先查坠落物→管理维护职责→归责规则→证据→责任结论。","answer":"坠物与人为高空抛物制度不同，不能当然推定所有楼内住户平均赔偿。","source":"原创主观题"},{"id":"wb13","subject":"theory","chapter":"主观训练","type":"written","stem":"论述：法与道德关系","prompt":"法与道德在规范来源、实施方式、调整范围上有什么联系与区别？","guide":"分别写联系、区别、协调与冲突，最后举例。","answer":"法律由国家强制力保障，道德还通过社会评价等发挥作用，二者互相影响。","source":"原创主观题"},{"id":"wb14","subject":"theory","chapter":"主观训练","type":"written","stem":"案例：规范冲突怎样处理","prompt":"某项旧特别规定与新一般规定发生冲突。","guide":"先核查制定机关与位阶→特别与一般、新与旧→是否需法定机关裁决。","answer":"不能只套“新法优于旧法”或“特别法优于一般法”一句话。","source":"原创主观题"},{"id":"wb15","subject":"theory","chapter":"主观训练","type":"written","stem":"论述：法律规则与法律原则","prompt":"比较确定性、适用方式及司法裁判中的功能。","guide":"先定义→规则与原则的适用差别→说明价值衡量与法律论证。","answer":"规则与原则都具有规范意义，但不能随意用抽象原则代替现行具体规范。","source":"原创主观题"},{"id":"wb16","subject":"theory","chapter":"主观训练","type":"written","stem":"简答：法律事实和法律关系","prompt":"说明主体、内容、客体与法律事实的区别。","guide":"法律关系三要素→法律事实引起变动→举合同实例。","answer":"法律事实是变动原因，不应与主体内容客体简单混成“四要素”。","source":"原创主观题"},{"id":"wb17","subject":"theory","chapter":"主观训练","type":"written","stem":"论述：法治对公权力的要求","prompt":"结合依法行政和司法公正说明法治的内涵。","guide":"法律制度→依法行权→正当程序→权利保障→责任监督。","answer":"有法可依是基础，法治还要求公权力受规范约束。","source":"原创主观题"},{"id":"wb18","subject":"constitution","chapter":"主观训练","type":"written","stem":"简答：宪法的根本法地位","prompt":"从规定内容、法律效力、修改程序等方面归纳。","guide":"根本任务制度→最高效力→修改程序→举例。","answer":"宪法效力最高不代表所有普通法律具体条文自动无效。","source":"原创主观题"},{"id":"wb19","subject":"constitution","chapter":"主观训练","type":"written","stem":"比较：全国人大与全国人大常委会","prompt":"写出两机关的代表职权并指出容易混淆处。","guide":"机关性质与关系→修改宪法→解释宪法→法律制定职权。","answer":"修改宪法是全国人大职权；解释宪法是全国人大常委会职权。","source":"原创主观题"},{"id":"wb20","subject":"constitution","chapter":"主观训练","type":"written","stem":"案例：通信秘密保护","prompt":"某单位未经法定授权要求查看员工全部通信内容。","guide":"列基本权利→解释法定例外条件→审查主体程序。","answer":"通信自由与通信秘密受保护；例外检查须依法满足目的、主体及程序。","source":"原创主观题"},{"id":"wb21","subject":"constitution","chapter":"主观训练","type":"written","stem":"简答：民族区域自治制度","prompt":"说出自治地方层级、自治机关和不属于自治机关的机构。","guide":"自治区自治州自治县→对应人大和政府→法院检察院排除。","answer":"民族自治地方的自治机关为相应人大、人民政府。","source":"原创主观题"},{"id":"wb22","subject":"history","chapter":"主观训练","type":"written","stem":"法制史时间轴：战国到唐","prompt":"串联《法经》、汉代春秋决狱、唐律疏议。","guide":"各站按朝代—代表制度—主要特征写出。","answer":"法经—李悝—战国；春秋决狱—汉代；唐律疏议—唐代。","source":"原创主观题"},{"id":"wb23","subject":"history","chapter":"主观训练","type":"written","stem":"法制史时间轴：宋至民国","prompt":"串联《宋刑统》《大明律》《大清律例》《大清新刑律》《临时约法》。","guide":"宋、明、清、清末、1912五站分别归纳性质。","answer":"不要混淆清代传统律例与清末近代修律，亦不可混淆临时约法与其他约法。","source":"原创主观题"},{"id":"wb24","subject":"history","chapter":"主观训练","type":"written","stem":"简答：礼法结合的制度演进","prompt":"从西周、汉代、唐代三个节点概括。","guide":"礼治秩序→春秋决狱→唐律礼法融合。","answer":"从礼与刑关系到司法儒家化再到成熟传统法典，要看到演变。","source":"原创主观题"},{"id":"wb25","subject":"history","chapter":"主观训练","type":"written","stem":"比较：唐律疏议与宋刑统","prompt":"说明两部法典的朝代、体例特点与传承关系。","guide":"时间→律文注疏→刑统编排→后世影响。","answer":"唐律疏议与宋刑统不属于同一朝代，宋刑统承袭唐律传统。","source":"原创主观题"},{"id":"wb26","subject":"politics","chapter":"主观训练","type":"written","stem":"材料分析：社会实践促进认识","prompt":"某地政策先小规模试点，再根据数据调整。","guide":"写实践的来源、动力、目的、检验功能，并对应材料。","answer":"避免只背四个词；每一原理至少结合材料一句。","source":"原创主观题"},{"id":"wb27","subject":"politics","chapter":"主观训练","type":"written","stem":"材料分析：科技积累与转型","prompt":"企业长期研发后取得关键突破并开始新一轮创新。","guide":"写量变、质变、辩证联系与具体政策或行动。","answer":"注意新质基础上的新量变，不把质变理解为永久完成。","source":"原创主观题"},{"id":"wb28","subject":"politics","chapter":"主观训练","type":"written","stem":"材料分析：因地制宜","prompt":"某地直接照搬外地方案导致成效有限。","guide":"围绕矛盾普遍性与特殊性、具体问题具体分析说明。","answer":"共性方法需要通过具体条件发挥作用，不能忽视差异。","source":"原创主观题"},{"id":"wb29","subject":"politics","chapter":"主观训练","type":"written","stem":"政治大题：如何防止空话","prompt":"给定材料提取三个关键词，用对应理论组织三段式回答。","guide":"材料词→理论概念→一一解释→总结观点。","answer":"理论原理与材料不匹配的套话一般价值有限。","source":"原创主观题"},{"id":"wb30","subject":"english","chapter":"主观训练","type":"written","stem":"英语翻译：非限制性定语从句","prompt":"Translate: The policy, which was revised last year, has received mixed responses.","guide":"先找主句，再翻译插入语与时间。","answer":"该政策在去年进行了修订，并收到了褒贬不一的反响。","source":"原创主观题"},{"id":"wb31","subject":"english","chapter":"主观训练","type":"written","stem":"英语阅读：作者态度","prompt":"Given a passage with cautious language (may, suggests), explain why \"certainly\" can be a wrong option.","guide":"对应原文的可能性与选项的绝对化；给出证据词。","answer":"原文“可能/表明”不等同于“一定”；阅读选择题不能随意提升结论强度。","source":"原创主观题"},{"id":"wb32","subject":"english","chapter":"主观训练","type":"written","stem":"英语写作：建议信","prompt":"Write about 100 words to suggest two actionable methods for exam preparation.","guide":"称呼→写信目的→两条具体建议→礼貌收尾。","answer":"Dear Alex, I am writing to offer two suggestions. First, set small daily goals that you can complete. Second, keep a notebook of errors and review it every few days. These habits can make your preparation more manageable and effective. I hope you find them useful. Best regards, Li Ming.","source":"原创主观题"},{"id":"wb33","subject":"english","chapter":"主观训练","type":"written","stem":"英语写作：图表变化","prompt":"Write a short paragraph describing a chart showing steady growth and discuss one possible reason.","guide":"描述趋势→给出依据→分析原因→一句总结。","answer":"The chart illustrates steady growth over the period. One possible explanation is the wider access to online services. While the data suggest a clear upward trend, the reasons should be examined with additional evidence.","source":"原创主观题"}]);d.version=4;})();

</script><script>
(() => {
'use strict';
const D = window.LAW_DATA;
const KEY = 'law-master-035102-state-v3';
const DEFAULT = {settings:{dailyMinutes:150,goal:355,examDate:D.examDate},checks:{},records:{},review:{},saved:[],attempts:{},wrong:[],customQuestions:[],drafts:{},writingDone:[],vocabKnown:[],daily:{},customTasks:[],quizSession:null,createdAt:new Date().toISOString()};
let state=load();
let page='home', learnTab='notes',learnSubject='all',searchTerm='',expandedNote='',vocabIndex=0,vocabFlipped=false;
let quizMode='random',quizSubject='all',quizChapter='all',quizType='all',quizStatus='all',quizDifficulty='all',quizCount='15',practiceTab='objective',finishedResult=null;
const app=document.getElementById('app');
const allQuestions=()=>[...D.questions,...(state.customQuestions||[])];
const chapterOf=q=>q.chapter||'基础综合';
const answerText=q=>(Array.isArray(q.answer)?q.answer:[q.answer]).map(i=>'ABCD'[i]).join('、');
const isCorrect=(q,reply)=>q&&reply!==undefined&&(Array.isArray(q.answer)?Array.isArray(reply)&&q.answer.length===reply.length&&q.answer.every((v,i)=>v===[...reply].sort((a,b)=>a-b)[i]):q.answer===reply);
const byChapter=(sid)=>[...new Set(allQuestions().filter(q=>sid==='all'||q.subject===sid).map(chapterOf))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object'&&s.settings){return {...structuredClone(DEFAULT),...s,settings:{...DEFAULT.settings,...s.settings}}}}catch(e){console.warn('保存记录读取失败',e)}return structuredClone(DEFAULT)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('浏览器存储受限，请及时导出学习记录')}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const pad=n=>String(n).padStart(2,'0');
function localISO(date=new Date()){return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`}
function dayDate(s){return new Date(`${s}T00:00:00`)}
function shiftDate(iso,n){const d=dayDate(iso);d.setDate(d.getDate()+n);return localISO(d)}
function daysLeft(){return Math.max(0,Math.ceil((dayDate(state.settings.examDate)-dayDate(localISO()))/86400000))}
function subject(id){return D.subjects.find(s=>s.id===id) || D.subjects[0]}
function smap(){const r={};D.subjects.forEach(s=>r[s.id]=D.notes.filter(x=>x.subject===s.id).length);return r}
function subBadge(id){const s=subject(id);return `<span class="pill" style="background:${s.color}18;color:${s.color}">${esc(s.name)}</span>`}
function showText(text){return esc(text).replace(/\n/g,'<br>')}
function toast(msg){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)}
function nav(to){page=to;searchTerm='';expandedNote='';render();window.scrollTo({top:0,behavior:'instant'})}
