let chapters=byChapter(quizSubject);
let filters=`<div class="settings-grid">
${select('选择科目','quiz-subject',[['all','全部科目'],...D.subjects.map(s=>[s.id,s.name])],quizSubject)}
${select('选择章节','quiz-chapter',[['all','全部章节'],...chapters.map(x=>[x,x])],quizChapter)}
${select('题目类型','quiz-type',[['all','单选＋多选'],['single','仅单选'],['multiple','仅多选']],quizType)}
${select('掌握状态','quiz-status',[['all','所有题目'],['new','只练未做过'],['wrong','只练错题']],quizStatus)}
${select('题目难度','quiz-difficulty',[['all','全部难度'],['1','基础识记'],['2','理解与应用']],quizDifficulty)}
${select('本次题量','quiz-count',[5,10,15,20,30,50,100].map(n=>[String(n),n+' 题']),String(quizCount))}
</div>`;
return `<div class="eyebrow">PRACTICE & REVIEW</div><h1 class="page-title">分层练习，刷完再复盘</h1><p class="subtitle">${singles} 道单选 + ${multiples} 道多选 + ${D.writing.length} 道主观训练。含基础识记、易错辨析、情境应用；均为原创练习，非官方真题。</p>
<div class="tabbar"><button class="${practiceTab==='objective'?'active':''}" data-a="practiceTab" data-id="objective">客观题</button><button class="${practiceTab==='written'?'active':''}" data-a="practiceTab" data-id="written">主观题</button><button class="${practiceTab==='errors'?'active':''}" data-a="practiceTab" data-id="errors">错题 (${state.wrong.length})</button></div>
${practiceTab==='objective'?`<div class="card"><h2 class="section-title">开始一组训练</h2><div class="filterbar">${[['random','随机混合'],['chapter','科目章节'],['wrong','错题重刷'],['exam','限时模拟']].map(([id,name])=>`<button class="chip ${quizMode===id?'active':''}" data-a="quizMode" data-id="${id}">${name}</button>`).join('')}</div>
${filters}<div class="notice" style="margin-top:15px">${quizMode==='exam'?'限时模式每题约75秒；不是正式试卷结构。':quizMode==='wrong'?'优先选择已做错的题，仍可按科目、章节和题型筛选。':'建议按“仅未做过”完成一轮，再用错题本二刷。多选题须全部选对才计正确。'}</div>
<button class="btn block" style="margin-top:16px" data-a="startQuiz">开始训练 →</button><div class="flex-wrap" style="margin-top:12px"><button class="btn sm light flex-1" data-a="addQuestion">＋ 自己添加一道题</button><button class="btn sm light flex-1" data-a="importQuestions">⇧ 导入 JSON 题库</button></div><input id="questions-file" class="hidden" type="file" accept=".json,application/json"/></div>
<div class="section"><div class="section-head"><h2 class="section-title">各科训练统计</h2><span class="pill teal">${c} 道已有记录</span></div><div class="card"><div class="row space"><div><strong>累计客观题正确率</strong><div class="small muted">重复做题计入总次数；多选须全对</div></div><div class="stat-number">${summary().rate}%</div></div><div class="progress" style="margin:14px 0"><span style="width:${summary().rate}%"></span></div>${D.subjects.map(s=>{let ids=list.filter(q=>q.subject===s.id).map(q=>q.id),a=ids.reduce((sum,id)=>sum+(state.attempts[id]?.count||0),0),v=ids.reduce((sum,id)=>sum+(state.attempts[id]?.correct||0),0);return `<div class="slim-row"><span>${esc(s.name)}</span><span class="muted small">${a?Math.round(v/a*100)+'% 正确':'暂无记录'} · ${a} 次</span></div>`}).join('')}</div></div>`:practiceTab==='written'?renderWrittenList():renderErrors()}${footer()}`;
}
function renderWrittenList(){return `<div class="notice">主观题采用自己组织答案＋参考提纲＋自评的方式，系统不自动判分。建议每题先闭卷写至少 3 个得分点。</div><div class="section">${D.writing.map(w=>`<div class="note-card"><div style="padding:15px"><div class="row space">${subBadge(w.subject)}<span class="pill ${state.writingDone.includes(w.id)?'teal':''}">${state.writingDone.includes(w.id)?'已自评':'待训练'}</span></div><div class="note-title" style="margin-top:10px">${esc(w.stem)}</div><p class="small muted" style="line-height:1.8">${esc(w.prompt)}</p><button class="btn sm secondary" data-a="openWriting" data-id="${w.id}">开始作答 →</button></div></div>`).join('')}</div>`}
function renderErrors(){let list=allQuestions().filter(q=>state.wrong.includes(q.id));return `<div class="row space" style="margin-bottom:15px"><span class="small muted">${list.length} 道待消化错题</span><button class="btn sm secondary" data-a="wrongRun" ${!list.length?'disabled':''}>错题重刷 →</button></div>${list.length?list.map(q=>`<div class="note-card" style="padding:16px"><div class="row space">${subBadge(q.subject)}<span class="pill red">${q.type==='multiple'?'多选 · ':'单选 · '}曾答错</span></div><div class="note-title" style="margin:11px 0">${esc(q.stem)}</div><div class="small muted">正确答案：${answerText(q)} · ${(Array.isArray(q.answer)?q.answer:[q.answer]).map(i=>esc(q.options[i])).join('；')}</div><p class="status-hint">${esc(q.explain)}</p><div class="flex-wrap"><button class="btn sm outline" data-a="singleQuiz" data-id="${q.id}">重做本题</button><button class="btn sm light" data-a="removeWrong" data-id="${q.id}">移出错题本</button></div></div>`).join(''):`<div class="empty"><div class="empty-icon">✓</div>还没有错题。先开始刷题，错题会自动收藏在这里。</div>`}`}
function shuffle(list){let a=[...list];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz({mode=quizMode,subjectId=quizSubject,count=Number(quizCount),oneId=null}={}){
let pool=allQuestions().filter(q=>(subjectId==='all'||q.subject===subjectId)&&(!oneId||q.id===oneId));
if(!oneId){
if(quizChapter!=='all')pool=pool.filter(q=>chapterOf(q)===quizChapter);
if(quizType!=='all')pool=pool.filter(q=>q.type===quizType);
if(quizDifficulty!=='all')pool=pool.filter(q=>String(q.difficulty)===quizDifficulty);
const status=mode==='wrong'?'wrong':quizStatus;
if(status==='wrong')pool=pool.filter(q=>state.wrong.includes(q.id));
if(status==='new')pool=pool.filter(q=>!state.attempts[q.id]);
}
if(!pool.length){toast('此筛选条件下没有可练习的题，请调整筛选');return}
let ids=shuffle(pool).slice(0,Math.max(1,Math.min(pool.length,Number(count)||15))).map(q=>q.id);
state.quizSession={ids,index:0,answers:{},choices:{},start:Date.now(),duration:mode==='exam'?ids.length*75:0,mode,subjectId};finishedResult=null;save();page='quiz';render();window.scrollTo(0,0)
}
function quizActive(){
let s=state.quizSession;if(!s)return quizSetup();let q=allQuestions().find(x=>x.id===s.ids[s.index]);if(!q){state.quizSession=null;save();return quizSetup()}
let reply=s.answers[q.id],answered=reply!==undefined,multi=q.type==='multiple',selected=s.choices?.[q.id]||[];
let current=s.index+1,finished=Object.keys(s.answers).length,good=answered&&isCorrect(q,reply);
return `<div class="eyebrow">LIVE PRACTICE</div><div class="row space" style="margin:8px 0 17px"><div><h1 class="page-title" style="margin-bottom:0">正在训练</h1><span class="small muted">${s.mode==='exam'?'限时模拟':'分层训练'} · ${finished}/${s.ids.length} 已答</span></div><button class="btn sm outline" data-a="quitQuiz">结束练习</button></div>
<div class="card quiz-panel"><div class="row space"><span class="pill teal">第 ${current} / ${s.ids.length} 题</span><span class="pill">⏱ <span id="quiz-timer">00:00</span>${s.duration?' / '+Math.ceil(s.duration/60)+'分':''}</span></div><div class="progress" style="margin-top:15px"><span style="width:${current/s.ids.length*100}%"></span></div>
<div class="row" style="margin-top:18px">${subBadge(q.subject)}<span class="pill">${multi?'多选题':'单选题'} · ${esc(chapterOf(q))}</span></div><div class="small muted" style="margin-top:9px">${esc(q.source)} · ${q.difficulty===1?'基础识记':'理解与应用'}</div><div class="quiz-stem">${esc(q.stem)}</div>
<div class="options">${q.options.map((o,i)=>{let isAns=multi?q.answer.includes(i):i===q.answer;let isPicked=multi?Array.isArray(reply)&&reply.includes(i):reply===i;return `<button class="option ${answered&&isAns?'correct':''} ${answered&&isPicked&&!isAns?'wrong':''} ${!answered&&multi&&selected.includes(i)?'selected':''} ${answered?'':'selectable'}" data-a="${multi?'multiToggle':'answer'}" data-id="${i}" ${answered?'disabled':''}><span class="option-letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`}).join('')}</div>
${multi&&!answered?`<div class="small muted" style="margin:12px 0">多选题：可选择多个选项，确认后才能查看答案；错选、少选均计为未全对。</div><button class="btn block secondary" data-a="submitMulti" ${selected.length?'':'disabled'}>确认答案（已选 ${selected.length} 项）</button>`:''}
${answered?`<div class="answer-box ${good?'':'bad'}"><div class="strong">${good?'✓ 答对了':'× 未全对'}　正确答案：${answerText(q)}</div><div>${esc(q.explain)}</div>${!good?`<div style="margin-top:9px"><button class="btn sm outline" data-a="mistakeReason" data-id="${q.id}">记录错因</button></div>`:''}</div>`:!multi?`<div class="small muted" style="margin-top:14px">选择答案立即查看解析，先独立判断。</div>`:''}
<div class="quiz-bar"><button class="btn sm light" data-a="quizPrev" ${s.index===0?'disabled':''}>← 上一题</button><button class="btn sm" data-a="quizNext" ${!answered?'disabled':''}>${s.index===s.ids.length-1?'查看结果':'下一题 →'}</button></div></div><div class="notice" style="margin-top:14px">本题是原创模拟，法律考点以现行法条及官方2027考试大纲为准。</div>`;
}
function recordAnswer(qId,choice){let s=state.quizSession;if(!s||s.answers[qId]!==undefined)return;let q=allQuestions().find(q=>q.id===qId);if(!q)return; if(q.type==='multiple')choice=[...choice].sort((a,b)=>a-b);s.answers[qId]=choice;let a=state.attempts[qId]||{count:0,correct:0};a.count++;let good=isCorrect(q,choice);if(good)a.correct++;else if(!state.wrong.includes(qId))state.wrong.push(qId);a.last=localISO();state.attempts[qId]=a;let d=state.daily[localISO()]||{minutes:0,questions:0,correct:0};d.questions=(d.questions||0)+1;d.correct=(d.correct||0)+(good?1:0);state.daily[localISO()]=d;save();render()}
function showResult(){let s=state.quizSession;if(!s)return;let total=s.ids.length,correct=s.ids.filter(id=>isCorrect(allQuestions().find(q=>q.id===id),s.answers[id])).length,wrong=total-correct,time=Math.floor((Date.now()-s.start)/1000);finishedResult={total,correct,wrong,time};state.quizSession=null;save();render()}
function quizResult(){let r=finishedResult,rate=Math.round(r.correct/r.total*100);return `<div class="eyebrow">PRACTICE COMPLETE</div><h1 class="page-title">完成一轮训练</h1><p class="subtitle">本次 ${r.total} 题；复盘错因比单纯看正确率更重要。</p><div class="card" style="text-align:center;padding:30px 20px"><div class="small muted">本轮正确率（不等于考研得分）</div><div style="font-size:58px;letter-spacing:-2px;font-weight:950;color:var(--teal);margin:12px 0">${rate}<span style="font-size:25px">%</span></div><div class="score-track">${Array.from({length:r.total},(_,i)=>`<i style="width:${100/r.total}%;background:${i<r.correct?'#50b5a0':'#e9aaaa'}"></i>`).join('')}</div><div class="stats-grid"><div class="statbox"><div class="stat-number">${r.correct}</div><div class="stat-label">答对</div></div><div class="statbox"><div class="stat-number">${r.wrong}</div><div class="stat-label">答错</div></div><div class="statbox"><div class="stat-number">${Math.floor(r.time/60)}:${pad(r.time%60)}</div><div class="stat-label">用时</div></div></div><div class="flex-wrap" style="margin-top:22px"><button class="btn secondary flex-1" data-a="resultErrors">复盘错题</button><button class="btn flex-1" data-a="resultAgain">再练一组</button></div></div><div class="notice" style="margin-top:16px">建议错题二刷前先解释错误原因：知识点不懂、概念混淆，还是审题疏漏。</div>`}
function writingPage(id){let w=D.writing.find(x=>x.id===id);if(!w){nav('quiz');return}let done=state.writingDone.includes(id);layout(`<div class="eyebrow">WRITTEN PRACTICE</div><div class="row space" style="margin-top:8px"><h1 class="page-title">主观题训练</h1><button class="btn sm outline" data-a="backWriting">返回题库</button></div><div class="card"><div class="row space">${subBadge(w.subject)}<span class="pill">${esc(w.source)}</span></div><h2 class="section-title" style="margin-top:19px">${esc(w.stem)}</h2><p class="status-hint">${esc(w.prompt)}</p><label class="setting-label" for="written-draft">自己先写得分点（自动本地保存）</label><textarea class="textarea" id="written-draft" data-writing="${id}" rows="7" placeholder="不要先看参考答案，先写结论、依据、条件、分析……">${esc(state.drafts[id]||'')}</textarea><div class="word-count" id="draft-count">已输入 ${(state.drafts[id]||'').length} 字符</div><div class="flex-wrap" style="margin-top:13px"><button class="btn secondary" data-a="writingReveal" data-id="${id}">显示 / 收起参考提纲</button><button class="btn ${done?'light':'outline'}" data-a="writingDone" data-id="${id}">${done?'✓ 已完成自评':'✓ 我已对照完成自评'}</button></div><div id="writing-answer" class="hidden"><div class="explain-block"><b>答题路线：</b><br>${esc(w.guide)}</div><div class="explain-block warn"><b>参考要点／示例：</b><br><span class="answer-preview">${esc(w.answer)}</span></div><div class="notice" style="margin-top:10px">参考提纲用于自查，不是官方评分细则。真实主观题可能因事实条件变化得出不同结论。</div></div></div>${footer()}`)}
let openedWriting=null;
function profile(){let s=summary(),days=Object.values(state.daily).filter(d=>d.questions||d.minutes).length;return `<div class="eyebrow">YOUR PROGRESS</div><h1 class="page-title">把成长变成看得见的数据</h1><p class="subtitle">所有记录只保存在此设备的浏览器中。可导出备份，再从其他设备导入。</p><div class="stats-grid"><div class="statbox"><div class="stat-number">${days}</div><div class="stat-label">活跃学习日</div></div><div class="statbox"><div class="stat-number">${s.times}</div><div class="stat-label">计划完成分钟</div></div><div class="statbox"><div class="stat-number">${state.wrong.length}</div><div class="stat-label">错题待清理</div></div></div><div class="section"><div class="section-head"><h2 class="section-title">目标与参数</h2></div><div class="card settings-grid"><div><label class="setting-label" for="setting-goal">个人目标总分 / 500</label><input id="setting-goal" class="text-input" type="number" min="0" max="500" value="${state.settings.goal}"/></div><div><label class="setting-label" for="setting-date">初试日期</label><input id="setting-date" class="text-input" type="date" value="${esc(state.settings.examDate)}"/></div><div><label class="setting-label" for="setting-minutes">每日学习分钟（30—360）</label><input id="setting-minutes" class="text-input" type="number" min="30" max="360" step="15" value="${state.settings.dailyMinutes}"/></div><div><label class="setting-label">备考专业与科目</label><div class="surface" style="padding:11px;font-size:12px">035102 法律（法学）<br>101 / 201 / 397 / 497</div></div><div style="grid-column:1/-1"><button class="btn block" data-a="saveSettings">保存设置</button></div></div></div><div class="section"><div class="section-head"><h2 class="section-title">学科掌握度</h2><span class="small muted">以是否纳入复习池为准</span></div><div class="card">${D.subjects.map(s=>{let pct=learnedPct(s.id),ns=D.notes.filter(n=>n.subject===s.id);return `<div style="margin-bottom:14px"><div class="row space small" style="margin-bottom:8px"><b>${esc(s.name)}</b><span class="muted">${ns.filter(n=>state.review[n.id]).length} / ${ns.length}</span></div><div class="progress" style="height:7px"><span style="width:${pct}%;background:${s.color}"></span></div></div>`}).join('')}</div></div><div class="section"><div class="section-head"><h2 class="section-title">官方学习资源</h2></div><div class="source-list">${D.resources.map(r=>`<a class="resource" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"><div class="row space"><div class="resource-title">${esc(r.title)}</div><span style="color:var(--teal)">↗</span></div><div class="tiny muted">${esc(r.agency)}</div><div class="resource-desc" style="margin-top:8px">${esc(r.description)}</div></a>`).join('')}</div></div><div class="section"><div class="section-head"><h2 class="section-title">个人扩展题库</h2><span class="pill teal">${state.customQuestions.length} 道</span></div><div class="card"><p class="status-hint">可在“刷题”页手动新增或导入 JSON 题目。支持7个学科、单选4个选项和解析。</p>${state.customQuestions.slice(-6).reverse().map(q=>`<div class="slim-row"><span class="small" style="max-width:75%">${esc(q.stem.slice(0,45))}${q.stem.length>45?'…':''}</span><button class="btn sm danger" data-a="deleteQuestion" data-id="${q.id}">删除</button></div>`).join('')||'<div class="tiny muted">暂未添加个人题目</div>'}</div></div><div class="section"><div class="section-head"><h2 class="section-title">数据备份与清理</h2></div><div class="card"><div class="flex-wrap"><button class="btn secondary" data-a="export">⇩ 导出记录 JSON</button><button class="btn light" data-a="import">⇧ 导入记录 JSON</button></div><input type="file" id="import-file" accept=".json,application/json" class="hidden"/><div class="divider"></div><p class="status-hint">请定期导出备份。浏览器清理网站数据、无痕模式、不同设备不会自动同步。系统不上传个人学习记录。</p><button class="btn danger sm" data-a="reset">重置所有学习记录</button></div></div><div class="section"><div class="notice"><b>资料说明：</b>站内 ${D.notes.length} 条精选讲义、${allQuestions().length} 道原创客观模拟题（含多选）、${D.writing.length} 道原创主观题、${D.vocab.length} 张英语词卡。非官方真题或培训机构题库，知识点覆盖不等于大纲完整覆盖。法律与时政信息须核对最新权威资料。</div></div>${footer()}`}
function render(){if(openedWriting){writingPage(openedWriting);return}if(page==='quiz'){layout(finishedResult?quizResult():state.quizSession?quizActive():quizSetup())}else if(page==='home')layout(dashboard());else if(page==='plan')layout(plan());else if(page==='learn'){layout(learn());if(learnTab==='notes')renderNotesList()}else layout(profile());updateTimer()}
function updateTimer(){const el=document.getElementById('quiz-timer'),s=state.quizSession;if(!el||!s)return;let sec=Math.floor((Date.now()-s.start)/1000);if(s.duration){let left=Math.max(0,s.duration-sec);el.textContent=`${pad(Math.floor(left/60))}:${pad(left%60)}`;if(left===0){toast('计时结束，已提交本轮练习');showResult();return}}else el.textContent=`${pad(Math.floor(sec/60))}:${pad(sec%60)}`}

function reviewNote(id,rate){let old=state.review[id],step=old?.step||0;let offsets=rate==='again'?1:rate==='easy'?[3,7,14,30][Math.min(step,3)]:[1,3,7,14,30,45][Math.min(step,5)];state.review[id]={step:rate==='again'?0:step+1,due:shiftDate(localISO(),offsets),last:localISO()};save();toast(rate==='again'?'已安排明日再次复习':`已加入复习计划，下次：${state.review[id].due}`);renderNotesList();let dashboardPage=document.querySelector('.page-title');if(page==='home')render()}

function addTaskModal(){let backdrop=document.createElement('div');backdrop.className='dialog-backdrop';backdrop.id='modal';backdrop.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-label="添加个人任务"><div class="row space"><div class="dialog-title">添加个人任务</div><button class="round-btn" data-a="closeModal">×</button></div><label class="setting-label">任务名称</label><input class="text-input" id="custom-title" maxlength="40" placeholder="例如：英语精读一篇"/><label class="setting-label" style="margin-top:13px">预计分钟</label><input class="text-input" id="custom-time" type="number" min="5" max="180" value="20"/><p class="status-hint">自定义任务每天都会显示，可以随时删除。</p><button class="btn block" data-a="confirmTask">保存任务</button></div>`;document.body.appendChild(backdrop)}
function mistakeModal(qid){let old=state.records[qid]||'';let el=document.createElement('div');el.className='dialog-backdrop';el.id='modal';el.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><div class="row space"><div class="dialog-title">错题原因</div><button class="round-btn" data-a="closeModal">×</button></div><div class="filterbar">${['概念不懂','概念混淆','审题疏漏','其他'].map(t=>`<button class="chip ${old===t?'active':''}" data-a="saveReason" data-id="${qid}" data-text="${t}">${t}</button>`).join('')}</div><p class="status-hint">选择后自动保存，错因帮助下一轮针对性复盘。</p></div>`;document.body.appendChild(el)}
function addQuestionModal(){const el=document.createElement('div');el.className='dialog-backdrop';el.id='modal';el.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-label="自定义练习题"><div class="row space"><div class="dialog-title">新建原创单选题</div><button class="round-btn" data-a="closeModal">×</button></div><label class="setting-label">所属学科</label><select class="select" id="custom-q-sub">${D.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><label class="setting-label" style="margin-top:12px">题干</label><textarea id="custom-q-stem" class="textarea" rows="2" placeholder="输入题目" maxlength="600"></textarea>${['A','B','C','D'].map(l=>`<label class="setting-label" style="margin-top:9px">选项 ${l}</label><input id="custom-opt-${l}" class="text-input" maxlength="200"/>`).join('')}<label class="setting-label" style="margin-top:12px">正确答案</label><select class="select" id="custom-q-answer">${['A','B','C','D'].map((l,i)=>`<option value="${i}">${l}</option>`).join('')}</select><label class="setting-label" style="margin-top:12px">解析</label><textarea id="custom-q-explain" class="textarea" rows="2" placeholder="说明为什么正确" maxlength="1000"></textarea><button class="btn block" style="margin-top:15px" data-a="confirmQuestion">保存并加入题库</button></div>`;document.body.appendChild(el)}
function importQuestions(file){if(!file)return;if(file.size>5000000){toast('单个题库文件不得超过5 MB');return}file.text().then(txt=>{const arr=JSON.parse(txt);if(!Array.isArray(arr)||arr.length>3000||!arr.length)throw Error('bad');const items=arr.map((q,i)=>{if(!D.subjects.some(s=>s.id===q.subject)||typeof q.stem!=='string'||q.stem.length<4||q.stem.length>1000||!Array.isArray(q.options)||q.options.length!==4||!q.options.every(v=>typeof v==='string'&&v.length>0&&v.length<=500)||!(Number.isInteger(q.answer)&&q.answer>=0&&q.answer<=3||Array.isArray(q.answer)&&q.answer.length>=2&&q.answer.length<=4&&q.answer.every(a=>Number.isInteger(a)&&a>=0&&a<=3)&&new Set(q.answer).size===q.answer.length)||typeof q.explain!=='string')throw Error('bad');return {id:'u'+Date.now()+'-'+i,subject:q.subject,type:Array.isArray(q.answer)?'multiple':'single',chapter:typeof q.chapter==='string'&&q.chapter.length<50?q.chapter:'个人题库',stem:q.stem,options:q.options,answer:Array.isArray(q.answer)?[...q.answer].sort((a,b)=>a-b):q.answer,explain:q.explain,difficulty:1,source:'自定义题目'}});if(!confirm('将导入 '+items.length+' 道自定义题目。确认导入？'))return;state.customQuestions=[...(state.customQuestions||[]),...items];save();render();toast('已导入 '+items.length+' 道题目')}).catch(()=>toast('题库格式错误，请使用项目中的导入示例模板'))}
function exportFile(){let blob=new Blob([JSON.stringify({app:'law-master-035102',exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='法硕学习记录-'+localISO()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('已生成学习记录备份')}
function onClick(e){let el=e.target.closest('[data-a]');if(!el)return;let a=el.dataset.a,id=el.dataset.id;
if(a==='nav'){openedWriting=null;finishedResult=null;nav(id);return}
if(a==='goSubject'){learnSubject=id;learnTab='notes';nav('learn');return}
if(a==='due'){dueNav();return}
if(a==='taskGo'){let task=getTasks().find(t=>t.id===id);if(!task)return;if(id==='review'){dueNav();return}if(task.subject==='english'&&id==='word'){learnTab='vocab';nav('learn');return}if(id==='read'){quizSubject='english';quizMode='chapter';nav('quiz');return}if(task.subject==='all'){practiceTab='errors';nav('quiz');return}quizSubject=task.subject;quizMode='chapter';practiceTab=id==='second'?'written':'objective';if(practiceTab==='written'){openedWriting=null}nav('quiz');return}
if(a==='removeTask'){if(confirm('确定删除这个自定义任务？')){state.customTasks=state.customTasks.filter(t=>t.id!==id);save();render()}return}
if(a==='addTask'){addTaskModal();return}
if(a==='closeModal'){document.getElementById('modal')?.remove();return}
if(a==='confirmTask'){let title=document.getElementById('custom-title')?.value.trim(),mins=Number(document.getElementById('custom-time')?.value);if(!title||!Number.isFinite(mins)||mins<5||mins>180){toast('请填写任务名称和5—180分钟的时长');return}state.customTasks.push({id:'custom'+Date.now(),title,detail:'自定义每日任务',minutes:mins});save();document.getElementById('modal')?.remove();render();return}
if(a==='learnTab'){learnTab=id;render();return}
if(a==='learnSubject'){learnSubject=id;expandedNote='';render();return}
if(a==='expandNote'){expandedNote=expandedNote===id?'':id;renderNotesList();return}
if(a==='reviewNote'){reviewNote(id,el.dataset.rate);return}
if(a==='saveNote'){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();renderNotesList();return}
if(a==='flipWord'){vocabFlipped=!vocabFlipped;render();return}
if(a==='vocabPrev'){vocabIndex=(vocabIndex-1+D.vocab.length)%D.vocab.length;vocabFlipped=false;render();return}
if(a==='vocabNext'){vocabIndex=(vocabIndex+1)%D.vocab.length;vocabFlipped=false;render();return}
if(a==='vocabKnown'){let id=D.vocab[vocabIndex].id;state.vocabKnown=state.vocabKnown.includes(id)?state.vocabKnown.filter(x=>x!==id):[...state.vocabKnown,id];save();render();return}
if(a==='practiceTab'){practiceTab=id;render();return}
if(a==='quizMode'){quizMode=id;render();return}
if(a==='addQuestion'){addQuestionModal();return}
if(a==='confirmQuestion'){const stem=document.getElementById('custom-q-stem')?.value.trim(),opts=['A','B','C','D'].map(l=>document.getElementById('custom-opt-'+l)?.value.trim()),explain=document.getElementById('custom-q-explain')?.value.trim(),sid=document.getElementById('custom-q-sub')?.value,answer=Number(document.getElementById('custom-q-answer')?.value);if(!stem||stem.length<4||opts.some(o=>!o)||!explain){toast('请填入完整题干、四个选项及答案解析');return}state.customQuestions.push({id:'u'+Date.now(),subject:sid,type:'single',stem,options:opts,answer,explain,difficulty:1,source:'自定义题目'});save();document.getElementById('modal')?.remove();toast('已添加到个人题库');render();return}
if(a==='importQuestions'){document.getElementById('questions-file')?.click();return}
if(a==='startQuiz'){startQuiz();return}
if(a==='wrongRun'){startQuiz({mode:'wrong',subjectId:'all',count:Math.min(state.wrong.length,30)});return}
if(a==='singleQuiz'){startQuiz({mode:'random',subjectId:'all',count:1,oneId:id});return}
if(a==='answer'){let qid=state.quizSession?.ids[state.quizSession.index];if(qid)recordAnswer(qid,Number(id));return}
if(a==='multiToggle'){let ss=state.quizSession,qid=ss?.ids[ss.index];if(!qid||ss.answers[qid]!==undefined)return;ss.choices=ss.choices||{};let choices=ss.choices[qid]||[];ss.choices[qid]=choices.includes(Number(id))?choices.filter(x=>x!==Number(id)):[...choices,Number(id)].sort((a,b)=>a-b);save();render();return}
if(a==='submitMulti'){let ss=state.quizSession,qid=ss?.ids[ss.index],sel=ss?.choices?.[qid]||[];if(qid&&sel.length)recordAnswer(qid,sel);return}
if(a==='quizNext'){let s=state.quizSession;if(!s)return;let qid=s.ids[s.index];if(s.answers[qid]===undefined)return;if(s.index===s.ids.length-1){showResult()}else{s.index++;save();render()}return}
if(a==='quizPrev'){let s=state.quizSession;if(!s)return;s.index=Math.max(0,s.index-1);save();render();return}
if(a==='quitQuiz'){if(!confirm('结束本轮训练并查看结果？未答题按错误统计，但不会计入错题记录。'))return;showResult();return}
if(a==='resultErrors'){finishedResult=null;state.quizSession=null;practiceTab='errors';render();return}
if(a==='resultAgain'){finishedResult=null;startQuiz();return}
if(a==='mistakeReason'){mistakeModal(id);return}
if(a==='saveReason'){state.records[id]=el.dataset.text;save();document.getElementById('modal')?.remove();toast('已记录错题原因');return}
if(a==='removeWrong'){state.wrong=state.wrong.filter(x=>x!==id);save();render();return}
if(a==='openWriting'){openedWriting=id;render();window.scrollTo(0,0);return}
if(a==='backWriting'){openedWriting=null;practiceTab='written';nav('quiz');return}
if(a==='writingReveal'){document.getElementById('writing-answer')?.classList.toggle('hidden');return}
if(a==='writingDone'){state.writingDone=state.writingDone.includes(id)?state.writingDone.filter(x=>x!==id):[...state.writingDone,id];save();toast('主观题自评状态已更新');render();return}
if(a==='saveSettings'){let goal=Number(document.getElementById('setting-goal')?.value),date=document.getElementById('setting-date')?.value,min=Number(document.getElementById('setting-minutes')?.value);if(!Number.isInteger(goal)||goal<0||goal>500||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(min)||min<30||min>360){toast('请输入合法的日期、0—500总分和30—360分钟');return}state.settings={goal,examDate:date,dailyMinutes:min};save();toast('设置已保存');render();return}
if(a==='export'){exportFile();return}
if(a==='import'){document.getElementById('import-file')?.click();return}
if(a==='deleteQuestion'){if(!confirm('确定删除这道自定义题？'))return;state.customQuestions=state.customQuestions.filter(q=>q.id!==id);state.wrong=state.wrong.filter(q=>q!==id);delete state.attempts[id];save();render();return}
if(a==='reset'){if(confirm('警告：确定清空所有进度、答题和错题记录？请先导出备份。')&&confirm('再次确认：此操作无法撤销。')){state=structuredClone(DEFAULT);save();finishedResult=null;openedWriting=null;render();toast('所有学习记录已重置')}return}
}
function onChange(e){let el=e.target;
if(el.matches('[data-check]')){let t=getTasks().find(t=>t.id===el.dataset.check);if(!t)return;let k=localISO()+'|'+t.id;let old=!!state.checks[k];let now=!!el.checked;if(old===now)return;state.checks[k]=now;let d=state.daily[localISO()]||{minutes:0,questions:0,correct:0};d.minutes=Math.max(0,(d.minutes||0)+(now?1:-1)*t.minutes);state.daily[localISO()]=d;save();render();return}
if(el.id==='minutes-range'){state.settings.dailyMinutes=Number(el.value);save();render();return}
if(el.id==='quiz-subject'){quizSubject=el.value;quizChapter='all';render();return}
if(el.id==='quiz-chapter'){quizChapter=el.value;return}
if(el.id==='quiz-type'){quizType=el.value;return}
if(el.id==='quiz-status'){quizStatus=el.value;return}
if(el.id==='quiz-difficulty'){quizDifficulty=el.value;return}
if(el.id==='quiz-count'){quizCount=el.value;return}
if(el.id==='questions-file'){importQuestions(el.files?.[0]);return}
if(el.id==='import-file'){let file=el.files?.[0];if(!file)return;if(file.size>5_000_000){toast('备份文件过大');return}file.text().then(content=>{let obj=JSON.parse(content);if(obj.app!=='law-master-035102'||!obj.data||typeof obj.data.settings!=='object'||typeof obj.data.attempts!=='object')throw Error('格式不支持');if(!confirm('导入将覆盖当前浏览器学习记录，确定继续？'))return;state={...structuredClone(DEFAULT),...obj.data,settings:{...DEFAULT.settings,...obj.data.settings}};save();openedWriting=null;finishedResult=null;render();toast('学习记录导入成功')}).catch(()=>toast('文件格式不正确，请选择本系统导出的JSON'));return}
}
function onInput(e){let el=e.target;if(el.id==='note-search'){searchTerm=el.value;expandedNote='';renderNotesList()}if(el.dataset.writing){state.drafts[el.dataset.writing]=el.value;save();let count=document.getElementById('draft-count');if(count)count.textContent='已输入 '+el.value.length+' 字符'}}
app.addEventListener('click',onClick);app.addEventListener('change',onChange);app.addEventListener('input',onInput);document.body.addEventListener('click',e=>{if(e.target?.id==='modal')e.target.remove();else if(e.target.closest('#modal [data-a]'))onClick(e)});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal')?.remove();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.flashcard')){e.preventDefault();vocabFlipped=!vocabFlipped;render()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
})();

</script></body>
</html>
