<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>归档 - Gonwe</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
body{font-family:"Noto Sans SC",sans-serif;letter-spacing:0.01em}
.bg-mesh{background-color:#fafbfc;background-image:radial-gradient(at 0% 0%,oklch(0.7 0.15 250/0.08) 0px,transparent 50%),radial-gradient(at 100% 100%,oklch(0.7 0.12 200/0.06) 0px,transparent 50%)}
::selection{background:oklch(0.7 0.15 250/0.2)}
</style></head>
<body class="bg-mesh min-h-screen">
<header class="sticky top-0 z-50 border-b border-transparent" style="backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(250,251,252,0.75)">
  <div class="max-w-4xl mx-auto px-6 h-14 flex items-center justify-between">
    <a href="/" class="font-bold text-lg tracking-tight text-base-content">Gonwe</a>
    <nav class="flex items-center gap-6 text-sm font-medium text-base-content/60">
      <a href="/" class="hover:text-base-content transition-colors">首页</a>
      <a href="/archives" class="text-base-content">归档</a>
    </nav>
  </div>
</header>
<main class="max-w-4xl mx-auto px-6 py-16" id="archives">
  <h1 class="text-3xl font-black mb-10 tracking-tight">归档</h1>
  <div id="archiveList" class="space-y-0.5"></div>
</main>
<footer class="border-t border-base-200/60">
  <div class="max-w-4xl mx-auto px-6 py-8 text-center text-sm text-base-content/30">© 2020 – 2026 Gonwe</div>
</footer>
<script>
(async()=>{
  try {
    const resp = await fetch("/index.html");
    const html = await resp.text();
    const links = [...html.matchAll(/href="\/post\.html\?slug=(\d+)"[^>]*>([\s\S]*?)<\/a>/g)];
    const posts = links.map(m => {
      const titleMatch = m[2].match(/font-medium[^>]*>([^<]+)</);
      const dateMatch = m[2].match(/text-xs[^>]*>([^<]+)</);
      return { slug: m[1], title: titleMatch ? titleMatch[1].trim() : "", date: dateMatch ? dateMatch[1].trim() : "" };
    });
    posts.sort((a,b) => b.date.localeCompare(a.date));
    let year = "", html2 = "";
    for (const p of posts) {
      const y = "20" + p.date.substring(0,2);
      if (y !== year) { year = y; html2 += `<h2 class="text-xl font-bold mt-10 mb-3 text-base-content/40 first:mt-0">${year}</h2>`; }
      html2 += `<a href="/post.html?slug=${p.slug}" class="flex items-center justify-between py-2 hover:text-primary transition-colors"><span class="truncate mr-4">${p.title}</span><span class="text-sm text-base-content/30 whitespace-nowrap">${p.date}</span></a>`;
    }
    document.getElementById("archiveList").innerHTML = html2;
  } catch(e) {
    document.getElementById("archiveList").innerHTML = '<p class="text-base-content/40">加载失败，请返回<a href="/" class="text-primary">首页</a></p>';
  }
})();
</script>
</body></html>
